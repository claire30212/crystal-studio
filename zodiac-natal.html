<style>
:root {
  --bg: #F7EFEF; --card: #FFFFFF; --border: #E8DDD5;
  --brown: #5C4A3A; --text: #5C4A3A; --text-light: #8C7A6E;
  --radius: 12px;
  --ink: #3F4458; --ink-soft: #666B7D; /* 版面與素材整合 Pass：正文改用較柔和的 #666B7D（原 #565C74），對比三區底色仍 ≥4.89:1 */

  /* ===== 色彩系統（規格文件第五點：實際從 Hero／三角形圖／太陽月亮圖示抽色，非通用色票）=====
     基礎色（淡）：大範圍背景、留白區域、段落底色用。
     --gold / --rose 為全站互動元素（按鈕／連結／hover-active／focus outline）沿用的既有變數名，
     這裡取代為加深版數值（飽和度+18%、明度降到白字對比 ≥4.5:1 為止），不再是舊的 #C9A96A／#D4B5A8。
     --mist-purple-deep／--sand-deep 為霧紫／沙駝的加深版，供後續星盤解析頁分區背景改用（規格第七點）。 */
  --cream: #FDF8F2;
  --palette-gold: #F6CC99;       /* 暖金（淡）：強調線條、標題底線 */
  --rose-gray: #DAC8BF;          /* 灰玫瑰（淡）：邊框、分隔線、柔和陰影 */
  /* Editorial Watercolor Background Pass（客戶回饋：插畫仍像貼在平面色塊上）
     --sand / --mist-purple / --gold-pale 三個分區底色變數改成幾乎一致的象牙白，彼此差異
     極小，區塊差異完全交給不規則多橢圓水彩暈染負責（見 .facet-section--sun/moon/asc 的
     background 與 .facet-visual::before 柔光層），不再靠底色本身做區隔。 */
  --sand: #FAF8F4;               /* 太陽段落底色 */
  --mist-purple: #F7F5FA;        /* 月亮段落底色 */
  --gold-pale: #FAF7F2;          /* 上升段落底色 */

  --gold: #B06101;      /* 暖金加深版（原 #C9A96A），對比白字 4.61:1 */
  --rose: #9B6951;      /* 灰玫瑰加深版（原 --rose #D4B5A8），對比白字 4.63:1 */
  --mist-purple-deep: #9B638A; /* 霧紫加深版，對比白字 4.62:1（備用，第七點段落背景/互動元素） */
  --sand-deep: #A36820;         /* 沙駝加深版，對比白字 4.61:1（備用，第七點段落背景/互動元素） */

  /* ===== Visual System Pass：集中管理三層色彩邏輯（色彩收斂版）=====
     一、星盤主區（輸入頁／Hero／太陽・月亮・上升三大核心）：
        月光白／淡灰紫／極淺霧藍，三色差異刻意壓得很小，只作極輕微段落區隔，
        不當大面積跳色用——太陽/月亮/上升的差異主要交給插畫、留白、位置與小面積 accent 負責。
     二、整體人格區：比星盤主區深一階的霧紫，作為「星盤閱讀完成」的視覺高潮。
     三、章節轉場（整合區→水晶區）：霧紫→灰粉→暖米→奶茶，四階漸進，見 .act-bridge。
     四、水晶區：色階整體降飽和（奶茶/暖米/裸調三階都改用更柔和的米杏色），琥珀色只保留給
        按鈕、標題小字、水晶標註線、重點裝飾使用，不當整體背景主色。 */
  --star-moonlight: #F9F8FC;   /* 月光白：輸入頁／太陽區／上升區 */
  --star-mist-purple: #F3F1F7; /* 淡灰紫：Hero／月亮區 */
  --star-mist-blue: #F1F4F6;   /* 極淺霧藍：小面積 accent、卡片底色 */
  --summary-mist-purple: #E6E0F0; /* 整體人格區：更深一階的霧紫 */
  --crystal-dusty-rose: #EEDEDA;  /* 章節轉場專用：霧紫與暖米之間的灰粉過渡色 */
  --crystal-milk-tea: #F4ECE4;    /* 水晶區：奶茶（降飽和版） */
  --crystal-warm-beige: #F1E6DC;  /* 水晶區：暖米（卡片/次要底色，降飽和版） */
  --crystal-soft-taupe: #EBDCCF;  /* 水晶區主背景：三階中最深一階，取代原本偏琥珀的主色調 */
  --crystal-amber: #B9793E;       /* 水晶區：琥珀（只用於按鈕/標題小字/標註線/裝飾，不當背景） */
  --crystal-pale-gold: #C9A96A;   /* 水晶區：淡金（與 --gold 同色階，語意上標記水晶區使用） */

  /* icon 插畫專用色（太陽／月亮／上升三個 SVG icon 共用同一套線條與漸層語言） */
  --icon-stroke: #C9A96A;         /* 細霧金描邊，三個 icon 共用 */
  --icon-sun-core-1: #FFF6E2; --icon-sun-core-2: #E8B96A;
  --icon-sun-ray: #D3A85E;
  --icon-moon-outer-1: #F3F1F8; --icon-moon-outer-2: #C9CEE0;
  --icon-moon-inner-1: #F1EEF7; --icon-moon-inner-2: #B9AAC9;
  --icon-asc-glow-1: #FFF8E8; --icon-asc-glow-2: #E3B978;

  /* 固定導覽高度：兩章節首屏／可跳轉錨點都要扣掉這個高度＋緩衝，避免被 fixed nav 蓋住。
     導覽放大後（互動修復 Pass 第五點）整體視覺高度約 65px（top:18px + nav 本身約 47px），
     取整數 90px 留餘裕。 */
  --chapter-nav-height: 90px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif;
  font-weight: 300; min-height: 100vh;
}
h1, h2, .serif { font-family: 'Noto Serif TC', serif; font-weight: 400; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
button, select, input { font-family: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
  outline: 2px solid var(--gold); outline-offset: 2px;
}

.act-inner { max-width: 560px; margin: 0 auto; padding: 0 20px; }

/* ---- 統一手繪占星 icon 系統（<use> 引用 <body> 頂部的 <symbol> sprite，見該處註解）---- */
.zic { display: inline-block; overflow: visible; flex-shrink: 0; }
.zic--inline { width: 1.05em; height: 1.05em; vertical-align: -0.15em; }
.zic--summary { width: clamp(90px, 16vw, 220px); height: clamp(90px, 16vw, 220px); }
.facet-visual-img {
  position: relative; z-index: 1; width: clamp(150px, 25vw, 250px); height: clamp(150px, 25vw, 250px);
  object-fit: contain; filter: saturate(0.82) contrast(0.96) brightness(1.02);
  mix-blend-mode: multiply; /* 已實測：乳白水彩霧邊融進象牙底色，未出現變灰變髒，予以採用 */
}

.scope-note {
  background: rgba(255,255,255,0.6); border: 0.5px solid rgba(155,105,81,0.4);
  border-radius: 10px; padding: 12px 16px; font-size: 12.5px; color: #6A5A50; line-height: 1.8; margin-bottom: 22px;
}
.form-card {
  /* 真正霧面化（Reveal Animation + Crystal Editorial Layout Pass 第一點）：原本 0.96 幾乎全白，
     backdrop-filter 只有 2px，肉眼看不出後方 Hero 水彩透出。改成象牙白漸層(0.48-0.64) + 較深
     backdrop-filter blur，陰影強度降 30-40%，加一圈極淡 inset highlight 做玻璃頂緣反光感——
     但刻意不加任何飽和色系/高對比邊框，避免讀成科技感玻璃卡片。 */
  background: linear-gradient(160deg, rgba(253,248,242,0.64), rgba(253,248,242,0.48));
  border: 0.5px solid rgba(180,143,106,0.14); border-radius: var(--radius);
  padding: 24px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 8px 28px rgba(92,74,58,0.078), inset 0 1px 0 rgba(255,255,255,0.45);
}
.form-row { margin-bottom: 16px; }
.form-label { display: block; font-size: 0.75rem; color: var(--text-light); letter-spacing: 0.08em; margin-bottom: 6px; }
.form-label .optional { color: #B0A89A; }
input[type=date], input[type=time] {
  /* 輸入框背景需與外層霧面卡片明顯區隔（不可同白度）：卡片是 0.48-0.64 的漸層，
     這裡固定用區間內較低的 0.44，讓輸入框讀起來是「卡片上再疊一層更透的欄位」，
     而不是同一塊白色的延伸；同時保留足夠不透明度，日期/時間文字辨識度不受影響。 */
  width: 100%; background: rgba(255,251,247,0.44); border: 1px solid var(--rose-gray); border-radius: 8px;
  padding: 11px 14px; font-family: 'Noto Sans TC', sans-serif; font-size: 0.9rem; color: var(--text);
  min-height: 44px;
}
input[type=date]:focus, input[type=time]:focus { border-color: var(--gold); }
.btn, .btn-secondary, .btn-restart, .btn-return-natal, .facet-toggle, .btn-share {
  min-height: 44px; /* 手機版點擊區域 ≥44px（共通原則）*/
}
.btn {
  width: 100%; background: var(--rose); color: #fff; border: none; border-radius: 8px;
  padding: 13px; font-size: 0.9rem; letter-spacing: 0.06em; cursor: pointer; margin-top: 6px;
}
.btn:hover { opacity: 0.88; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary {
  width: 100%; background: #fff; color: var(--rose); border: 1px solid var(--rose); border-radius: 8px;
  padding: 11px; font-size: 0.85rem; letter-spacing: 0.05em; cursor: pointer; margin-top: 12px;
}
.btn-secondary:hover { background: rgba(212,181,168,0.08); }
/* 水晶陪伴頁收尾動作視覺降級（規格第五點）：這兩個是「離開/重來」的次要動作，
   不該跟水晶建議內容搶視覺份量——返回鍵降為淡色細框按鈕，重新輸入降為純文字連結。 */
.btn-return-natal {
  display: block; width: 100%; max-width: 320px; margin: 28px auto 0;
  background: rgba(255,255,255,0.28); color: var(--crystal-amber);
  border: 0.5px solid rgba(139,94,60,0.4); border-radius: 8px;
  padding: 11px; font-size: 0.85rem; letter-spacing: 0.05em; cursor: pointer;
  text-align: center; transition: background 0.2s ease;
}
.btn-return-natal:hover { background: rgba(255,255,255,0.6); }
@media (min-width: 900px) { .btn-return-natal { max-width: 280px; } }

.btn-restart {
  display: flex; width: fit-content; margin: 10px auto 0; background: transparent; border: none;
  color: var(--text-light); font-size: 0.78rem; letter-spacing: 0.05em; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px; padding: 0 8px; align-items: center; justify-content: center;
}
.btn-restart:hover { color: var(--crystal-amber); }

select#birth-city {
  width: 100%; background: rgba(255,251,247,0.44); border: 1px solid var(--rose-gray); border-radius: 8px;
  padding: 11px 14px; font-family: 'Noto Sans TC', sans-serif; font-size: 0.9rem; color: var(--text);
  min-height: 44px;
}
select#birth-city:focus { border-color: var(--gold); }
.city-field { display: none; }
.city-field.show { display: block; }

.lib-error-banner {
  display: none; background: rgba(196,90,90,0.08); border: 0.5px solid rgba(196,90,90,0.35);
  color: #8A4A4A; border-radius: 10px; padding: 12px 16px; font-size: 12.5px; line-height: 1.8; margin-bottom: 20px;
}
.lib-error-banner.show { display: block; }

.view { display: none; }
.view.show { display: block; }

/* ================= 第一幕：輸入頁 ================= */
.act-input {
  min-height: 100vh; padding: clamp(28px, 6vh, 56px) 0 48px;
  background: var(--star-moonlight); /* Hero 插畫載入前／插畫透明邊緣露出的底色 */
  position: relative; overflow: hidden;
}
/* Hero 主視覺：依螢幕寬度切換桌機／手機版，語法同第九點 RWD 規範（<picture> + media，不是同一張圖縮放） */
.input-hero-picture {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
}
.input-hero-picture img {
  display: block; width: 100%; height: 100%; object-fit: cover;
  /* 入口頁背景降飽和（互動修復 Pass 第二點）：素材本身不換，只用 CSS 降低飽和度/對比、
     微調亮度並整體降低不透明度，避免入口頁被底圖搶走視覺焦點；金色星軌仍需可辨識，
     所以刻意只提高一點點 brightness、不整張壓暗。 */
  filter: saturate(0.67) contrast(0.94) brightness(1.05);
  opacity: 0.73;
}
.input-hero-picture::after {
  content: ''; position: absolute; inset: 0; background: rgba(249,247,244,0.27); pointer-events: none;
}
.act-input .act-inner { max-width: 600px; position: relative; z-index: 1; }
/* 分享連結開啟畫面（呈現層 Pass 第三點）：沿用入口頁的柔霧底色調性，但不重複放 Hero 大圖，
   單純用一張安靜的摘要卡呈現對方分享過來的文字內容。 */
.shared-inner { text-align: center; }
.shared-eyebrow { font-size: 11.5px; color: var(--gold); letter-spacing: 0.16em; margin-bottom: 18px; }
.shared-card {
  background: rgba(255,255,255,0.7); border: 0.5px solid var(--rose-gray); border-radius: var(--radius);
  padding: 28px 24px; margin-bottom: 24px; text-align: left; white-space: pre-wrap;
  font-size: 15px; color: var(--text); line-height: 1.9; box-shadow: 0 8px 28px rgba(92,74,58,0.1);
}
.input-intro { text-align: center; margin-bottom: 26px; }
.input-eyebrow { font-size: 11.5px; color: var(--gold); letter-spacing: 0.2em; margin-bottom: 10px; }
.input-title {
  font-size: clamp(1.5rem, 2.4vw + 1rem, 1.9rem); color: var(--ink); letter-spacing: 0.04em; margin-bottom: 16px;
  position: relative; display: inline-block;
}
.input-title-glow {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 220%; max-width: 480px; height: 280%; z-index: -1; opacity: 0.55; pointer-events: none;
}
.input-facets-intro {
  list-style: none; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--ink-soft); margin-bottom: 12px;
}
.input-facets-intro li { display: flex; align-items: center; gap: 5px; }
.input-facets-intro .facet-glyph { width: 1.2em; height: 1.2em; }
.input-time-hint {
  display: inline-block; font-size: 11px; color: var(--text-light); letter-spacing: 0.08em;
  border: 0.5px solid rgba(176,97,1,0.4); border-radius: 20px; padding: 4px 14px; margin-bottom: 22px;
  background: rgba(255,255,255,0.5);
}

/* ================= 共用：星點呼吸裝飾（Hero 沿用 Phase 1 寫法）================= */
.bg-stars { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.bg-star {
  position: absolute; color: rgba(180,150,110,0.55); line-height: 1;
  animation: starTwinkle 5s ease-in-out infinite;
}
@keyframes starTwinkle { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.5; } }

/* ================= 第二幕：Hero 星盤揭曉 ================= */
.act-hero {
  position: relative; overflow: hidden; text-align: center;
  background:
    radial-gradient(ellipse 60% 50% at 22% 10%, rgba(160,150,195,0.16), transparent 60%),
    radial-gradient(ellipse 55% 50% at 85% 90%, rgba(185,190,205,0.14), transparent 60%),
    var(--star-mist-purple);
  /* 固定導覽遮擋修正（規格第四點）：Hero 是切換章節後第一眼看到的區塊，scrollTo top:0 後
     頂端會被 fixed .chapter-nav 蓋住，這裡把導覽高度補進 padding-top，內容整體往下讓開。 */
  padding-top: calc(var(--chapter-nav-height) + clamp(24px, 5vh, 40px));
  padding-bottom: clamp(24px, 5vh, 40px);
}
.hero-card {
  /* 版面與素材整合 Pass：第一幕高度拉到 78-90vh，Hero 插畫必須是進頁第一眼焦點，不能像縮圖。 */
  position: relative; min-height: clamp(600px, 82vh, 760px);
  display: flex; flex-direction: column;
}
@media (min-width: 900px) {
  .hero-card { min-height: clamp(680px, 86vh, 900px); }
}
.hero-card-inner {
  position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: space-evenly; gap: 18px; padding: 8px 8px 4px;
}
.hero-triangle {
  /* 桌機版放大到 740px（原 680px），手機版另用 media query 明確設為 viewport 82%
     （原本的 padding:20px 對絕對定位的子元素其實無效，屬於死程式碼，一併移除）。 */
  position: relative; width: 100%; max-width: 740px; aspect-ratio: 3 / 2; margin: 0 auto;
}
@media (max-width: 767px) {
  .hero-triangle { width: 82vw; max-width: 82vw; }
}
/* ---- 星盤三角形揭曉動畫（Hero 三角形回歸原圖 Pass 第一點）----
   前兩輪拆解成獨立 icon + SVG 線條 + 水彩霧疊加的做法，無論怎麼調 opacity 都做不出
   chart-triangle-summary.png 原始插畫的手繪水彩線條質感——放棄這個方向，改回直接用
   完整原圖當單一素材。動畫簡化成一件事：整張圖 opacity 0→1 + scale(0.96→1)，
   1.1 秒 ease-out。節點文字（星座名稱/facet 標籤，現有 DOM 文字，不是插畫的一部分）
   維持自己的淡入時序差，比插畫稍晚一點依序浮現，插畫本身完整、不拆解。
   全部由 .hero-card-inner.hero-reveal-play 這個父層 class 觸發，只加一次、不移除，
   JS 端（initHeroTriangleReveal）沿用既有 IntersectionObserver 一次性觸發＋
   unobserve 的模式，確保切換章節來回不會重播，只有整個 hero-container 被
   calcAndRender() 重新渲染（等於重新解讀一次新星盤）時才會是全新節點、重新播放一次。 */
.hero-triangle-img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  opacity: 0; transform: scale(0.96);
  transition: opacity 1.1s ease-out, transform 1.1s ease-out;
  /* 降飽和融合 Pass：整張插畫（雲霧紫/暖橘＋金色線條與符號都在同一張圖裡）套用
     saturate(0.8) 讓雲霧色調跟頁面背景更自然融合；搭配 brightness(1.03) 微幅補償，
     避免降飽和後線條/符號因為同時變暗而糊掉、辨識度下降。 */
  filter: saturate(0.8) brightness(1.03);
}
.hero-reveal-play .hero-triangle-img { opacity: 1; transform: scale(1); }
.hero-node {
  position: absolute; transform: translate(-50%, -50%); width: 150px; text-align: center;
}
.hero-node--sun { left: 50%; top: 12%; }
.hero-node--moon { left: 15%; top: 86%; }
.hero-node--asc { left: 85%; top: 86%; }
.hero-node-text {
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.45s ease-out, transform 0.45s ease-out;
}
.hero-reveal-play .hero-node--sun .hero-node-text { opacity: 1; transform: none; transition-delay: 0.45s; }
.hero-reveal-play .hero-node--moon .hero-node-text { opacity: 1; transform: none; transition-delay: 0.57s; }
.hero-reveal-play .hero-node--asc .hero-node-text { opacity: 1; transform: none; transition-delay: 0.69s; }
.hero-node-facet { position: relative; font-family: 'Noto Serif TC', serif; font-size: 0.85rem; color: var(--ink-soft); letter-spacing: 0.1em; }
.hero-node-sign { position: relative; font-family: 'Noto Serif TC', serif; font-size: 1.35rem; color: var(--ink); margin: 3px 0; }
.hero-node-sign--pending { font-size: 1rem; color: var(--text-light); }
.hero-node-label { position: relative; font-size: 0.78rem; color: var(--text-light); letter-spacing: 0.05em; }
/* 節點 hover 柔光（互動修復 Pass 第七點）：滑過太陽/月亮/上升節點文字時，節點所在位置
   浮現一圈低調的暖金柔光，離開時淡出。用 ::before 疊在文字後面（生成內容在文件順序上
   排在其他子元素之前，繪製順序自然在文字下方，不需要額外設 z-index）。 */
.hero-node::before {
  content: ''; position: absolute; left: 50%; top: 6px; transform: translate(-50%, -50%);
  width: 130px; height: 130px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(226,180,90,0.5) 0%, rgba(226,180,90,0.16) 48%, transparent 72%);
  filter: blur(3px); opacity: 0; transition: opacity 0.4s ease;
}
.hero-node:hover::before, .hero-node:focus-within::before { opacity: 1; }
.hero-tagline {
  position: relative; z-index: 1; font-family: 'Noto Serif TC', serif; font-size: 1.05rem;
  color: var(--ink); letter-spacing: 0.03em; line-height: 1.75; padding: 0 20px; margin-top: -8px;
  opacity: 0; transform: translateY(8px); transition: opacity 0.5s ease-out, transform 0.5s ease-out;
}
.hero-reveal-play .hero-tagline { opacity: 1; transform: none; transition-delay: 0.85s; }
/* reduced-motion：全站已把 transition-duration 壓到 0.001ms，但 transition-delay 不受那條規則
   影響，所以這裡另外把上面幾個 transition-delay 全部歸零，避免變成「先原地等一下才瞬間
   跳出」的怪異結果——要的是直接顯示最終完整狀態，不是有做但快到看不見。 */
@media (prefers-reduced-motion: reduce) {
  .hero-triangle-img, .hero-node-text, .hero-tagline {
    transition-delay: 0s !important;
  }
}
.hero-scroll-cue { position: relative; z-index: 1; font-size: 11px; color: var(--text-light); letter-spacing: 0.1em; }
.hero-scroll-arrow { margin-top: 2px; animation: heroBounce 2.2s ease-in-out infinite; }
@keyframes heroBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

/* ================= 第三幕：太陽／月亮／上升（editorial 交錯排版）=================
   Editorial Watercolor Background Pass：三區底色統一為月光象牙白（--sand/--mist-purple/--gold-pale
   彼此只有極細微差異），區塊差異完全交給不規則、多橢圓疊加的水彩暈染負責，不用整齊的單一
   centered radial-gradient（那樣仍會讀成一顆貼上去的光斑），也不再用分隔線分段——留白本身
   就是分段訊號，讓整頁讀起來像同一本畫冊，不是三張貼了 PNG 的矩形色塊。 */
.facet-section { padding: clamp(96px, 8vw, 140px) 0; position: relative; overflow: hidden; }
.facet-section--sun {
  background:
    radial-gradient(ellipse 46% 55% at 22% 45%, rgba(246,204,153,0.11), transparent 72%),
    radial-gradient(ellipse 34% 42% at 42% 62%, rgba(224,210,190,0.08), transparent 75%),
    radial-gradient(ellipse 30% 36% at 15% 70%, rgba(253,248,240,0.10), transparent 78%),
    var(--sand);
}
.facet-section--moon {
  background:
    radial-gradient(ellipse 44% 52% at 78% 36%, rgba(210,200,224,0.11), transparent 72%),
    radial-gradient(ellipse 32% 40% at 60% 56%, rgba(190,195,205,0.08), transparent 75%),
    radial-gradient(ellipse 30% 38% at 85% 68%, rgba(248,247,252,0.10), transparent 78%),
    var(--mist-purple);
}
.facet-section--asc {
  background:
    radial-gradient(ellipse 42% 58% at 24% 62%, rgba(246,204,153,0.10), transparent 74%),
    radial-gradient(ellipse 34% 46% at 32% 28%, rgba(234,220,195,0.08), transparent 76%),
    radial-gradient(ellipse 30% 36% at 55% 75%, rgba(250,244,230,0.09), transparent 78%),
    var(--gold-pale);
}
.facet-bg-deco {
  position: absolute; z-index: 0; opacity: 0.05; pointer-events: none;
  width: clamp(200px, 34vw, 380px); height: clamp(200px, 34vw, 380px); object-fit: contain;
  filter: saturate(0.68) brightness(1.08) blur(10px);
}
.facet-section--sun .facet-bg-deco { right: -6%; top: 8%; }
.facet-section--moon .facet-bg-deco { left: -6%; bottom: 4%; }
.facet-section--asc .facet-bg-deco { right: -6%; bottom: 0; }
/* 版面與素材整合 Pass：底色質感——用已裁切的水彩暈霧素材(effect-mist-*)當作極低透明度的
   整區背景紋理，取代/補強純 CSS 漸層的平滑感，讓底色本身也有顏料深淺不均的真實水彩質地。
   每區疊兩張不同尺寸/位置的暈霧，避免讀成一整片均勻的色斑。 */
.facet-section::after {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-repeat: no-repeat, no-repeat; mix-blend-mode: multiply;
}
.facet-section--sun::after {
  background-image:
    url('zodiac-natal/assets/illustrations/effect-mist-01.png'),
    url('zodiac-natal/assets/illustrations/effect-mist-06.png');
  background-position: 12% 15%, 88% 78%;
  background-size: 55% auto, 50% auto;
  opacity: 0.07;
}
.facet-section--moon::after {
  background-image:
    url('zodiac-natal/assets/illustrations/effect-mist-04.png'),
    url('zodiac-natal/assets/illustrations/effect-mist-05.png');
  background-position: 85% 12%, 8% 82%;
  background-size: 50% auto, 55% auto;
  opacity: 0.06;
}
.facet-section--asc::after {
  background-image:
    url('zodiac-natal/assets/illustrations/effect-mist-02.png'),
    url('zodiac-natal/assets/illustrations/effect-mist-03.png');
  background-position: 15% 80%, 82% 18%;
  background-size: 52% auto, 50% auto;
  opacity: 0.07;
}
.facet-inner {
  max-width: 640px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1;
  display: flex; flex-direction: column; gap: 14px; align-items: center;
}
.facet-visual { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; }
/* 插畫背後的柔光暈：2-3 層不對稱模糊橢圓（不是單一正圓光球），色調依三區各自水彩色系，
   讓插畫像從水彩霧層裡浮現，而不是貼在背景上的貼圖。 */
.facet-visual::before {
  content: ''; position: absolute; z-index: 0; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 135%; height: 135%; filter: blur(30px); pointer-events: none;
}
.facet-section--sun .facet-visual::before {
  background:
    radial-gradient(ellipse 58% 62% at 36% 40%, rgba(255,253,247,0.22), transparent 70%),
    radial-gradient(ellipse 42% 46% at 64% 58%, rgba(246,204,153,0.18), transparent 72%),
    radial-gradient(ellipse 36% 40% at 48% 68%, rgba(224,210,190,0.14), transparent 75%);
}
.facet-section--moon .facet-visual::before {
  background:
    radial-gradient(ellipse 58% 62% at 62% 38%, rgba(248,247,252,0.22), transparent 70%),
    radial-gradient(ellipse 42% 46% at 38% 60%, rgba(210,200,224,0.18), transparent 72%),
    radial-gradient(ellipse 34% 40% at 55% 68%, rgba(190,195,205,0.13), transparent 75%);
}
.facet-section--asc .facet-visual::before {
  background:
    radial-gradient(ellipse 58% 62% at 40% 60%, rgba(250,244,230,0.22), transparent 70%),
    radial-gradient(ellipse 42% 46% at 62% 42%, rgba(246,204,153,0.17), transparent 72%),
    radial-gradient(ellipse 34% 40% at 48% 30%, rgba(225,215,200,0.13), transparent 75%);
}
/* 版面與素材整合 Pass：三區不再靠底色區分，改用構圖／線條差異化——
   太陽：插畫略大、核心句是視覺焦點，用開放明亮的態度呈現；
   月亮：文字區略內縮、留更多周邊留白，讀起來比較私密安靜；
   上升：加入極淡晨光水平線，呼應「升起」的方向感。 */
.facet-section--sun .facet-visual-img { width: clamp(230px, 23vw, 336px); height: clamp(230px, 23vw, 336px); }
.facet-section--sun .facet-highlight { color: var(--ink); font-size: clamp(1.35rem, 1.1vw + 1rem, 1.65rem); }
@media (min-width: 900px) {
  .facet-section--moon .facet-content { max-width: 460px; }
}
.facet-section--asc::before {
  content: ''; position: absolute; z-index: 0; pointer-events: none;
  left: 6%; right: 6%; bottom: 16%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(176,97,1,0.25) 25%, rgba(176,97,1,0.25) 75%, transparent);
}
.facet-content { width: 100%; text-align: center; }
.facet-eyebrow { font-size: 11.5px; color: var(--ink-soft); letter-spacing: 0.14em; margin-bottom: 10px; }
.facet-sign-name { font-size: clamp(1.75rem, 1.5vw + 1rem, 2.25rem); color: var(--ink); margin-bottom: 12px; }
.facet-sign-name--pending { color: var(--ink-soft); font-size: 1.4rem; }
.facet-highlight { font-size: clamp(1.25rem, 1vw + 1rem, 1.5rem); color: var(--ink-soft); line-height: 1.85; margin-bottom: 16px; }
.facet-keywords {
  list-style: none; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 18px;
}
.facet-keywords li {
  font-size: 12px; color: var(--ink); background: rgba(255,255,255,0.55);
  border: 0.5px solid rgba(201,169,106,0.4); border-radius: 20px; padding: 5px 13px;
}
.facet-toggle {
  display: inline-flex; align-items: center; gap: 8px; background: transparent;
  border: 0.5px solid rgba(63,68,88,0.3); color: var(--ink); border-radius: 20px;
  padding: 9px 18px; font-size: 0.82rem; letter-spacing: 0.05em; cursor: pointer;
}
.facet-toggle:hover { background: rgba(255,255,255,0.4); }
.facet-toggle-icon { color: var(--gold); font-size: 1rem; line-height: 1; }
/* 展開後的「完整解析」閱讀區：獨立於 facet-inner 的三欄摘要版面之外，
   置於原本內容區下方，單欄連續閱讀，不做窄欄 newspaper layout、不做三卡並排。 */
.facet-detail {
  position: relative; z-index: 1; margin-top: 24px; text-align: left; background: rgba(255,255,255,0.6);
  border: 0.5px solid rgba(201,169,106,0.3); border-radius: var(--radius); padding: 28px 20px;
}
.facet-detail[hidden] { display: none; }
/* 展開時平滑顯示：hidden 屬性移除、元素重新進入 display 流程時animation會自動重播，
   維持 aria-expanded/aria-controls/hidden 的原生 disclosure 邏輯完全不動，只加視覺效果。 */
.facet-detail:not([hidden]) { animation: facetDetailReveal 0.45s ease; }
@keyframes facetDetailReveal {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .facet-detail:not([hidden]) { animation: none; }
}
.facet-block { margin-bottom: 36px; }
.facet-block:last-child { margin-bottom: 0; }
.facet-block-label {
  display: flex; align-items: baseline; gap: 10px;
  font-size: 0.8rem; color: var(--ink-soft); letter-spacing: 0.1em; margin-bottom: 14px;
}
.facet-block-num {
  font-family: 'Noto Serif TC', serif; font-size: 0.95rem; color: var(--gold);
  border-bottom: 0.5px solid rgba(201,169,106,0.5); padding-bottom: 2px;
}
.facet-block p { font-size: 16px; color: var(--text); line-height: 1.85; margin-bottom: 16px; }
.facet-block p:last-child { margin-bottom: 0; }
.facet-pending-row { display: flex; gap: 12px; justify-content: center; font-family: 'Noto Serif TC', serif; font-size: 1.05rem; color: var(--ink); margin-bottom: 12px; }
.facet-pending-sep { color: var(--text-light); }
.facet-pending-hint, .facet-error-hint {
  max-width: 440px; margin: 0 auto 14px; text-align: left; border-radius: 10px; padding: 12px 16px;
  font-size: 12.5px; line-height: 1.8;
}
.facet-pending-hint { background: rgba(212,181,168,0.12); border: 0.5px solid rgba(212,181,168,0.4); color: #6A5A50; }
.facet-error-hint { background: rgba(196,90,90,0.08); border: 0.5px solid rgba(196,90,90,0.3); color: #8A4A4A; }
.facet-note, .facet-info {
  max-width: 440px; margin: 12px auto 0; font-size: 12px; color: var(--ink-soft); line-height: 1.7;
}
.facet-connector { display: none; }

@media (min-width: 900px) {
  /* 版面與素材整合 Pass：桌機版容器加寬到 1240px（原 1180px 讀起來像手機頁放大版），
     插畫也放大（原本刻意縮小是舊版「密度收斂」決定，這輪反過來——插畫要撐滿更寬的欄位，
     才不會在 1240px 容器裡顯得單薄）。 */
  .facet-visual-img { width: clamp(220px, 22vw, 320px); height: clamp(220px, 22vw, 320px); }
  .summary-headline { font-size: clamp(38px, 3.2vw, 46px); }
  .facet-eyebrow { margin-bottom: 7px; }
  .facet-sign-name { margin-bottom: 8px; }
  .facet-highlight { margin-bottom: 10px; }
  .facet-keywords { margin-bottom: 12px; }
  /* editorial 排版：插畫 40% / 文字 50% / 中間 10% 呼吸空間，用「4fr 1fr 5fr」grid 而非
     flex+gap 表示——flex 的 gap 是疊加在 flex-basis 之外的額外空間，40%+50%+gap 容易超出
     100% 造成溢出；三欄 grid 的中間空欄本身就是那 10%，比例永遠精確、不受 gap 疊加影響。
     插畫必須是視覺主角，因此欄寬本身就決定了它至少佔滿版面 40%，不是縮小塞在角落。 */
  .facet-inner {
    max-width: 1240px; display: grid; grid-template-columns: 4fr 1fr 5fr; align-items: center; text-align: left;
  }
  .facet-content { text-align: left; grid-column: 3; grid-row: 1; }
  .facet-highlight { max-width: 640px; }
  .facet-keywords { justify-content: flex-start; }
  .facet-pending-hint, .facet-error-hint, .facet-note, .facet-info { margin-left: 0; }
  .facet-pending-row { justify-content: flex-start; }
  /* facet-visual/facet-content 都要固定 grid-row:1——月亮區欄位互換（visual→col3）時，
     若只靠 auto-placement，grid 的自動排列游標會依 DOM 順序單向前進，導致 visual 佔滿
     col3 後游標已經超過 col1，content 找不到 row1 的位置而被擠到 row2，插畫因此只在
     215px 高的獨立列裡置中，相對於整個區塊反而視覺上偏高。明確鎖定 grid-row 才能讓三欄
     永遠同列，align-items:center 才會對到正確的高度基準。 */
  .facet-visual { grid-column: 1; grid-row: 1; }
  /* 插畫與文字之間的呼吸欄（grid-column:2）加一條極淡的水彩暈染直線，視覺上把兩者輕輕連起來，
     不搶戲——用漸層兩端透明、中段極低透明度金色，比一條實線更接近「暈染」而非「分隔線」的語感。 */
  .facet-connector {
    display: block; grid-column: 2; grid-row: 1; justify-self: center; align-self: center;
    width: 1px; height: 68%;
    background: linear-gradient(180deg, transparent, rgba(201,169,106,0.3) 35%, rgba(201,169,106,0.3) 65%, transparent);
  }
  /* 太陽／上升＝插畫左・文字右＝跟上面預設的欄位指定（visual=col1／content=col3）相同，不用再覆寫。
     月亮＝文字左・插畫右＝唯一需要互換欄位的一區。 */
  .facet-section--moon .facet-visual { grid-column: 3; }
  .facet-section--moon .facet-content { grid-column: 1; }
  /* 展開完整解析後：桌機版改為獨立的單欄閱讀容器，置於原本摘要內容區（facet-inner）下方，
     不再是個性/情感/建議三欄並列——三欄版面在桌機寬螢幕下每欄過窄、中文頻繁斷行，改為
     720-780px 的連續閱讀欄寬，貼近書籍/文章的舒適閱讀密度。 */
  .facet-detail {
    max-width: 760px; margin: 32px auto 0; padding: 36px 44px;
  }
  .facet-block { margin-bottom: 48px; }
  .facet-block:last-child { margin-bottom: 0; }
  .facet-block p { font-size: 17px; line-height: 1.9; }
}

/* ================= 第四幕：整體人格交織 ================= */
.act-summary { background: var(--summary-mist-purple); padding: 56px 0; position: relative; overflow: hidden; }
.summary-symbol-overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.summary-symbol { position: absolute; opacity: 0.07; filter: grayscale(0.35) saturate(0.75); }
.summary-symbol--sun { top: -4%; left: 4%; width: clamp(90px, 16vw, 220px); height: clamp(90px, 16vw, 220px); }
.summary-symbol--moon { bottom: -6%; left: 46%; width: clamp(70px, 13vw, 180px); height: clamp(70px, 13vw, 180px); }
.summary-symbol--asc { top: 20%; right: -2%; width: clamp(80px, 14vw, 200px); height: clamp(80px, 14vw, 200px); }
.summary-inner { max-width: 720px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }
/* 摘要重新分層（規格第六點）：只有「最核心一句」（\n 之前那段）用大字級當主標題，
   桌機 38-46px／手機 27-32px；其餘沿用既有文字的部分降到 17-19px 的補充摘要，
   不再讓整段長句全部套用標題級字體，也是斷行不自然的主因。 */
.summary-headline {
  font-size: clamp(27px, 7vw, 32px); color: var(--ink); text-align: center;
  line-height: 1.4; letter-spacing: 0.02em; margin: 0 auto 12px; max-width: 720px;
}
.summary-headline-sub {
  font-size: clamp(17px, 2.4vw, 19px); color: var(--ink-soft); text-align: center;
  line-height: 1.75; letter-spacing: 0.01em; margin: 0 auto 34px; max-width: 620px;
}
/* Illustration Finish Pass：三張卡片改「交織感」——半透明淡紫面板取代完整白底框，
   卡片之間用一條細金線＋每卡一個金色小圓點串起來，讀起來像同一條敘事線上的三個停點，
   不是三張各自獨立的卡片。 */
.summary-insights { position: relative; padding-left: 22px; }
.summary-insights::before {
  content: ''; position: absolute; left: 4px; top: 8px; bottom: 8px; width: 1px;
  background: linear-gradient(180deg, transparent, rgba(201,169,106,0.4) 10%, rgba(201,169,106,0.4) 90%, transparent);
}
.summary-insight {
  position: relative; margin-bottom: 20px;
  background: rgba(190,175,220,0.22); border-radius: var(--radius); padding: 18px 20px;
}
.summary-insight:last-of-type { margin-bottom: 0; }
.summary-insight::before {
  content: ''; position: absolute; left: -20px; top: 22px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 0 3px rgba(243,241,247,0.75);
}
.summary-insight-title { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 8px; }
.summary-insight-icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85; }
.summary-insight p { font-size: 1.05rem; color: var(--ink-soft); line-height: 1.9; }
.summary-upgrade-hint { font-size: 12px; color: var(--ink-soft); margin-top: 20px; line-height: 1.7; text-align: center; }
.summary-actions { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 28px; }
/* 分享按鈕（互動修復 Pass 第一點）：先前是 disabled 的假互動，現在接上
   Web Share API／Clipboard API 真的可以動，樣式同步從「不能點」改回可互動的實色邊框按鈕。 */
.btn-share {
  display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.6);
  border: 0.5px solid var(--gold); color: var(--ink); border-radius: 24px; padding: 11px 22px;
  font-size: 0.85rem; letter-spacing: 0.05em; cursor: pointer; transition: background 0.2s ease;
}
.btn-share:hover { background: rgba(255,255,255,0.85); }
/* 次要分享選項（呈現層 Pass 第三點）：純文字連結，視覺份量明顯低於主要的分享連結按鈕 */
.share-secondary-link {
  background: none; border: none; color: var(--text-light); font-size: 0.78rem; letter-spacing: 0.03em;
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 4px 8px;
}
.share-secondary-link:hover { color: var(--gold); }
.share-status {
  min-height: 1.4em; font-size: 12px; color: #5A7A4E; letter-spacing: 0.03em;
}
.share-status--error { color: #8A4A4A; }

/* ================= 章節轉換：從星盤解析進入水晶陪伴 ================= */
.act-bridge {
  /* 整合區→水晶區的章節轉場，四階漸進：霧紫→灰粉→暖米→奶茶，不是單一跳色 */
  background: linear-gradient(180deg,
    var(--summary-mist-purple) 0%, var(--crystal-dusty-rose) 38%,
    var(--crystal-warm-beige) 70%, var(--crystal-milk-tea) 100%);
  padding: 52px 0 46px; text-align: center;
}
.bridge-text { font-family: 'Noto Serif TC', serif; font-size: 1rem; color: var(--ink-soft); line-height: 2; max-width: 440px; margin: 0 auto 22px; }
.btn-bridge-cta {
  display: inline-flex; align-items: center; gap: 8px; background: var(--crystal-amber); color: #fff;
  border: none; border-radius: 24px; padding: 13px 26px; font-size: 0.88rem; letter-spacing: 0.08em;
  cursor: pointer; box-shadow: 0 6px 18px rgba(185,121,62,0.28);
}
.btn-bridge-cta:hover { opacity: 0.9; }
.btn-bridge-cta-icon { font-size: 0.95rem; }

/* ================= 水晶區獨立 Hero／章節標題（第二章入口）================= */
.crystal-hero {
  /* 章節轉場柔化（互動修復 Pass 第六點）：三階漸層終點刻意等於 .act-crystal 的實色背景
     （--crystal-soft-taupe），標題區跟下方奶茶內容區之間就不會有可辨識的硬色帶。 */
  background: linear-gradient(180deg, #F7F3EF 0%, #F1E6DC 62%, #EBDCCF 100%);
  /* 固定導覽遮擋修正（規格第四點）：水晶章節的首屏標題，同理補上導覽高度的 padding-top。 */
  padding-top: calc(var(--chapter-nav-height) + 46px);
  padding-bottom: 30px; text-align: center;
}
.crystal-hero-eyebrow { font-size: 11.5px; color: var(--crystal-amber); letter-spacing: 0.24em; margin-bottom: 14px; }
.crystal-hero-title { font-size: clamp(2.25rem, 2.2vw + 1.5rem, 3rem); color: var(--brown); letter-spacing: 0.06em; margin-bottom: 14px; }
.crystal-hero-sub { font-size: 13px; color: var(--text-light); line-height: 1.9; max-width: 440px; margin: 0 auto; }

.act-crystal { background: var(--crystal-soft-taupe); padding: 8px 0 60px; position: relative; overflow: hidden; }
.act-crystal .act-inner { max-width: 560px; position: relative; z-index: 1; }
/* 水晶陪伴頁美化：頁面整體背景疊一張手鍊底圖做局部氛圍，極低透明度＋multiply 混合，
   讓素材本身的白霧邊緣融進奶茶色背景，不搶走文字卡片的注意力。
   素材前處理 Pass 第四點：改用 crystal-loose-stones-raw.png 裁出的彩色珠款手鍊
   （crystal-bracelet-cutout.png，使用者選定版本），取代舊的素描線稿模板，
   opacity 落在規格要求的 0.08-0.14 區間；同時加上極慢速漂浮動畫（第五點：
   6-8 秒循環，translateY + 些微 rotate），是本輪新增的第二種動態。 */
.act-crystal::before {
  content: ''; position: absolute; z-index: 0; pointer-events: none;
  right: -10%; bottom: -8%; width: min(60%, 460px); aspect-ratio: 519 / 608;
  background: url('zodiac-natal/assets/illustrations/crystal-bracelet-cutout.png') no-repeat center / contain;
  opacity: 0.12; mix-blend-mode: multiply;
  animation: braceletDrift 7s ease-in-out infinite;
}
@keyframes braceletDrift {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-14px) rotate(1.6deg); }
}
/* 容器修正 Pass 第三點：不新增第四種動態類型——這裡疊加的是同一個 .act-crystal 手鍊裝飾的
   延伸，跟 ::before 共用同一個 braceletDrift（位移／旋轉完全同步，讀起來像貼在同一條
   手鍊上跟著漂浮，不是另一個獨立飄浮的東西），只多疊一個 braceletGlint 讓兩點珠子反光位置
   做極輕微的 opacity 明滅（0.3-0.6，幅度小、週期慢，像自然反光而非快速閃爍）。
   同一個 ::after 用兩層 background-image 各自定位在兩顆珠子反光處，不需要額外的 DOM 節點。 */
.act-crystal::after {
  content: ''; position: absolute; z-index: 0; pointer-events: none;
  right: -10%; bottom: -8%; width: min(60%, 460px); aspect-ratio: 519 / 608;
  background-repeat: no-repeat, no-repeat;
  background-image:
    url('zodiac-natal/assets/illustrations/effect-sparkle-small-01.png'),
    url('zodiac-natal/assets/illustrations/effect-sparkle-small-03.png');
  background-position: 25% 14%, 27% 68%;
  background-size: 22px auto, 17px auto;
  opacity: 0.45;
  animation: braceletDrift 7s ease-in-out infinite, braceletGlint 3.6s ease-in-out infinite;
}
@keyframes braceletGlint {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.6; }
}
@media (prefers-reduced-motion: reduce) {
  .act-crystal::before { animation: none; }
  .act-crystal::after { animation: none; }
}

/* ---- 通用解析區塊樣式殘留（section-renderer.js 仍載入但目前不再由頁面呼叫，樣式保留避免影響其單元測試以外的既有引用）---- */
.reading-section {
  background: var(--card); border: 0.5px solid rgba(201,169,106,0.4); border-radius: var(--radius);
  padding: 22px 24px; margin-bottom: 18px; box-shadow: 0 4px 20px rgba(92,74,58,0.06);
}
.section-header { display: flex; align-items: center; gap: 10px; }
.section-icon { font-size: 1.3rem; }
.section-title { font-family: 'Noto Serif TC', serif; font-size: 1.05rem; color: var(--brown); flex: 1; letter-spacing: 0.04em; }
.section-status { font-size: 11px; padding: 4px 11px; border-radius: 20px; letter-spacing: 0.05em; white-space: nowrap; }
.section-status--complete { background: rgba(122,150,110,0.14); color: #5A7A4E; }
.section-status--ambiguous, .section-status--unavailable { background: rgba(196,140,60,0.12); color: #8A6A2E; }
.section-status--error { background: rgba(196,90,90,0.12); color: #8A4A4A; }
.section-note { font-size: 12px; color: var(--text-light); margin-top: 8px; line-height: 1.7; }
.section-body { margin-top: 16px; }
.hint-box, .caveat-box {
  margin-top: 12px; text-align: left; border-radius: 10px; padding: 12px 16px; font-size: 12.5px; line-height: 1.8;
}
.hint-box { background: rgba(212,181,168,0.1); border: 0.5px solid rgba(212,181,168,0.35); color: #6A5A50; }
.caveat-box { background: rgba(196,140,60,0.08); border: 0.5px solid rgba(196,140,60,0.35); color: #8A6A2E; }
.info-box { background: rgba(120,142,163,0.08); border: 0.5px solid rgba(120,142,163,0.3); color: #55677A; }
.error-box {
  margin-top: 12px; text-align: left; border-radius: 10px; padding: 12px 16px; font-size: 12.5px; line-height: 1.8;
  background: rgba(196,90,90,0.08); border: 0.5px solid rgba(196,90,90,0.3); color: #8A4A4A;
}

.disclaimer-footer {
  font-size: 11px; color: var(--text-light); text-align: center; line-height: 1.9;
  margin-top: 26px; padding: 18px 6px 0; border-top: 0.5px solid var(--border);
}


/* ---- 水晶推薦示意圖（水彩手鍊設計稿風格 SVG mockup，見 buildCrystalBraceletSvg()）----
   米白紙張肌理感用一層極淡 feTurbulence noise + 暖米漸層模擬；珠子＝圓形色塊＋咖啡金細描邊；
   手鍊線＝一條咖啡金細線；旁邊細線＋文字標註水晶名稱＝珠寶設計草圖常見的 callout 標註法。 */
/* 水晶陪伴頁面美化 Pass：整個水晶建議區改成單一 .crystal-card 網格容器，
   內含四個區塊（示意圖／總覽說明／太陽清單／情境微調），桌機用 grid-template-areas
   排成「圖+總覽並排 → 清單整列 → 微調並排」三列，手機退回單欄依 DOM 順序堆疊。 */
.crystal-illustration {
  /* 移除硬邊框（呈現層 Pass 第二點）：拿掉原本的半透明白底＋邊框，不再是「圖被裝在盒子裡」——
     示意圖本身（buildCrystalBraceletSvg）的米白紙張漸層跟外層 --crystal-milk-tea 色調本來就
     很接近，拿掉外層這層邊框/底色之後，圖會直接融進卡片背景，邊緣不再有一圈硬直角方框。 */
  background: none; border: none; padding: 8px 4px 4px; margin-bottom: 24px; position: relative;
}
.crystal-illustration-svg { display: block; width: 100%; height: auto; }
/* 水晶配對輪質感提升 Pass：球體光澤極慢速明暗呼吸（9 秒一輪，brightness 1→1.08→1），
   每顆珠子各自的 animation-delay 在 buildCrystalBraceletSvg() 裡用 pseudoJitter 算出，
   同時開始但不同步高峰，讀起來像自然光線微微變化，不是整批一起閃。 */
.crystal-bead-luster { animation: crystalBeadLuster 9s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes crystalBeadLuster {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.09); }
}
@media (prefers-reduced-motion: reduce) {
  .crystal-bead-luster { animation: none; }
}
.crystal-illustration-badge {
  position: absolute; top: 16px; right: 16px; background: rgba(185,121,62,0.1);
  border: 0.5px solid rgba(185,121,62,0.4); color: var(--crystal-amber); border-radius: 20px;
  padding: 4px 12px; font-size: 11px; letter-spacing: 0.08em;
}
.crystal-illustration-caption {
  font-size: 11.5px; color: var(--text-light); line-height: 1.8; text-align: center;
  margin-top: 10px; padding: 0 8px;
}
/* ---- 水晶建議卡片（外層容器）----
   取消「完整矩形白框包住所有內容」的報表式外觀——改用半透明紙感浮層（漸層＋blur）
   取代不透明實色＋硬邊框，陰影也從有明確方向的投影改成無方向性的柔光暈染，讀起來
   不再是一張界線分明的卡片。容器修正 Pass：改回 overflow:hidden——示意圖不再需要
   超出卡片框（見下方 900px media query，已拿掉 bleed transform），恢復裁切可以讓
   右下角手鍊裝飾的邊緣維持乾淨，不會有任何內容真的溢出卡片本體。 */
.crystal-card {
  background: linear-gradient(165deg, rgba(247,240,231,0.62), rgba(244,236,228,0.42));
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: none; border-radius: calc(var(--radius) + 6px);
  padding: 22px 24px; margin-bottom: 18px;
  box-shadow: 0 0 70px rgba(185,121,62,0.1);
  position: relative; overflow: hidden;
}
/* 手鍊通用模板：卡片右下角的低透明度背景裝飾——放大到 1.5-2 倍、只露出局部（overflow:hidden 裁切），
   pointer-events:none 確保不影響文字選取或點擊，也不會干擾上方 Rule Engine 動態排列圖的辨識度。 */
.crystal-card-bg-deco {
  position: absolute; z-index: 0; pointer-events: none; opacity: 0.055;
  width: clamp(240px, 42vw, 340px); height: auto; object-fit: contain;
  right: -16%; bottom: -20%;
  filter: saturate(0.7) brightness(1.05);
}
.crystal-card > *:not(.crystal-card-bg-deco) { position: relative; z-index: 1; }
.crystal-overview { margin-bottom: 24px; }
.crystal-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
/* 水晶建議圖示（互動修復 Pass 第三點）：換成既有星塵水彩素材，取代跟畫面調性不搭的 emoji */
.crystal-card-icon { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; }
.crystal-card-title { font-family: 'Noto Serif TC', serif; font-size: 1.05rem; color: var(--brown); letter-spacing: 0.04em; }
.crystal-card-subtitle { font-size: 12px; color: var(--text-light); line-height: 1.8; margin: 8px 0 0; }
/* 水晶推薦總覽補充 Pass 第二點：右側「水晶建議」欄位補充內容——主水晶名稱字級加大，
   月亮/上升微調用細金色小標籤（不是純文字段落），陪伴象徵用輕量膠囊呈現（沿用跟
   .facet-keywords 同一種淡色膠囊語彙，維持全站標籤視覺一致）。 */
.crystal-overview-label {
  display: block; font-size: 0.72rem; color: var(--crystal-amber); letter-spacing: 0.1em; margin-bottom: 6px;
}
.crystal-overview-main { margin: 16px 0 14px; }
.crystal-overview-main-names {
  font-family: 'Noto Serif TC', serif; font-size: 1.15rem; color: var(--brown); line-height: 1.7;
}
.crystal-overview-tune-tags { margin-bottom: 16px; }
.crystal-overview-tune-row {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;
}
.crystal-overview-tune-row:last-child { margin-bottom: 0; }
.crystal-overview-tune-label {
  font-size: 0.72rem; color: var(--text-light); letter-spacing: 0.06em; white-space: nowrap;
}
.crystal-overview-chip {
  display: inline-block; font-size: 12px; color: var(--crystal-amber);
  border: 0.5px solid rgba(185,121,62,0.45); border-radius: 20px; padding: 3px 11px;
  background: rgba(185,121,62,0.07);
}
.crystal-overview-symbol-block { margin-top: 2px; }
.crystal-overview-symbol-tags {
  list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px;
}
.crystal-overview-symbol-tags li {
  font-size: 11.5px; color: var(--text); background: rgba(255,255,255,0.55);
  border: 0.5px solid rgba(201,169,106,0.35); border-radius: 16px; padding: 4px 10px;
}

.crystal-group { margin-bottom: 18px; }
.crystal-group:last-child { margin-bottom: 0; }
.crystal-group-label { font-size: 0.75rem; color: var(--text-light); letter-spacing: 0.1em; margin-bottom: 8px; }
.crystal-group.crystal-entries-panel {
  margin-bottom: 24px; padding-top: 20px; border-top: 0.5px solid rgba(185,121,62,0.2);
}

/* 每顆水晶獨立 .crystal-item-card：手機單欄、768px 以上兩欄 grid，維持簡潔對稱的骨架——
   每張卡大小一致，不做「第一張特別大」的編輯式主打卡片。每張卡疊一層極淡水晶色系差異
   （見 nth-child 色票），統一色調系統下做最小限度的區隔，不做成七彩。
   容器修正 Pass 第四點：卡片之間留白加大到 20-24px 呼吸感更明顯；邊框改極淡、接近看不見。
   進場動畫：淡入＋輕微上移。 */
.crystal-entries { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 768px) {
  .crystal-entries { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
}
.crystal-item-card {
  background: rgba(255,255,255,0.42); border: 0.5px solid rgba(185,145,95,0.08);
  border-radius: 16px; padding: 26px; position: relative; overflow: hidden;
  animation: crystalItemIn 0.5s ease-out backwards;
}
.crystal-entries .crystal-item-card:nth-child(1) { animation-delay: 0.05s; }
.crystal-entries .crystal-item-card:nth-child(2) { animation-delay: 0.12s; }
.crystal-entries .crystal-item-card:nth-child(3) { animation-delay: 0.19s; }
.crystal-entries .crystal-item-card:nth-child(4) { animation-delay: 0.26s; }
.crystal-entries .crystal-item-card:nth-child(5) { animation-delay: 0.33s; }
@keyframes crystalItemIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .crystal-item-card { animation-delay: 0s !important; }
}
/* 極淡水晶色系背景差異：五色輪替（玫瑰／薰衣草／琥珀沙／霧藍／淡金），彼此差異極小，
   疊在既有半透明白底之上，維持整體米杏色調統一，不是七彩繽紛的效果。 */
.crystal-entries .crystal-item-card:nth-child(5n+1) { background: linear-gradient(160deg, rgba(255,255,255,0.42), rgba(233,210,214,0.24)); }
.crystal-entries .crystal-item-card:nth-child(5n+2) { background: linear-gradient(160deg, rgba(255,255,255,0.42), rgba(219,214,232,0.22)); }
.crystal-entries .crystal-item-card:nth-child(5n+3) { background: linear-gradient(160deg, rgba(255,255,255,0.42), rgba(232,219,196,0.26)); }
.crystal-entries .crystal-item-card:nth-child(5n+4) { background: linear-gradient(160deg, rgba(255,255,255,0.42), rgba(206,218,224,0.22)); }
.crystal-entries .crystal-item-card:nth-child(5n+5) { background: linear-gradient(160deg, rgba(255,255,255,0.42), rgba(238,222,180,0.22)); }
/* 散石裝飾：crystal-loose-stones-raw.png 裁出的獨立散石，當每張卡片右上角的小型裝飾。
   卡片圖示統一 Pass：top/right 改成正值內縮（原本 -6px 貼齊卡片邊緣，疊上 overflow:hidden
   跟 16px 圓角之後，圖示邊角會被圓角裁切遮住一小塊，讀起來像「被切一半」）——內縮 10px
   讓圖示完整落在圓角裁切範圍以內，四周都看得到完整散石輪廓，不再有任何一邊被裁掉。 */
.crystal-item-stone-deco {
  position: absolute; top: 10px; right: 10px; z-index: 0; pointer-events: none;
  width: clamp(48px, 9vw, 72px); height: auto; object-fit: contain;
  opacity: 0.6; filter: saturate(0.85);
}
.crystal-item-name {
  font-family: 'Noto Serif TC', serif; font-size: clamp(20px, 2vw, 22px); color: var(--brown); margin-bottom: 10px;
}
/* 小標「適合的情境／陪伴象徵」獨立一行，不跟正文擠在同一行——這是這次要修正的資訊層級問題 */
.crystal-item-row { margin-bottom: 10px; }
.crystal-item-row:last-child { margin-bottom: 0; }
.crystal-item-label {

/* ================= 章節分頁系統：星盤解析／水晶陪伴真正分頁切換 =================
   兩個章節同時存在於 DOM，切換時先讓目前章節淡出，淡出動畫結束後才真正用 hidden 屬性
   移出版面（避免中途出現兩章節都佔位、頁面高度暴衝的問題），接著把目標章節淡入。
   背景色同時整個切換（body.theme-crystal），讓「進入水晶陪伴」感覺像換了一個場景，

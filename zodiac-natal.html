<script>
const { signIndexFromLongitude } = MoonSignCalc;
const { getSunSignIndex } = SunSignCalc;
const { taiwanLocalToUTC, isDstPeriod } = TaiwanDst;
const { SIGN_ORDER, getMainCrystalsByName } = ZodiacCrystals;
const { getMoonNeedsByName } = MoonNeeds;
const { getAscendantNeedsByName } = AscendantNeeds;
const { pickMatchingCrystals, fallbackMoon, fallbackRising } = PickMatchingCrystals;
const { shouldMergeDisplay } = RuleEngineMergeDisplay;
const { SIGN_TAGS } = NatalSummary;
const { CRYSTAL_TRAIT_TAGS } = CrystalTraitTags;

/* M4-A.1：月亮的台灣時間換算改用 TaiwanDst（依日期查表回傳 UTC+8 或 UTC+9），
   不再用 MoonSignCalc 原本那個固定 UTC+8 的版本——
   讓太陽/月亮/上升共用同一套台灣歷史時區資料，不要各自維護一份容易失去同步。 */
function moonLongitudeAt(year, month, day, hour, minute) {
  const dt = taiwanLocalToUTC(year, month, day, hour, minute);
  return Astronomy.EclipticGeoMoon(dt).lon;
}

/* 跟 moon-sign-calculator.html 用的是同一套判斷法：
   有時間 -> 直接算當下經度；沒時間 -> 比較當日 00:00 跟當日最後一毫秒兩個端點，
   相同代表當天不跨界（唯一星座），不同代表跨界（兩個候選）。
   00:00 到隔日 00:00 前 1 毫秒都在同一個日曆日內，DST 是「整天適用同一個偏移量」的日期級判斷，
   所以這兩個端點一定用同一個 UTC 偏移量換算，不會出現同一天內偏移量不一致的問題。 */
function calcMoonSign(year, month, day, hour, minute) {
  const hasTime = (hour !== null && hour !== undefined && minute !== null && minute !== undefined && !isNaN(hour) && !isNaN(minute));
  if (hasTime) {
    const lon = moonLongitudeAt(year, month, day, hour, minute);
    return { mode: 'exact', sign: signIndexFromLongitude(lon) };
  }
  const dayStart = taiwanLocalToUTC(year, month, day, 0, 0);
  const dayEndExclusive = taiwanLocalToUTC(year, month, day + 1, 0, 0);
  const lastInstantOfDay = new Date(dayEndExclusive.getTime() - 1);
  const lonStart = Astronomy.EclipticGeoMoon(dayStart).lon;
  const lonEnd = Astronomy.EclipticGeoMoon(lastInstantOfDay).lon;
  const signStart = signIndexFromLongitude(lonStart);
  const signEnd = signIndexFromLongitude(lonEnd);
  if (signStart === signEnd) return { mode: 'exact', sign: signStart, noTimeNoCross: true };
  return { mode: 'ambiguous', signs: [signStart, signEnd] };
}

/* 出生縣市欄位：未填出生時間時保持收合（不必填，因為還沒有需要用到城市的計算）；
   一旦填入出生時間，展開並設為必填——上升星座計算需要出生時間跟出生地兩者都有才能算。 */
function updateCityFieldVisibility() {
  const hasTime = !!document.getElementById('birth-time').value;
  document.getElementById('city-field-wrapper').classList.toggle('show', hasTime);
}

function populateCitySelect() {
  const select = document.getElementById('birth-city');
  TaiwanCities.TAIWAN_CITIES.forEach(city => {
    const opt = document.createElement('option');
    opt.value = city.name;
    opt.textContent = city.name;
    select.appendChild(opt);
  });
}

/* 出生日期不可晚於今天：用本機時區的 YYYY-MM-DD 字串（不用 toISOString，避免 UTC 位移
   把日期算錯一天），同時供 <input max> 屬性跟送出時的字串比較共用同一份邏輯。 */
function getTodayDateString() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function isMoonLibraryAvailable() {
  return typeof Astronomy !== 'undefined' && typeof Astronomy.EclipticGeoMoon === 'function';
}

/* 上升星座：complete（有出生時間＋出生地）／unavailable（缺出生時間，城市欄位也連帶沒展開）／error（計算過程本身出問題）。
   沒有 ambiguous——上升星座不像月亮，沒有時間的話 24 小時內會掃過全部 12 個星座，
   不存在「兩個候選」這種退而求其次的呈現方式，只能是「完全沒辦法算」。 */
const { ascendantLongitude } = AscendantCalc.makeAscendantCalc(Astronomy);

/* 回傳 { config, ascendantIndex }——ascendantIndex 只有在 state === 'complete' 時才是數字，
   其餘（unavailable／error）一律是 null，讓呼叫端（整體摘要）不用重複判斷「是缺資料還是算錯了」，
   兩種情況對摘要來說是同一件事：沒有可用的上升星座資料。 */
function buildAscendantConfig(y, m, d, hour, minute, timeVal) {
  if (!timeVal) {
    return {
      ascendantIndex: null,
      config: {
        icon: '⬆', title: '上升星座', state: 'unavailable', statusLabel: '需要更多資料',
        unavailable: {
          message: '上升星座需要出生時間與出生地才能計算。補上資料後，就能查看你給人的第一印象，以及你面對外在世界的方式。',
          actionLabel: '補上出生時間與地點',
          actionOnClick: 'focusTimeField()'
        }
      }
    };
  }
  try {
    const cityName = document.getElementById('birth-city').value;
    const city = TaiwanCities.findCity(cityName);
    if (!city) throw new Error('找不到縣市座標：' + cityName);
    const observer = new Astronomy.Observer(city.latitude, city.longitude, 0);
    const utcDate = taiwanLocalToUTC(y, m, d, hour, minute);
    const astroTime = Astronomy.MakeTime(utcDate);
    const ascLon = ascendantLongitude(astroTime, observer);
    const ascIndex = AscendantCalc.signIndexFromLongitude(ascLon);
    const ascReading = ASCENDANT_READINGS[ascIndex];
    return {
      ascendantIndex: ascIndex,
      config: {
        icon: '⬆', title: '上升星座', state: 'complete', statusLabel: '已完成', reading: ascReading,
        note: `已依你填寫的出生日期、時間與${cityName}計算`
      }
    };
  } catch (e) {
    console.error('上升星座計算失敗：', e);
    return {
      ascendantIndex: null,
      config: {
        icon: '⬆', title: '上升星座', state: 'error', statusLabel: '發生錯誤',
        error: { message: '上升星座計算時發生問題，請確認出生日期、時間與縣市是否正確，或稍後再試一次。' }
      }
    };
  }
}

function escapeHtmlLocal(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function focusTimeField() {
  document.getElementById('input-view').classList.add('show');
  document.getElementById('result-view').classList.remove('show');
  const el = document.getElementById('birth-time');
  el.focus();
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function resetToInput() {
  document.getElementById('result-view').classList.remove('show');
  document.getElementById('input-view').classList.add('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  showChapterImmediately('natal');
}

const CHAPTER_IDS = { natal: 'chapter-natal', crystal: 'chapter-crystal' };

/* 沒有動畫過場的即時切換，供 resetToInput()／calcAndRender() 重新整理結果畫面時用——
   使用者這時候根本還沒看到章節內容，不需要淡出/淡入，只需要把 DOM 狀態重置回「第一章可見」。 */
function showChapterImmediately(target) {
  Object.entries(CHAPTER_IDS).forEach(([key, id]) => {
    document.getElementById(id).hidden = key !== target;
  });
  document.body.classList.toggle('theme-crystal', target === 'crystal');
  document.getElementById('nav-natal').classList.toggle('chapter-nav-item--active', target === 'natal');
  document.getElementById('nav-natal').removeAttribute('aria-current');
  document.getElementById('nav-crystal').classList.toggle('chapter-nav-item--active', target === 'crystal');
  document.getElementById('nav-crystal').removeAttribute('aria-current');
  document.getElementById(`nav-${target}`).setAttribute('aria-current', 'page');
}

/* 章節真正分頁切換：目前章節先淡出，淡出動畫跑完才用 hidden 移出版面（避免中途兩章節都佔位、
   高度暴衝），接著把目標章節從頁面頂端顯示並淡入，同時整個背景切換到目標章節的色調
   （body.theme-crystal），讓「進入水晶陪伴」感覺像換了一個場景，不只是頁面內捲動到某個區塊。
   reduced-motion 使用者：全站已經把 transition-duration 壓到 0.001ms，這裡的 setTimeout 延遲
   改成緊跟著轉，不會有明顯的空白等待。 */
function goToChapter(target) {
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fromKey = target === 'crystal' ? 'natal' : 'crystal';
  const fromEl = document.getElementById(CHAPTER_IDS[fromKey]);
  const toEl = document.getElementById(CHAPTER_IDS[target]);
  if (toEl.hidden === false && fromEl.hidden === true) return; // 已經在目標章節，不重複執行

  fromEl.classList.add('chapter--fading');
  const delay = prefersReducedMotion ? 0 : 450;
  setTimeout(() => {
    fromEl.hidden = true;
    fromEl.classList.remove('chapter--fading');
    toEl.classList.add('chapter--fading');
    toEl.hidden = false;
    document.body.classList.toggle('theme-crystal', target === 'crystal');
    document.getElementById(`nav-${fromKey}`).classList.remove('chapter-nav-item--active');
    document.getElementById(`nav-${fromKey}`).removeAttribute('aria-current');
    document.getElementById(`nav-${target}`).classList.add('chapter-nav-item--active');
    document.getElementById(`nav-${target}`).setAttribute('aria-current', 'page');
    window.scrollTo({ top: 0 });
    // 強制 reflow，確保接下來加回 opacity:1 一定會觸發 transition，而不是被瀏覽器合併成同一次樣式運算跳過動畫
    void toEl.offsetWidth;
    toEl.classList.remove('chapter--fading');
  }, delay);
}

/* ================= 第二幕：Hero 星盤三角形 =================
   跟舊版（Phase 1）一行文字排列的差異：這裡改成太陽在上／月亮左下／上升右下的三角形節點，
   中間用 SVG 細線連接＋一個放射狀光暈，viewBox 用 0-100 的座標系統，跟節點的 CSS 百分比定位
   共用同一套數字，兩邊永遠對得起來，不需要额外用 JS 量測像素。
   一句話品牌摘要（buildHeroTagline）沿用 Phase 1 邏輯，未變動。 */
const SUN_ELEMENT_TAGLINE = { 火: '熱情探索世界', 土: '踏實走過世界', 風: '理性探索世界', 水: '直覺讀懂世界' };
const MOON_ELEMENT_TAGLINE = { 火: '熱烈感受世界', 土: '安靜感受世界', 風: '輕盈感受世界', 水: '溫柔感受世界' };

function buildHeroTagline(sunElement, moonElement) {
  const sunPhrase = SUN_ELEMENT_TAGLINE[sunElement];
  if (!moonElement) return `${sunPhrase}，其他面向等你補上出生時間`;
  return `${sunPhrase}，${MOON_ELEMENT_TAGLINE[moonElement]}`;
}

const HERO_STAR_LAYOUT = [
  { left: '8%',  top: '10%', size: '12px', delay: '0s',    glyph: '✦' },
  { left: '90%', top: '14%', size: '9px',  delay: '1.2s',  glyph: '✧' },
  { left: '6%',  top: '90%', size: '8px',  delay: '2.1s',  glyph: '⋆' },
  { left: '93%', top: '88%', size: '11px', delay: '0.6s',  glyph: '✦' },
  { left: '50%', top: '4%',  size: '7px',  delay: '1.8s',  glyph: '⋆' },
  { left: '3%',  top: '48%', size: '8px',  delay: '2.6s',  glyph: '✧' }
];

function renderBgStars() {
  return HERO_STAR_LAYOUT.map(s =>
    `<span class="bg-star" style="left:${s.left};top:${s.top};font-size:${s.size};animation-delay:${s.delay}">${s.glyph}</span>`
  ).join('');
}

/* Hero 三角形回歸原圖 Pass 第一點：拆解成獨立 icon+SVG 線條重繪的做法，怎麼調 opacity
   都做不出 chart-triangle-summary.png 原本的手繪水彩線條質感，放棄這個方向——節點不再
   放圖示，只留文字（星座名稱/facet 標籤），疊在完整原圖上對應的三個角落位置。
   .hero-node-text 保留獨立的 transition-delay，讓文字標籤可以跟插畫本身有淡入時序差。 */
function heroNodeHtml(positionClass, facetName, signLabel, facetLabel, pendingText) {
  const signPart = pendingText
    ? `<div class="hero-node-sign hero-node-sign--pending">${escapeHtmlLocal(pendingText)}</div>`
    : `<div class="hero-node-sign">${escapeHtmlLocal(signLabel)}</div>`;
  return `
    <div class="hero-node ${positionClass}${pendingText ? ' hero-node--pending' : ''}">
      <div class="hero-node-text">
        <div class="hero-node-facet">${escapeHtmlLocal(facetName)}</div>
        ${signPart}
        <div class="hero-node-label">${escapeHtmlLocal(facetLabel)}</div>
      </div>
    </div>`;
}

/* Hero 只需要「太陽（一定有）／月亮（跨界時沒有）／上升（complete 時才有）」三者的星座名稱跟元素，
   不需要 moonResult/ascendantConfig 的其餘狀態細節——那些細節交給下面第三幕各自的 facet 區塊。 */
function buildHeroHtml(sunIndex, moonResult, ascendantConfig, ascendantIndex) {
  const sunTag = SIGN_TAGS[sunIndex];
  const sunShortName = sunTag.name.replace(/座$/, '');

  let moonTag = null;
  if (moonResult.mode === 'exact') moonTag = SIGN_TAGS[moonResult.sign];
  const moonShortName = moonTag ? moonTag.name.replace(/座$/, '') : null;

  let ascShortName = null;
  if (ascendantConfig.state === 'complete') ascShortName = SIGN_TAGS[ascendantIndex].name.replace(/座$/, '');

  const tagline = buildHeroTagline(sunTag.element, moonTag ? moonTag.element : null);

  const nodesHtml = [
    heroNodeHtml('hero-node--sun', '太陽', sunShortName, '核心自我', null),
    heroNodeHtml('hero-node--moon', '月亮', moonShortName, '內在情緒', moonShortName ? null : '待確認'),
    heroNodeHtml('hero-node--asc', '上升', ascShortName, '外在印象', ascShortName ? null : '待補上')
  ].join('');

  return `
    <div class="bg-stars">${renderBgStars()}</div>
    <div class="hero-card-inner">
      <h2 class="sr-only">你的星盤摘要</h2>
      <div class="hero-triangle">
        <img class="hero-triangle-img" src="zodiac-natal/assets/illustrations/chart-triangle-summary.png" alt="太陽、月亮、上升三角關係示意圖">
        ${nodesHtml}
      </div>
      <div class="hero-tagline">${escapeHtmlLocal(tagline)}</div>
      <div class="hero-scroll-cue">往下滑，看見完整的你<div class="hero-scroll-arrow" aria-hidden="true">⌄</div></div>
    </div>`;
}

/* 三角形進場特效（互動修復 Pass 第七點）：hero-container 每次 innerHTML 重繪都是全新節點，
   所以每次 calcAndRender() 都要重新掛一次觀察者。reduced-motion 使用者直接跳過整個
   IntersectionObserver 流程、立即加上 visible class，不嘗試任何進場動畫（不是靠動畫時長
   壓縮到 0 這種「有做但快到看不見」的做法，而是根本不啟動）。 */
function initHeroTriangleReveal() {
  const container = document.querySelector('.hero-card-inner');
  const triangle = document.querySelector('.hero-triangle');
  if (!container || !triangle) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    container.classList.add('hero-reveal-play');
    return;
  }
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        container.classList.add('hero-reveal-play');
        observer.unobserve(triangle);
      }
    });
  }, { threshold: 0.3 });
  observer.observe(triangle);
}

/* ================= 第三幕：太陽／月亮／上升 editorial 區塊 =================
   跟舊版 renderSection() 的差異：不再是三張固定窄寬、往下堆疊的白卡，改成「摘要先出現、
   長文可展開」的 disclosure 版面。個性/情感/建議（或上升的 blocks）內容逐字沿用既有資料，
   只是換了容器；section-renderer.js 本身完全沒被修改，這裡只是不再呼叫它。 */
const FACET_META = {
  sun:  { iconId: 'icon-sun-glyph', iconFile: 'icon-sun.png', iconAlt: '太陽符號', bgFile: 'bg-personality-sun.png', label: '核心自我' },
  moon: { iconId: 'icon-moon-glyph', iconFile: 'icon-moon.png', iconAlt: '月亮符號', bgFile: 'bg-personality-moon.png', label: '內在情緒' },
  asc:  { iconId: 'icon-asc-glyph', iconFile: 'icon-ascendant.png', iconAlt: '上升符號', bgFile: 'bg-personality-ascendant.png', label: '外在印象' }
};

/* 從既有 SIGN_TAGS 的短語（natal-summary.js，已核准資料）機械式切出關鍵字，
   不新創文案——用「、」「，」既有的斷句分隔，取前 3 段，這是唯一的關鍵字來源。 */
function splitTags(str) {
  return String(str || '').split(/[、，]/).map(s => s.trim()).filter(Boolean);
}
function facetKeywords(signTag, primaryKey, secondaryKey) {
  return [...splitTags(signTag[primaryKey]), ...splitTags(signTag[secondaryKey])].slice(0, 3);
}

/* 跟 section-renderer.js 的 normalizeBlocks() 邏輯一致（沒有 blocks 時組出個性/情感/建議三段），
   在這裡獨立重寫一份是因為輸出的容器 class 完全不同，不是要改資料形狀本身的判斷邏輯。 */
function readingBlocks(reading) {
  if (reading.blocks) return reading.blocks;
  return [
    { label: '個性', paragraphs: reading.personality },
    { label: '情感', paragraphs: reading.emotional },
    { label: '建議', paragraphs: reading.advice }
  ];
}
function firstSentence(text) {
  const idx = text.indexOf('。');
  return idx >= 0 ? text.slice(0, idx + 1) : text;
}
/* 一句精華摘要＝既有解析文字第一段的第一句，純擷取、不改寫，也不是新文案。 */
function readingHighlight(reading) {
  const blocks = readingBlocks(reading);
  return firstSentence(blocks[0].paragraphs[0]);
}
/* 只換標題語氣，不動內文一個字：個性/情感/建議（sun/moon 用的預設三段式）換成更貼近使用者的
   第一人稱提問句。上升用的是 readings-data 以外的自訂 blocks（第一印象/外在風格/處世模式，
   見 ascendant-readings.js），標籤本來就已經是量身打造的措辭，不在這份對照表裡、維持原樣。 */
const FACET_BLOCK_LABEL_REMAP = {
  '個性': '你如何思考',
  '情感': '你如何感受',
  '建議': '你可以如何照顧自己'
};
function renderFacetDetail(reading) {
  const blocks = readingBlocks(reading);
  return blocks.map((b, i) => `
    <div class="facet-block">
      <div class="facet-block-label">
        <span class="facet-block-num" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span>
        <span>${escapeHtmlLocal(FACET_BLOCK_LABEL_REMAP[b.label] || b.label)}</span>
      </div>
      ${(b.paragraphs || []).map(p => `<p>${escapeHtmlLocal(p)}</p>`).join('')}
    </div>`).join('');
}
function renderFacetToggle(facetKey) {
  return `
    <button class="facet-toggle" type="button" aria-expanded="false" aria-controls="facet-${facetKey}-detail" onclick="toggleFacetDetail(this)">
      <span class="facet-toggle-label">查看完整解析</span>
      <span class="facet-toggle-icon" aria-hidden="true">＋</span>
    </button>`;
}

/* accessible disclosure：純用原生 button + aria-expanded/aria-controls + hidden 屬性，
   鍵盤 Tab/Enter/Space 原生可操作，不需要額外的 JS 鍵盤事件處理。 */
function toggleFacetDetail(btn) {
  const expanded = btn.getAttribute('aria-expanded') === 'true';
  const panel = document.getElementById(btn.getAttribute('aria-controls'));
  btn.setAttribute('aria-expanded', String(!expanded));
  panel.hidden = expanded;
  btn.querySelector('.facet-toggle-label').textContent = expanded ? '查看完整解析' : '收合解析';
  btn.querySelector('.facet-toggle-icon').textContent = expanded ? '＋' : '－';
}

function buildFacetSectionHtml(facetKey, config, signTag, keywordKeys) {
  const meta = FACET_META[facetKey];
  const eyebrow = `<svg class="zic zic--inline" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#${meta.iconId}"></use></svg> ${escapeHtmlLocal(config.title)}　·　${escapeHtmlLocal(meta.label)}`;

  let bodyHtml;
  /* facet-detail（展開後的完整解析）不再放在 facet-content 裡——facet-content 是 facet-inner
     三欄摘要版面（插畫/留白/文字）的其中一欄，寬度被欄位比例卡死，是三欄擁擠、中文頻繁斷行
     的根本原因。改成獨立變數，最後渲染在 facet-inner 外面、section 內部，脫離欄位限制，
     桌機版才能有自己的 720-780px 閱讀欄寬。 */
  let detailHtml = '';
  if (config.state === 'complete') {
    const reading = config.reading;
    const keywords = facetKeywords(signTag, keywordKeys[0], keywordKeys[1]);
    bodyHtml = `
      <h2 class="facet-sign-name">${escapeHtmlLocal(reading.symbol)} ${escapeHtmlLocal(reading.sign)}</h2>
      <p class="facet-highlight">${escapeHtmlLocal(readingHighlight(reading))}</p>
      <ul class="facet-keywords">${keywords.map(k => `<li>${escapeHtmlLocal(k)}</li>`).join('')}</ul>
      ${renderFacetToggle(facetKey)}
    `;
    detailHtml = `<div class="facet-detail" id="facet-${facetKey}-detail" hidden>${renderFacetDetail(reading)}</div>`;
  } else if (config.state === 'ambiguous') {
    const [c1, c2] = config.ambiguous.candidates;
    bodyHtml = `
      <h2 class="facet-sign-name facet-sign-name--pending">${escapeHtmlLocal(config.statusLabel)}</h2>
      <div class="facet-pending-row">
        <span>${escapeHtmlLocal(c1.symbol)} ${escapeHtmlLocal(c1.sign)}</span>
        <span class="facet-pending-sep">／</span>
        <span>${escapeHtmlLocal(c2.symbol)} ${escapeHtmlLocal(c2.sign)}</span>
      </div>
      <div class="facet-pending-hint">${escapeHtmlLocal(config.ambiguous.hint)}</div>
      <button class="btn-secondary" onclick="${escapeHtmlLocal(config.ambiguous.actionOnClick || '')}">${escapeHtmlLocal(config.ambiguous.actionLabel)}</button>
    `;
  } else if (config.state === 'unavailable') {
    bodyHtml = `
      <h2 class="facet-sign-name facet-sign-name--pending">${escapeHtmlLocal(config.statusLabel)}</h2>
      <div class="facet-pending-hint">${escapeHtmlLocal(config.unavailable.message)}</div>
      ${config.unavailable.actionLabel ? `<button class="btn-secondary" onclick="${escapeHtmlLocal(config.unavailable.actionOnClick || '')}">${escapeHtmlLocal(config.unavailable.actionLabel)}</button>` : ''}
    `;
  } else {
    bodyHtml = `
      <h2 class="facet-sign-name facet-sign-name--pending">${escapeHtmlLocal(config.statusLabel)}</h2>
      <div class="facet-error-hint">${escapeHtmlLocal(config.error.message)}</div>
    `;
  }

  const note = config.note ? `<div class="facet-note">${escapeHtmlLocal(config.note)}</div>` : '';
  const info = config.info ? `<div class="facet-info">${escapeHtmlLocal(config.info)}</div>` : '';

  return `
    <section class="facet-section facet-section--${facetKey}" aria-label="${escapeHtmlLocal(config.title)}">
      <img class="facet-bg-deco" src="zodiac-natal/assets/illustrations/${meta.bgFile}" alt="" aria-hidden="true" loading="lazy">
      <div class="facet-inner">
        <div class="facet-visual"><img class="facet-visual-img" src="zodiac-natal/assets/illustrations/${meta.iconFile}" alt="${meta.iconAlt}" loading="lazy"></div>
        <div class="facet-connector" aria-hidden="true"></div>
        <div class="facet-content">
          <div class="facet-eyebrow">${eyebrow}</div>
          ${bodyHtml}
          ${note}${info}
        </div>
      </div>
      ${detailHtml}
    </section>`;
}

/* ================= 第四幕：整體人格交織 =================
   NatalSummary.buildSummary() 完全未變動——headline 跟 sections[0..2] 的內文逐字沿用，
   這裡只是把原本的三個標題（你的核心與內在／別人看到的你／這組星座給你的提醒）換成三個新框架
   （你內心真正需要的感受／你給人的第一印象／外在與內在最可能產生的拉扯），對應順序固定為
   sections[0]→內心需要、sections[1]→第一印象、sections[2]→拉扯，內文段落一個字都沒有改。
   headline 本身已經是「一句話整體摘要」（natal-summary.js buildHeadline() 就是單句設計），
   不是另外新寫的句子，這裡只是給它全區最大字級的視覺處理。 */
const SUMMARY_INSIGHT_TITLES = ['你內心真正需要的感受', '你給人的第一印象', '外在與內在最可能產生的拉扯'];
/* 三張卡片旁的小圖示：依內容對應到最相關的一個面向——內心需要對應月亮（內在情緒）、
   第一印象對應上升（外在印象）、內外拉扯用太陽（核心自我）收尾，剛好三張卡片各用一個既有 icon，
   不是額外新畫的圖案。 */
const SUMMARY_INSIGHT_ICONS = ['icon-moon-glyph', 'icon-asc-glyph', 'icon-sun-glyph'];

/* 分享文字：逐字沿用既有 headline（拿掉排版用的 \n）＋ 三段 sections 標題與內文，
   不新增、不改寫任何一句解析文案，只是把畫面上已經顯示的文字重新組成一段可分享的純文字。 */
function buildShareText(summary) {
  const body = summary.sections
    .map((s, i) => `${SUMMARY_INSIGHT_TITLES[i] || s.title}：${s.body}`)
    .join('\n\n');
  return `✦ 我的星盤摘要 · 此刻，認識你的星盤\n\n${summary.headline.replace(/\n/g, '')}\n\n${body}`;
}

/* 分享連結（呈現層 Pass 第三點）：把 buildShareText() 產生的摘要文字（不含出生日期／時間，
   只有已經算好的解析摘要）用 encodeURIComponent 編碼進網址 hash——用 hash 而不是 query string，
   純前端網站沒有後端，hash 內容不會被送到任何伺服器，純粹給對方瀏覽器自己解碼顯示。 */
function buildShareUrl(summary) {
  const encoded = encodeURIComponent(buildShareText(summary));
  const base = location.origin + location.pathname;
  return `${base}#shared=${encoded}`;
}

/* 主要分享行為：navigator.share 可用時分享「連結」（不是純文字）——對方點開連結能直接看到
   摘要內容，不需要重新輸入生日或等待重新運算；不可用時 fallback 到 Clipboard API 複製連結。
   AbortError＝使用者自己取消分享面板，不當作錯誤處理。 */
function setShareStatus(msg, isError) {
  const el = document.getElementById('share-status');
  if (!el) return;
  el.textContent = msg;
  el.classList.toggle('share-status--error', !!isError);
  clearTimeout(setShareStatus._timer);
  setShareStatus._timer = setTimeout(() => { el.textContent = ''; }, 4000);
}
function shareSummaryLink(btn) {
  const url = btn.getAttribute('data-share-url') || '';
  if (navigator.share) {
    navigator.share({ title: '我的星盤摘要', url }).catch(err => {
      if (err && err.name === 'AbortError') return;
      setShareStatus('分享未完成，請稍後再試一次', true);
    });
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url)
      .then(() => setShareStatus('已複製分享連結，貼給朋友就能直接看到這份摘要'))
      .catch(() => setShareStatus('複製失敗，請手動選取連結複製', true));
    return;
  }
  setShareStatus('此瀏覽器不支援分享或複製功能', true);
}

/* 次要選項：保留原本「複製純文字摘要」的做法（互動修復 Pass 已驗證過運作正常），
   給不想分享連結、只想貼一段文字的人用。 */
function copySummaryText(btn) {
  const text = btn.getAttribute('data-share-text') || '';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => setShareStatus('已複製星盤摘要文字'))
      .catch(() => setShareStatus('複製失敗，請手動選取文字複製', true));
    return;
  }
  setShareStatus('此瀏覽器不支援複製功能', true);
}

/* 分享連結開啟後的顯示（呈現層 Pass 第三點）：網址帶 #shared=... 時，直接把解碼後的摘要文字
   顯示出來，完全不需要對方填出生日期／時間，也不會呼叫任何 Rule Engine 或計算邏輯——
   這裡拿到的就是純文字，只負責顯示，不重新運算、不解析回結構化資料。 */
function tryRenderSharedView() {
  const match = location.hash.match(/^#shared=(.+)$/);
  if (!match) return false;
  let text;
  try {
    text = decodeURIComponent(match[1]);
  } catch (e) {
    return false;
  }
  document.getElementById('shared-card-content').textContent = text;
  document.getElementById('input-view').classList.remove('show');
  document.getElementById('shared-view').classList.add('show');
  return true;
}
function startFreshFromShared() {
  history.replaceState(null, '', location.pathname);
  document.getElementById('shared-view').classList.remove('show');
  document.getElementById('input-view').classList.add('show');
}

function renderSummaryCard(summary) {
  const upgradeHint = summary.upgradeHint
    ? `<div class="summary-upgrade-hint">${escapeHtmlLocal(summary.upgradeHint)}　<button class="btn-secondary" onclick="focusTimeField()" style="width:auto;display:inline;margin-top:8px;padding:8px 16px;">補上出生時間與地點</button></div>`
    : '';
  return `
    <section class="act-summary">
      <div class="summary-symbol-overlay" aria-hidden="true">
        <svg class="zic summary-symbol summary-symbol--sun" viewBox="0 0 100 100"><use href="#icon-sun-glyph"></use></svg>
        <svg class="zic summary-symbol summary-symbol--moon" viewBox="0 0 100 100"><use href="#icon-moon-glyph"></use></svg>
        <svg class="zic summary-symbol summary-symbol--asc" viewBox="0 0 100 100"><use href="#icon-asc-glyph"></use></svg>
      </div>
      <div class="summary-inner">
        ${(() => {
          /* 摘要重新分層（規格第六點）：buildHeadline() 本來就把整句話用 \n 分成兩層
             （見 natal-summary.js 該函式註解：第一層鋪陳、第二層收在總結句），
             這裡逐字沿用既有字串、只是不再把兩層擠在同一個大字級標題裡——
             不新增、不改寫任何一個字，純粹重新分配視覺層級。 */
          const parts = String(summary.headline).split('\n');
          const mainLine = parts[0];
          const subLine = parts.slice(1).join('\n');
          return `
        <h2 class="summary-headline">${escapeHtmlLocal(mainLine)}</h2>
        ${subLine ? `<p class="summary-headline-sub">${escapeHtmlLocal(subLine)}</p>` : ''}`;
        })()}
        <div class="summary-insights">
          ${summary.sections.map((s, i) => `
          <div class="summary-insight">
            <div class="summary-insight-title">
              <svg class="zic summary-insight-icon" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#${SUMMARY_INSIGHT_ICONS[i]}"></use></svg>
              ${escapeHtmlLocal(SUMMARY_INSIGHT_TITLES[i] || s.title)}
            </div>
            <p>${escapeHtmlLocal(s.body)}</p>
          </div>`).join('')}
        </div>
        ${upgradeHint}
        <div class="summary-actions">
          <button class="btn-share" type="button" onclick="shareSummaryLink(this)"
            data-share-url="${escapeHtmlLocal(buildShareUrl(summary))}">
            <span aria-hidden="true">⤴</span> 分享我的星盤摘要
          </button>
          <button class="share-secondary-link" type="button" onclick="copySummaryText(this)"
            data-share-text="${escapeHtmlLocal(buildShareText(summary))}">
            或複製純文字摘要
          </button>
          <div class="share-status" id="share-status" role="status" aria-live="polite"></div>
        </div>
      </div>
    </section>
  `;
}

/* ================= 第五幕：水晶建議卡片（完全未變動，Phase B 邏輯原樣保留）=================
   兩項設計決定（依 merge-distribution-report.md 實測數據）：

   1. Merge Rate 全組合只有 17.65%（見該報告第一節），所以這裡的預設版面是「月亮情境微調」跟
      「上升情境微調」兩個獨立區塊並列——合併顯示不是版面的主軸，是 shouldMergeDisplay() 回傳
      merge:true 時才觸發的特殊處理，用 .crystal-merged-box 刻意做出跟預設不同的視覺效果
      （見上方 CSS 註解），讓使用者感覺到「這次剛好一致」是特別的，不是常態。

   2. 摩羯座太陽的 fallback 率是全案離群值（43.75%，見該報告第三、七節），但太陽主水晶清單本身
      不動（已核准封存）。這裡不做「摩羯座專屬文案」這種特殊分支——fallbackMoon()/fallbackRising()
      本身已是 7.4 定案的溫暖語氣（帶出「主水晶仍可依當下喜好選擇」），這裡要做的是「不要用錯誤色
      的樣式包裝它」：套用 .crystal-fallback-box（跟上面 hint-box 同一種玫瑰色調中性樣式），
      而不是 error-box 的紅色警示樣式，並且太陽主水晶清單永遠顯示在同一張卡片最上方，讓 fallback
      文字裡「你可以自己選一顆」這句話，有明確可以對照的清單，不是空講一句話。 */

function describeMatchedTags(tags) {
  return tags.join('、');
}

function buildMoonTuneText(pick) {
  const names = pick.selectedCrystals;
  if (names.length === 1) {
    return `依你的月亮星座情緒需求，主清單中的「${names[0]}」特別呼應${describeMatchedTags(pick.matchedTagsByCrystal[names[0]])}，這次特別留意這一顆。`;
  }
  const parts = names.map(n => `「${n}」（呼應${describeMatchedTags(pick.matchedTagsByCrystal[n])}）`).join('、');
  return `依你的月亮星座情緒需求，主清單中的 ${parts} 這兩顆這次特別呼應你的情緒需求。`;
}

function buildRisingTuneText(pick) {
  const names = pick.selectedCrystals;
  if (names.length === 1) {
    return `依你的上升星座面對外在世界的方式，主清單中的「${names[0]}」特別呼應${describeMatchedTags(pick.matchedTagsByCrystal[names[0]])}，這次特別留意這一顆。`;
  }
  const parts = names.map(n => `「${n}」（呼應${describeMatchedTags(pick.matchedTagsByCrystal[n])}）`).join('、');
  return `依你的上升星座面對外在世界的方式，主清單中的 ${parts} 這兩顆這次特別呼應你面對外在世界的方式。`;
}

function buildMergedText(mergeResult) {
  const nameText = mergeResult.crystals.map(n => `「${n}」`).join('、');
  return `${nameText}同時呼應你的月亮情緒需求，也呼應你上升面對外在世界的方式（${describeMatchedTags(mergeResult.combinedMatchedTags)}）——這次月亮跟上升剛好指向同一個方向。`;
}

/* 水晶推薦總覽補充 Pass 第二點：右側「水晶建議」欄位原本只有一句通用說明文字、大片留白——
   這裡整理既有 Rule Engine 已經算好的資料（mainList／moonPick／risingPick，都是
   buildCrystalSectionHtml() 呼叫這個函式之前就算完的既有變數，不重新跑一次規則引擎），
   組成主水晶清單、月亮/上升微調挑中的水晶、跟兩者 matchedTagsByCrystal 彙整出的呼應標籤。
   只做資料整理跟排版，逐字沿用既有水晶名稱／既有 TAG_VOCABULARY 詞彙，不新增、不改寫任何
   療效或命定式描述。fallback 情況（moonPick.fallback / risingPick.fallback）沒有
   selectedCrystals 可用，直接跳過該段，不硬湊內容。 */
function renderCrystalOverviewSummary(mainList, moonPick, risingPick) {
  const tuneRows = [];
  if (moonPick && !moonPick.fallback && moonPick.selectedCrystals.length) {
    const chips = moonPick.selectedCrystals.map(n => `<span class="crystal-overview-chip">${escapeHtmlLocal(n)}</span>`).join('');
    tuneRows.push(`<div class="crystal-overview-tune-row"><span class="crystal-overview-tune-label">月亮微調</span>${chips}</div>`);
  }
  if (risingPick && !risingPick.fallback && risingPick.selectedCrystals.length) {
    const chips = risingPick.selectedCrystals.map(n => `<span class="crystal-overview-chip">${escapeHtmlLocal(n)}</span>`).join('');
    tuneRows.push(`<div class="crystal-overview-tune-row"><span class="crystal-overview-tune-label">上升微調</span>${chips}</div>`);
  }

  const tagSet = new Set();
  [moonPick, risingPick].forEach(pick => {
    if (pick && !pick.fallback) {
      Object.values(pick.matchedTagsByCrystal || {}).forEach(tags => (tags || []).forEach(t => tagSet.add(t)));
    }
  });
  const symbolTagsHtml = tagSet.size
    ? `<div class="crystal-overview-symbol-block">
        <span class="crystal-overview-label">陪伴象徵</span>
        <ul class="crystal-overview-symbol-tags">${[...tagSet].map(t => `<li>${escapeHtmlLocal(t)}</li>`).join('')}</ul>
      </div>`
    : '';

  return `
    <div class="crystal-overview-main">
      <span class="crystal-overview-label">主水晶</span>
      <p class="crystal-overview-main-names">${mainList.map(n => escapeHtmlLocal(n)).join('・')}</p>
    </div>
    ${tuneRows.length ? `<div class="crystal-overview-tune-tags">${tuneRows.join('')}</div>` : ''}
    ${symbolTagsHtml}`;
}

/* 「陪伴象徵」＝直接取用 crystal-trait-tags.js 既有核准過的 coreTags/supportTags 詞彙（見該檔案
   TAG_VOCABULARY），不新寫任何描述——這些標籤本身就是中性的「特質分類詞」（例如「沉澱」「自信」），
   不是療效或命定式語句，符合「不得新增療效、保證或命定式描述」的限制。少數水晶（鈦晶、珍珠）兩個
   標籤欄位都是空的（見該檔案決議 4），此時回傳空字串，呼叫端會直接省略這一段，不硬湊文字。 */
function companionSymbolText(name) {
  const entry = CRYSTAL_TRAIT_TAGS[name];
  if (!entry) return '';
  return [...entry.coreTags, ...entry.supportTags].join('・');
}

/* 水晶推薦示意圖的珠子色塊參照色，純粹是「這顆水晶大致是什麼顏色」的視覺提示（常見礦物外觀色），
   不是功效或品質描述。目前涵蓋 crystal-trait-tags.js 裡全部 19 個太陽主清單會用到的水晶名稱；
   萬一之後主清單新增未列在這裡的水晶名稱，會 fallback 成中性米杏色，不會讓插畫壞掉。 */
/* 色調與容器修正 Pass 第二點：黃水晶／太陽石／石榴石／橄欖石這四顆原本飽和度明顯偏高
   （純黃、亮橘、暗紅、飽和綠），跟站內水彩插畫的淡色調脫節，改用品牌既有淡色系對應
   （米金／淡珊瑚橘／霧玫瑰／淡鼠尾草綠），HSL 降飽和度約 35%、微調亮度後換算回 hex，
   同色相不同明度，彼此仍可辨識。其餘 15 個顏色未列在這次指定範圍內，維持原樣。 */
const CRYSTAL_BEAD_COLOR = {
  '石榴石': '#98575E', '紅瑪瑙': '#B5533C', '太陽石': '#D4AE91', '黃水晶': '#DBCA9E',
  '綠東陵石': '#8FAE84', '粉水晶': '#E8B9BE', '托帕石': '#EBD9A0', '白水晶': '#F6F2EA',
  '藍晶石': '#6E86B0', '瑪瑙': '#B08968', '海藍寶': '#A8CBD0', '月光石': '#D8DEE8',
  '珍珠': '#F0EAE0', '橄欖石': '#A9AF83', '黑曜石': '#3A3535', '紫水晶': '#9B85B5',
  '煙晶': '#8A7B6C', '虎眼石': '#B8863B', '鈦晶': '#C69C5D'
};
function beadColorFor(name) { return CRYSTAL_BEAD_COLOR[name] || '#E4D8C6'; }

/* 珠子漸層明暗＝從 beadColorFor() 的基礎色，用簡單加法混色算出「靠近白/黑一點」的兩個變化色，
   不是精確的色彩科學模型，純粹是讓每顆珠子有高光/陰影的層次感（水彩暈染的簡化版）。
   percent 正值往白混、負值往黑混，回傳值一律夾在 0-255。 */
function shadeColor(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  const mix = (channel) => Math.max(0, Math.min(255, channel + Math.round(255 * percent)));
  const r = mix(num >> 16), g = mix((num >> 8) & 0xFF), b = mix(num & 0xFF);
  return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
}

/* 水晶推薦示意圖：「水彩手鍊設計稿」風格 mockup，內容依 Rule Engine 最終算出的 mainList 動態生成。
   Illustration Finish Pass：珠子數量整體增加——mainList（太陽主推薦，3-5顆）用較大、較飽和的珠子
   清楚標示為主珠；其餘環位補中性過渡色的小珠子填滿一整圈，讀起來像一條真正串滿的手鍊，而不是
   稀疏的幾個資訊點。每顆主珠疊了 3 層（漸層底色＋一層偏移的半透明色彩暈染＋高光小白點）模擬簡單
   的色彩層次；尺寸用確定性的偽亂數（同一顆水晶永遠得到同一個微小差異，不是每次 render 都不同）
   加一點大小差異，避免看起來機械等分。highlightNames 是月亮／上升微調挑中的 1-2 顆主珠
   （selectedCrystals），用金色虛線光暈額外標出來，跟「主珠 vs 過渡珠」是兩層獨立的視覺區分。 */
function buildCrystalBraceletSvg(mainList, highlightNames) {
  const W = 640, H = 560;
  const cx = W / 2, cy = H / 2 - 4;
  const R = 150; // 主珠環繞半徑
  const primaryCount = mainList.length;
  const fillerPerGap = 2; // 每兩顆主珠之間補 2 顆過渡珠，整圈珠子數變多、更像一條串滿的手鍊
  const total = primaryCount * (fillerPerGap + 1);
  const angleStep = (2 * Math.PI) / total;
  const startAngle = -Math.PI / 2; // 從正上方開始，順時針排列一整圈

  // 確定性的微小亂數（用字串雜湊取代 Math.random()）：同樣的水晶名稱／環位永遠得到同一個微小差異，
  // 同一組資料重新 render 時插畫不會亂跳動，也方便日後需要視覺回歸比對。
  function pseudoJitter(seed, range) {
    let h = 0;
    for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
    return ((h % 1000) / 1000 - 0.5) * 2 * range;
  }

  const FILLER_PALETTE = ['#E4D8C6', '#DCCFBB', '#EDE2D2', '#D6C7AE'];
  const highlightSet = new Set(highlightNames || []);

  const slots = [];
  for (let s = 0; s < total; s++) {
    const angle = startAngle + s * angleStep;
    const x = cx + R * Math.cos(angle), y = cy + R * Math.sin(angle);
    if (s % (fillerPerGap + 1) === 0) {
      slots.push({ type: 'primary', name: mainList[s / (fillerPerGap + 1)], angle, x, y });
    } else {
      slots.push({ type: 'filler', angle, x, y, seed: `filler-${s}` });
    }
  }

  /* 水晶配對輪質感提升 Pass 第二點：只加強渲染層——漸層對比拉大、多一層更小更亮的鏡面
     反光點、加一道底部環境反光弧線，讓球體更有立體寶石感；每顆珠子的光澤再疊一個極慢速
     的 brightness 明暗呼吸（用 pseudoJitter 算出各自的 animation-delay，不會同步閃爍）。
     顏色（beadColorFor）、半徑計算、圓環角度位置、對應水晶名稱全部沒有變動，純粹是同一組
     幾何座標之上多畫幾層陰影/反光/動畫。 */
  const beadsHtml = slots.map((slot, i) => {
    if (slot.type === 'filler') {
      const base = FILLER_PALETTE[i % FILLER_PALETTE.length];
      const r = 8 + pseudoJitter(slot.seed, 1.3);
      const gradId = `fillerGrad${i}`;
      const delay = (pseudoJitter(slot.seed, 4) + 4).toFixed(2);
      return `
        <radialGradient id="${gradId}" cx="34%" cy="28%" r="72%">
          <stop offset="0%" stop-color="${shadeColor(base, 0.42)}" stop-opacity="0.95"/>
          <stop offset="60%" stop-color="${base}" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="${shadeColor(base, -0.22)}" stop-opacity="0.8"/>
        </radialGradient>
        <circle class="crystal-bead-luster" style="animation-delay:${delay}s" cx="${slot.x.toFixed(1)}" cy="${slot.y.toFixed(1)}" r="${r.toFixed(1)}" fill="url(#${gradId})" stroke="#A67C4E" stroke-width="0.5" stroke-opacity="0.4"/>
        <circle cx="${(slot.x - r * 0.32).toFixed(1)}" cy="${(slot.y - r * 0.32).toFixed(1)}" r="${(r * 0.24).toFixed(1)}" fill="#FFFFFF" opacity="0.5"/>`;
    }

    const isHi = highlightSet.has(slot.name);
    const baseR = isHi ? 22 : 18;
    const r = baseR + pseudoJitter(slot.name, 1.6);
    const base = beadColorFor(slot.name);
    const gradId = `beadGrad${i}`;
    const washId = `beadWash${i}`;
    const delay = (pseudoJitter(slot.name, 4) + 4).toFixed(2);
    const glow = isHi ? `<circle cx="${slot.x.toFixed(1)}" cy="${slot.y.toFixed(1)}" r="${(r + 6).toFixed(1)}" fill="none" stroke="#C9A96A" stroke-width="1.3" stroke-dasharray="2 3" opacity="0.75"/>` : '';
    // 金色小圓點標記：貼在主珠外側同一個角度延伸出去，明確標示「這是主推薦」，過渡珠沒有這個標記
    const tickX = cx + (R + r + 9) * Math.cos(slot.angle), tickY = cy + (R + r + 9) * Math.sin(slot.angle);
    // 主光源在左上（cx 35%/cy 30%），底部環境反光弧線就畫在對角的右下側，模擬桌面/其他珠子的漫反射光
    const rimX = slot.x + r * 0.4, rimY = slot.y + r * 0.55;
    return `
      <radialGradient id="${gradId}" cx="33%" cy="28%" r="75%">
        <stop offset="0%" stop-color="${shadeColor(base, 0.46)}"/>
        <stop offset="45%" stop-color="${shadeColor(base, 0.1)}"/>
        <stop offset="72%" stop-color="${base}"/>
        <stop offset="100%" stop-color="${shadeColor(base, -0.3)}"/>
      </radialGradient>
      <radialGradient id="${washId}" cx="62%" cy="68%" r="60%">
        <stop offset="0%" stop-color="${shadeColor(base, -0.15)}" stop-opacity="0.36"/>
        <stop offset="100%" stop-color="${shadeColor(base, -0.15)}" stop-opacity="0"/>
      </radialGradient>
      ${glow}
      <circle class="crystal-bead-luster" style="animation-delay:${delay}s" cx="${slot.x.toFixed(1)}" cy="${slot.y.toFixed(1)}" r="${r.toFixed(1)}" fill="url(#${gradId})" stroke="#A67C4E" stroke-width="1"/>
      <circle cx="${slot.x.toFixed(1)}" cy="${slot.y.toFixed(1)}" r="${r.toFixed(1)}" fill="url(#${washId})"/>
      <ellipse cx="${rimX.toFixed(1)}" cy="${rimY.toFixed(1)}" rx="${(r * 0.4).toFixed(1)}" ry="${(r * 0.18).toFixed(1)}"
        fill="none" stroke="#FFFFFF" stroke-width="${(r * 0.1).toFixed(1)}" opacity="0.22"
        transform="rotate(${(slot.angle * 180 / Math.PI + 40).toFixed(0)} ${rimX.toFixed(1)} ${rimY.toFixed(1)})"/>
      <circle cx="${(slot.x - r * 0.32).toFixed(1)}" cy="${(slot.y - r * 0.34).toFixed(1)}" r="${(r * 0.26).toFixed(1)}" fill="#FFFFFF" opacity="0.4"/>
      <circle cx="${(slot.x - r * 0.4).toFixed(1)}" cy="${(slot.y - r * 0.42).toFixed(1)}" r="${(r * 0.1).toFixed(1)}" fill="#FFFFFF" opacity="0.85"/>
      <circle cx="${tickX.toFixed(1)}" cy="${tickY.toFixed(1)}" r="2.6" fill="#D9B36C" stroke="#A67C4E" stroke-width="0.5"/>`;
  }).join('');

  // 標註細線：只給主珠標名稱，過渡珠不標註，避免整圈都是文字造成視覺雜訊。
  // 從每顆主珠沿著環的半徑方向往外拉出一條細線到名稱文字，方向依珠子所在的角度
  // （dx 分量決定文字要靠左對齊、靠右對齊、還是置中——這樣不管珠子在圓的哪個位置，標籤都會
  // 往外側展開，不會疊到圓環本體）。
  const labelR1 = R + 24, labelR2 = R + 62;
  const labelsHtml = slots.filter(s => s.type === 'primary').map(p => {
    const dx = Math.cos(p.angle), dy = Math.sin(p.angle);
    const x1 = cx + labelR1 * dx, y1 = cy + labelR1 * dy;
    const x2 = cx + labelR2 * dx, y2 = cy + labelR2 * dy;
    const anchor = dx > 0.2 ? 'start' : dx < -0.2 ? 'end' : 'middle';
    const textX = x2 + (anchor === 'start' ? 6 : anchor === 'end' ? -6 : 0);
    const textY = y2 + (Math.abs(dx) < 0.2 ? (dy > 0 ? 15 : -7) : 4);
    return `
      <path d="M${x1.toFixed(1)},${y1.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)}" stroke="#A67C4E" stroke-width="0.75" fill="none"/>
      <circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="1.4" fill="#A67C4E"/>
      <text x="${textX.toFixed(1)}" y="${textY.toFixed(1)}" text-anchor="${anchor}" font-family="'Noto Serif TC', serif" font-size="14" fill="#5C4A3A">${escapeHtmlLocal(p.name)}</text>`;
  }).join('');

  /* 容器修正 Pass 第一點：拿掉這張 SVG 自己的紙張漸層＋雜訊背景矩形（braceletPaperGrad／
     braceletPaperNoise，連同兩個 <rect>），示意圖不再是「巢狀疊加在外層卡片裡的另一個方框」，
     而是直接透明坐在 .crystal-card 同一層底色上——跟右側懸空的文字說明視覺上對稱一致。 */
  return `
    <svg class="crystal-illustration-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="依你的推薦水晶生成的圓形手鍊排列示意圖">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#A67C4E" stroke-width="1.2" opacity="0.55"/>
      ${labelsHtml}
      ${beadsHtml}
    </svg>`;
}

/* 太陽主水晶清單：每顆水晶各自一段（名稱／適合的情境／陪伴象徵）。
   「適合的情境」逐字沿用 sunReading.crystals[].note（既有核准文案，未改寫一個字，只換了標籤名稱）；
   「陪伴象徵」＝上面 companionSymbolText()，兩者都不是這次新寫的內容。 */
/* 散石裝飾（卡片圖示統一 Pass 第三點）：原本 7 顆散石依卡片順序輪流當右上角裝飾，
   但顏色常常跟卡片實際的水晶種類對不上，其中 01/02 兩顆（紫水晶／白水晶）在原始素材裡
   本來就互相重疊、裁切邊界無法完全乾淨，看起來像被切一半。改成全部卡片統一使用同一顆
   從原圖重新裁切、四周留白乾淨的中性淡色散石（crystal-stone-neutral.png，取自原本的
   03 號淡藍白色散石，是完整不重疊的一顆，不再依水晶種類切換）。 */
function renderSunCrystalGroup(sunReading, mainList) {
  const noteByName = {};
  (sunReading.crystals || []).forEach(c => { noteByName[c.name] = c.note; });
  const items = mainList.map((name, i) => {
    const symbol = companionSymbolText(name);
    return `
    <div class="crystal-item-card">
      <img class="crystal-item-stone-deco" src="zodiac-natal/assets/illustrations/crystal-stone-neutral.png" alt="" aria-hidden="true" loading="lazy">
      <div class="crystal-item-name">${escapeHtmlLocal(name)}</div>
      <div class="crystal-item-row"><span class="crystal-item-label">適合的情境</span><p>${escapeHtmlLocal(noteByName[name] || '')}</p></div>
      ${symbol ? `<div class="crystal-item-row"><span class="crystal-item-label">陪伴象徵</span><p>${escapeHtmlLocal(symbol)}</p></div>` : ''}
    </div>`;
  }).join('');
  return `
    <div class="crystal-group crystal-entries-panel">
      <div class="crystal-group-label">太陽主水晶清單</div>
      <div class="crystal-entries">${items}</div>
    </div>`;
}

function renderTuneGroup(label, pick, tuneText, fallbackText) {
  const body = pick.fallback
    ? `<div class="crystal-fallback-box">${escapeHtmlLocal(fallbackText)}</div>`
    : `<div class="crystal-tune-text">${escapeHtmlLocal(tuneText)}</div>`;
  return `
    <div class="crystal-group">
      <div class="crystal-group-label">${escapeHtmlLocal(label)}</div>
      ${body}
    </div>`;
}

function renderSkipGroup(label, message, actionLabel, actionOnClick) {
  const action = actionLabel
    ? `<button class="btn-secondary" onclick="${escapeHtmlLocal(actionOnClick || '')}">${escapeHtmlLocal(actionLabel)}</button>`
    : '';
  return `
    <div class="crystal-group">
      <div class="crystal-group-label">${escapeHtmlLocal(label)}</div>
      <div class="crystal-skip-note">${escapeHtmlLocal(message)}</div>
      ${action}
    </div>`;
}

function renderMergedGroup(mergeResult) {
  return `
    <div class="crystal-group crystal-group--wide">
      <div class="crystal-merged-box">
        <div class="crystal-merged-label">月亮・上升共同呼應</div>
        <div class="crystal-merged-names">${escapeHtmlLocal(mergeResult.crystals.join('・'))}</div>
        <div class="crystal-merged-text">${escapeHtmlLocal(buildMergedText(mergeResult))}</div>
      </div>
    </div>`;
}

/* moonResult/ascendantConfig/ascendantIndex 沿用 calcAndRender() 裡已經算好的星座解析結果，
   這裡不重新判斷跨界/unavailable/error，只依三種既有規則（見 crystal-matching-rule-model.md 第四節）
   決定水晶微調要不要顯示、顯示什麼。 */
function buildCrystalSectionHtml(sunIndex, moonResult, ascendantConfig, ascendantIndex) {
  const sunSignName = SIGN_ORDER[sunIndex];
  const sunReading = READINGS_DATA.sunReadings[sunIndex];
  const mainList = getMainCrystalsByName(sunSignName);

  let moonPick = null;
  if (moonResult.mode === 'exact') {
    moonPick = pickMatchingCrystals(mainList, getMoonNeedsByName(SIGN_ORDER[moonResult.sign]));
  }

  let risingPick = null;
  if (ascendantConfig.state === 'complete') {
    risingPick = pickMatchingCrystals(mainList, getAscendantNeedsByName(SIGN_ORDER[ascendantIndex]));
  }

  let mergeResult = null;
  if (moonPick && risingPick) {
    mergeResult = shouldMergeDisplay(moonPick, risingPick);
  }

  let tuneHtml;
  if (mergeResult && mergeResult.merge) {
    // 特殊情況：合併成一個區塊，取代下面原本各自獨立的月亮/上升微調兩個區塊。
    tuneHtml = renderMergedGroup(mergeResult);
  } else {
    let moonHtml;
    if (moonPick) {
      moonHtml = renderTuneGroup('月亮情境微調', moonPick, moonPick.fallback ? '' : buildMoonTuneText(moonPick), fallbackMoon());
    } else {
      moonHtml = renderSkipGroup('月亮情境微調', '你的月亮星座位於跨界區間，因此暫不加入月亮情境微調，以避免使用不確定的結果。', '補上出生時間', 'focusTimeField()');
    }

    let risingHtml;
    if (risingPick) {
      risingHtml = renderTuneGroup('上升情境微調', risingPick, risingPick.fallback ? '' : buildRisingTuneText(risingPick), fallbackRising());
    } else if (ascendantConfig.state === 'unavailable') {
      risingHtml = renderSkipGroup('上升情境微調', '補上出生時間與出生地，就能加入上升情境的水晶微調。', '補上出生時間與地點', 'focusTimeField()');
    } else {
      // ascendantConfig.state === 'error'：依規則第四節，水晶區直接略過，不重複顯示錯誤訊息。
      risingHtml = '';
    }

    tuneHtml = moonHtml + risingHtml;
  }

  // 示意圖的珠子光暈標註＝月亮/上升這次實際選中的水晶（非 fallback 時才有 selectedCrystals），
  // 直接沿用上面已經算好的 pick 結果，不重新跑一次規則引擎。
  const highlightNames = [...(moonPick ? moonPick.selectedCrystals : []), ...(risingPick ? risingPick.selectedCrystals : [])];

  return `
    <div class="crystal-card">
      <img class="crystal-card-bg-deco" src="zodiac-natal/assets/illustrations/crystal-bracelet-template.png" alt="" aria-hidden="true" loading="lazy">
      <div class="crystal-illustration">
        <div class="crystal-illustration-badge">示意搭配圖</div>
        ${buildCrystalBraceletSvg(mainList, highlightNames)}
        <p class="crystal-illustration-caption">依推薦水晶生成的風格示意，實際設計仍會依珠徑、手圍與現有素材調整。</p>
      </div>
      <div class="crystal-overview">
        <div class="crystal-card-header">
          <img class="crystal-card-icon" src="zodiac-natal/assets/illustrations/effect-sparkle-medium-01.png" alt="" aria-hidden="true" loading="lazy">
          <span class="crystal-card-title">水晶建議</span>
        </div>
        <div class="crystal-card-subtitle">太陽主水晶清單永遠完整顯示，月亮／上升則從同一份清單裡各自挑出最呼應當下情境的 1-2 顆做微調。</div>
        ${renderCrystalOverviewSummary(mainList, moonPick, risingPick)}
      </div>
      ${renderSunCrystalGroup(sunReading, mainList)}
      <div class="crystal-tune-row">${tuneHtml}</div>
    </div>`;
}

function calcAndRender() {
  if (!isMoonLibraryAvailable()) {
    document.getElementById('lib-error-banner').classList.add('show');
    return;
  }

  const dateVal = document.getElementById('birth-date').value;
  if (!dateVal) { alert('請選擇出生日期'); return; }
  if (dateVal > getTodayDateString()) { alert('請輸入正確的出生日期'); return; }
  const [y, m, d] = dateVal.split('-').map(Number);

  const timeVal = document.getElementById('birth-time').value;
  let hour = null, minute = null;
  if (timeVal) { const [h, mi] = timeVal.split(':').map(Number); hour = h; minute = mi; }

  // 有出生時間時，出生縣市展開並必填（目前只做驗證收集，還不會用來計算——上升星座顯示是 M4-B 的範圍）
  if (timeVal && !document.getElementById('birth-city').value) {
    alert('請選擇出生縣市');
    return;
  }

  // ---- 太陽區塊：只需要日期，永遠 complete，不受月亮狀態影響 ----
  const sunIndex = getSunSignIndex(m, d);
  const sunReading = READINGS_DATA.sunReadings[sunIndex];
  const sunConfig = {
    icon: '☀', title: '太陽星座', state: 'complete', statusLabel: '已完成', reading: sunReading
  };

  // ---- 月亮區塊：complete（有時間 / 當天不跨界）或 ambiguous（跨界且無時間）----
  const moonResult = calcMoonSign(y, m, d, hour, minute);
  // 日期級查表，不再是年份級的「警告」語氣：只有出生日期真的落在DST期間才顯示，且是中性資訊說明，不是警示
  const dstInfoText = isDstPeriod(y, m, d)
    ? '你輸入的日期位於台灣曾實施日光節約時間的期間，本次計算已套用當時的歷史時區。'
    : undefined;

  let moonConfig;
  if (moonResult.mode === 'exact') {
    const moonReading = READINGS_DATA.moonReadings[moonResult.sign];
    moonConfig = {
      icon: '🌙', title: '月亮星座', state: 'complete', statusLabel: '已完成', reading: moonReading,
      note: hour !== null ? '已依你填寫的出生日期與時間計算' : '這天全天月亮都在同一個星座，不受出生時間影響',
      info: dstInfoText
    };
  } else {
    const [i1, i2] = moonResult.signs;
    moonConfig = {
      icon: '🌙', title: '月亮星座', state: 'ambiguous', statusLabel: '等待補時間',
      ambiguous: {
        candidates: [
          { sign: READINGS_DATA.moonReadings[i1].sign, symbol: READINGS_DATA.moonReadings[i1].symbol },
          { sign: READINGS_DATA.moonReadings[i2].sign, symbol: READINGS_DATA.moonReadings[i2].symbol }
        ],
        hint: '今天月亮剛好跨越兩個星座，補上出生時間即可確認。',
        actionLabel: '補上出生時間',
        actionOnClick: 'focusTimeField()'
      },
      info: dstInfoText
    };
  }

  // ---- 上升星座區塊：complete/unavailable/error，跟太陽/月亮的狀態互不影響 ----
  const { config: ascendantConfig, ascendantIndex } = buildAscendantConfig(y, m, d, hour, minute, timeVal);

  document.getElementById('hero-container').innerHTML = buildHeroHtml(sunIndex, moonResult, ascendantConfig, ascendantIndex);
  initHeroTriangleReveal();

  document.getElementById('facet-sun-container').innerHTML =
    buildFacetSectionHtml('sun', sunConfig, SIGN_TAGS[sunIndex], ['coreTrait', 'outerStyle']);
  document.getElementById('facet-moon-container').innerHTML =
    buildFacetSectionHtml('moon', moonConfig, moonResult.mode === 'exact' ? SIGN_TAGS[moonResult.sign] : null, ['emotionalNeed', 'coreTrait']);
  document.getElementById('facet-asc-container').innerHTML =
    buildFacetSectionHtml('asc', ascendantConfig, ascendantConfig.state === 'complete' ? SIGN_TAGS[ascendantIndex] : null, ['outerStyle', 'coreTrait']);

  document.getElementById('crystal-section-container').innerHTML = buildCrystalSectionHtml(sunIndex, moonResult, ascendantConfig, ascendantIndex);
  document.getElementById('disclaimer-footer').textContent = READINGS_DATA.disclaimer;

  // ---- 整體摘要：只有月亮是確定的單一星座時才能算（月亮 ambiguous 時沒有單一答案可以餵進去）----
  const summaryContainer = document.getElementById('summary-container');
  if (moonResult.mode === 'exact') {
    const summary = NatalSummary.buildSummary({ sunIndex, moonIndex: moonResult.sign, ascendantIndex });
    summaryContainer.innerHTML = renderSummaryCard(summary);
  } else {
    summaryContainer.innerHTML = '';
  }

  document.getElementById('input-view').classList.remove('show');
  document.getElementById('result-view').classList.add('show');
  showChapterImmediately('natal');
  window.scrollTo({ top: 0 });
}

document.addEventListener('DOMContentLoaded', () => {
  if (!isMoonLibraryAvailable()) {
    document.getElementById('lib-error-banner').classList.add('show');
    document.getElementById('calc-btn').disabled = true;
  }
  populateCitySelect();
  document.getElementById('birth-date').max = getTodayDateString();
  document.getElementById('birth-time').addEventListener('input', updateCityFieldVisibility);
  updateCityFieldVisibility();
  tryRenderSharedView();
});
</script>

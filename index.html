<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celestedestin · 生命靈數解析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --bg: #F5F0EB;
  --card: #FFFFFF;
  --border: #E8DDD5;
  --rose: #D4B5A8;
  --sage: #A8B5A2;
  --blue: #9BAEBE;
  --brown: #5C4A3A;
  --gold: #C8A96E;
  --lavender: #B8A4C8;
  --text: #5C4A3A;
  --text-light: #8C7A6E;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light; }
body {
  background:
    radial-gradient(ellipse 600px 400px at 10% 30%, rgba(212,181,168,0.4) 0%, transparent 70%),
    radial-gradient(ellipse 500px 600px at 90% 70%, rgba(155,174,190,0.3) 0%, transparent 70%),
    radial-gradient(ellipse 400px 300px at 50% 10%, rgba(184,164,200,0.2) 0%, transparent 60%),
    #F5F0EB;
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  padding: 0;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
h1, h2, h3, .num-display { font-family: 'Noto Serif TC', serif; }

/* Input view */
#input-view {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 48px 24px;
}
/* Result view */
#result-view {
  display: none;
  padding: 32px 24px 40px;
  max-width: 920px;
  margin: 0 auto;
}
#result-view > *:last-child {
  margin-bottom: 0 !important;
  padding-bottom: 0 !important;
}
#result-view-header {
  text-align: center;
  margin-bottom: 32px;
  padding-bottom: 16px;
  border-bottom: 0.5px solid #E8DDD5;
}
#result-view-brand {
  font-family: 'Noto Serif TC', serif;
  font-size: 12px;
  font-weight: 300;
  color: #B0A89A;
  letter-spacing: 0.15em;
  margin-bottom: 6px;
}
#result-view-name {
  font-family: 'Noto Serif TC', serif;
  font-size: 20px;
  font-weight: 300;
  color: #5C4A3A;
}
/* Brand poem */
.brand-poem {
  max-width: 480px;
  margin: 0 auto 32px;
  text-align: center;
}
.brand-poem-deco { width: 40px; height: 0.5px; background: #D4B5A8; margin: 16px auto; }
.brand-poem-line { font-size: 15px; color: #7A6A5A; font-weight: 300; letter-spacing: 0.04em; line-height: 1.9; margin-bottom: 2px; }
.brand-poem-sub { font-size: 13px; color: #9A8A7A; font-style: italic; margin-top: 8px; letter-spacing: 0.06em; }
/* Restart button */
.btn-restart {
  display: flex;
  align-items: center;
  justify-content: center;
  width: fit-content;
  line-height: 1;
  margin: 40px auto 0;
  background: #FFFFFF;
  border: 0.5px solid #D4B5A8;
  color: #7A6A5A;
  padding: 14px 40px;
  border-radius: 24px;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  font-weight: 300;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-restart:hover { background: rgba(212,181,168,0.08); border-color: #C4A598; }
#reset-btn-wrapper {
  display: flex !important;
  justify-content: center !important;
  width: 100% !important;
  margin: 32px 0 48px !important;
  float: none !important;
  clear: both !important;
  position: static !important;
}
#reset-btn {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  float: none !important;
  position: static !important;
  margin: 0 !important;
}
#reset-btn, #reset-btn * { box-sizing: border-box; line-height: 1 !important; vertical-align: middle !important; }
#reset-btn::before, #reset-btn::after { display: none !important; }
/* Input section */
.brand { text-align: center; margin-bottom: 32px; }
.brand-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 1.6rem;
  font-weight: 300;
  color: var(--brown);
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}
.brand-deco {
  width: 40px;
  height: 0.5px;
  background: var(--rose);
  margin: 0 auto 12px;
}
.brand-sub { font-size: 0.8rem; color: var(--text-light); letter-spacing: 0.15em; }

.input-card {
  background: var(--card);
  border: 0.5px solid rgba(212,181,168,0.4);
  border-radius: var(--radius);
  padding: 40px;
  max-width: 520px;
  margin: 0 auto;
  box-shadow: 0 4px 24px rgba(92,74,58,0.06), 0 1px 4px rgba(92,74,58,0.04);
  position: relative;
  overflow: hidden;
}
.input-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,181,168,0.5), transparent);
}
.form-group { margin-bottom: 24px; }
.form-label { display: block; font-size: 0.75rem; color: var(--text-light); letter-spacing: 0.1em; margin-bottom: 8px; }
.form-input {
  width: 100%;
  background: var(--bg);
  border: 0.5px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 0.9rem;
  font-weight: 300;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus { border-color: var(--rose); }
.date-row { display: flex; gap: 10px; }
.date-row .form-input { flex: 1; }
.btn-analyze {
  width: 100%;
  background: var(--rose);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 14px;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 0.9rem;
  font-weight: 300;
  letter-spacing: 0.1em;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: opacity 0.2s;
  margin-top: 8px;
}
.btn-analyze:hover { opacity: 0.85; }
.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Result section (inner, for PDF capture) */
#result-section { max-width: 860px; margin: 0 auto; }
/* View transitions */
.fade-out { animation: fadeOut 0.4s ease forwards; }
.fade-in { animation: fadeIn 0.6s ease forwards; }
@keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Numerology cards */
.num-cards {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.num-card {
  background: var(--card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 10px;
  text-align: center;
  position: relative;
  transition: all 0.25s ease;
  cursor: default;
}
.num-card:not(.main):hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(92,74,58,0.12);
}
.num-cards .num-card:nth-child(2) { background: linear-gradient(145deg, #EEE8E0, #E6DDD4); }
.num-cards .num-card:nth-child(3) { background: linear-gradient(145deg, #EAE8E4, #E2DDD8); }
.num-cards .num-card:nth-child(4) { background: linear-gradient(145deg, #E8EAE8, #E0E4E0); }
.num-cards .num-card:nth-child(5) { background: linear-gradient(145deg, #E4E8EE, #DCE2EA); }
.num-cards .num-card:nth-child(6) { background: linear-gradient(145deg, #E6E4EC, #DED8E8); }
.num-card-label { font-size: 11px; color: #9A8A7A; letter-spacing: 0.08em; margin-bottom: 6px; }
.num-card-value {
  font-family: 'Noto Serif TC', serif;
  font-size: 28px;
  font-weight: 300;
  color: #5C4A3A;
  line-height: 1;
  margin-bottom: 4px;
}
.num-card-sub { font-size: 11px; color: #B0A090; }
.num-card.main {
  background: linear-gradient(145deg, #F0E6E0, #E8D8D0);
  border: 1px solid #D4B5A8;
  transition: all 0.3s ease;
}
.num-card.main:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(212,181,168,0.35);
}
.num-card.main .num-card-value {
  font-family: 'Noto Serif TC', serif;
  font-size: 48px;
  font-weight: 300;
  color: #6A4A40;
}
.num-card.main .num-card-label { color: #B0908A; }
.num-card.main .num-card-sub { font-size: 13px; color: #8A6A60; letter-spacing: 0.1em; }
.base-energy-note { font-size: 11px; color: #A08878; margin-top: 6px; letter-spacing: 0.08em; opacity: 0.85; }
.master-number-note { background: linear-gradient(135deg, #F5EDE8, #EDE0D8); border-left: 3px solid #D4B5A8; border-radius: 6px; padding: 14px 16px; margin-bottom: 20px; font-size: 13px; color: #6A5A50; line-height: 1.8; }
.master-number-note strong { color: #8A5A50; font-size: 14px; display: block; margin-bottom: 6px; letter-spacing: 0.05em; }
.num-card-star { position: absolute; top: 8px; right: 10px; color: #D4B5A8; font-size: 12px; }
.num-card-icon { position: absolute; top: 8px; right: 10px; opacity: 0.7; }
.innate-digits {
  font-size: 0.72rem;
  color: var(--text-light);
  text-align: center;
  letter-spacing: 0.15em;
  margin-bottom: 32px;
}

/* Grid section */
.section-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 1rem;
  font-weight: 300;
  color: var(--brown);
  letter-spacing: 0.1em;
  margin-bottom: 20px;
  padding-bottom: 8px;
  border-bottom: 0.5px solid var(--border);
}
.grid-wrapper {
  background: linear-gradient(160deg, #FDFBF9, #F8F4F0);
  border: 0.5px solid #E8DDD5;
  border-radius: 20px;
  padding: 36px;
  margin-bottom: 16px;
  box-shadow: 0 4px 24px rgba(92,74,58,0.05);
  display: flex;
  flex-direction: column;
  align-items: center;
}
.grid-wrapper-desc {
  font-size: 11px;
  color: #B0A89A;
  letter-spacing: 0.08em;
  text-align: center;
  margin-bottom: 20px;
}
/* Tab 3 energy overview */
.energy-row {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 4px 12px;
  padding: 14px 0;
  border-bottom: 0.5px solid #F0EDE8;
  align-items: start;
}
.energy-row:last-child { border-bottom: none; }
.energy-row-meta { display: flex; flex-direction: column; gap: 4px; }
.energy-row-role {
  display: inline-block;
  font-size: 10px;
  background: rgba(212,181,168,0.18);
  color: #C8846A;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.04em;
}
.energy-row-src { font-size: 12px; color: #5C4A3A; padding-left: 2px; }
.energy-row-desc { font-size: 11px; color: #9A8A7A; line-height: 1.6; }
.energy-row-beads {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-top: 8px;
  flex-wrap: wrap;
}
.energy-crystal-names { font-size: 12px; color: #7A6458; }
.design-plan {
  border: 0.5px solid #E8DDD5;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
}
.design-plan-a { background: #FDFAF7; }
.design-plan-b { background: #F8F5F1; }
.design-plan-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  flex-wrap: wrap;
  gap: 8px;
}
.design-badge {
  font-size: 10px;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: 0.05em;
}
.design-badge.rose { background: rgba(212,181,168,0.25); color: #9A6A58; }
.design-badge.blue { background: rgba(155,174,190,0.25); color: #5A7898; }
.bead-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 10px;
  font-size: 11px;
  color: #9A8A7A;
}
.nine-grid-container { display: flex; flex-direction: column; align-items: center; width: 100%; }
.nine-grid {
  display: grid;
  grid-template-columns: repeat(3, 80px);
  grid-template-rows: repeat(3, 80px);
  gap: 10px;
  margin: 28px 4px 4px;
  position: relative;
  z-index: 1;
}
.grid-cell {
  width: 80px; height: 80px;
  border-radius: 12px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative;
  overflow: hidden;
  border: 0.5px solid rgba(255,255,255,0.2);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), inset 0 -1px 0 rgba(0,0,0,0.08), 0 2px 6px rgba(92,74,58,0.12);
}
.grid-cell.missing { background: #F2EDE8; border: 1px dashed #D8CFC6; box-shadow: none; }
.grid-cell-label {
  position: absolute;
  top: 6px; right: 7px;
  font-size: 9px;
  color: rgba(255,255,255,0.7);
  letter-spacing: 0.05em;
  pointer-events: none;
}
.grid-cell-num {
  font-family: 'Noto Serif TC', serif;
  font-size: 28px;
  font-weight: 300;
  color: rgba(255,255,255,0.95);
  line-height: 1;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.grid-cell.missing .grid-cell-num { color: #C0B4AA; text-shadow: none; }
.grid-cell-count { font-size: 11px; color: rgba(255,255,255,0.8); margin-top: 2px; }
.grid-cell-missing-label { font-size: 10px; color: #C0B4AA; margin-top: 2px; }

/* SVG overlay for lines */
.grid-svg-overlay {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 2;
}
#grid-lines-svg {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  overflow: visible;
  z-index: 2;
}
#nine-grid-container {
  position: relative !important;
  overflow: visible !important;
}

/* Line cards */
.line-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 16px; margin-bottom: 32px; }
.line-card {
  background: rgba(255,255,255,0.8);
  border: 0.5px solid #E8DDD5;
  border-radius: 10px;
  padding: 14px 18px 14px 18px;
  font-size: 0.72rem;
  color: var(--text-light);
  box-shadow: 0 2px 8px rgba(92,74,58,0.04);
}
.line-card-name { font-size: 13px; font-weight: 500; color: var(--brown); margin-bottom: 4px; }
.line-card-desc { font-size: 12px; color: #8A7A6A; line-height: 1.6; margin-top: 4px; }

/* Tabs */
.tabs-container { margin-bottom: 32px; }
.tab-nav {
  display: flex;
  justify-content: center;
  gap: 32px;
  border-bottom: 0.5px solid var(--border);
  margin-bottom: 24px;
  flex-wrap: wrap;
  scrollbar-width: none;
}
.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn {
  background: none; border: none;
  padding: 12px 0;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  font-weight: 300;
  color: #9A8A7A;
  letter-spacing: 0.06em;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -0.5px;
  white-space: nowrap;
  transition: all 0.2s;
}
.tab-btn.active { color: #5C4A3A; border-bottom-color: #5C4A3A; font-weight: 500; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* Analysis tab */
.analysis-num {
  display: flex; align-items: baseline; gap: 12px;
  margin-bottom: 20px;
}
.analysis-num-big {
  font-family: 'Noto Serif TC', serif;
  font-size: 3.5rem;
  font-weight: 300;
  color: var(--rose);
  line-height: 1;
}
.analysis-num-name {
  font-family: 'Noto Serif TC', serif;
  font-size: 1.2rem;
  font-weight: 300;
  color: var(--brown);
}
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.tag {
  background: rgba(212,181,168,0.15);
  border: 1px solid rgba(212,181,168,0.6);
  border-radius: 20px;
  padding: 6px 16px;
  font-size: 13px;
  color: #7A6458;
  letter-spacing: 0.04em;
}
.analysis-section { margin-bottom: 24px; }
.analysis-section-title {
  font-size: 11px;
  color: #9A8A7A;
  letter-spacing: 0.14em;
  margin-bottom: 8px;
  padding-bottom: 6px;
  padding-left: 11px;
  border-bottom: 0.5px solid var(--border);
  position: relative;
}
.analysis-section-title::before {
  content: '';
  position: absolute;
  left: 0; top: 2px;
  width: 3px; height: 14px;
  background: #D4B5A8;
  border-radius: 2px;
}
.analysis-text { font-size: 14px; line-height: 1.9; color: #5C4A3A; font-weight: 300; }
.shadow-text {
  color: #9A8A7A;
  font-size: 13px;
  font-style: italic;
  border-left: 2px solid #E8DDD5;
  padding-left: 12px;
  line-height: 1.8;
  margin-top: 8px;
}
.compat-nums { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.compat-num {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: #D4B5A8;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: 'Noto Serif TC', serif;
  font-size: 15px;
  color: #fff;
}
.dark-section .analysis-section-title { color: var(--brown); }

/* Career tab */
.career-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.career-card {
  background: var(--card);
  border: 0.5px solid #E8DDD5;
  border-radius: 10px;
  padding: 16px;
  display: flex; align-items: flex-start; gap: 12px;
  transition: all 0.2s;
  cursor: default;
}
.career-card:hover { background: rgba(212,181,168,0.08); border-color: #D4B5A8; }
.career-icon { flex-shrink: 0; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(155,174,190,0.08); border-radius: 8px; }
.career-info { flex: 1; min-width: 0; }
.career-name { font-size: 14px; color: #5C4A3A; margin-bottom: 4px; font-weight: 400; }
.career-desc { font-size: 12px; color: #9A8A7A; line-height: 1.6; }
.year-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; }
.year-card {
  background: var(--card);
  border: 0.5px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
}
.year-card.current { border-color: var(--rose); background: rgba(212,181,168,0.08); }
.year-num { font-family: 'Noto Serif TC', serif; font-size: 0.75rem; color: var(--text-light); margin-bottom: 6px; }
.year-value {
  font-family: 'Noto Serif TC', serif;
  font-size: 1.8rem;
  color: var(--brown);
  font-weight: 300;
  margin-bottom: 6px;
}
.year-card.current .year-value { color: var(--rose); }
.year-desc { font-size: 0.7rem; color: var(--text-light); line-height: 1.6; }

/* Crystal tab */
.crystal-section-title {
  font-size: 0.8rem;
  color: var(--text-light);
  letter-spacing: 0.1em;
  margin: 20px 0 12px;
  padding-bottom: 6px;
  border-bottom: 0.5px solid var(--border);
}
.crystal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.crystal-card {
  background: var(--card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 8px;
  transition: all 0.3s ease;
  cursor: default;
}
.crystal-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(92,74,58,0.12);
  border-color: #D4B5A8;
}
.crystal-card:hover .gem-svg {
  animation: gemRotate 0.6s ease-in-out;
}
@keyframes gemRotate {
  0%   { transform: rotate(0deg) scale(1); }
  25%  { transform: rotate(-8deg) scale(1.08); }
  75%  { transform: rotate(8deg) scale(1.08); }
  100% { transform: rotate(0deg) scale(1); }
}
.crystal-name { font-size: 0.85rem; color: var(--brown); font-weight: 400; }
.crystal-chakra { font-size: 0.65rem; color: var(--text-light); letter-spacing: 0.08em; }
.crystal-desc { font-size: 0.72rem; color: var(--text-light); line-height: 1.6; }

/* Energy card flow */
.energy-flow { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; margin-bottom: 16px; }
.energy-card {

  50% { opacity: 0.65; }
}

  opacity: 0;

}
.growth-stage.visible {
  opacity: 1;
  transform: translateY(0);
}
.growth-arrow {

  transform: translateX(-6px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  display: inline-block;
}
.growth-arrow.visible {

  transform: translateX(0);

}

  50% { transform: translateX(5px); opacity: 0.5; }
}
@keyframes arrowPulseDown {

// ============================================================
// CALCULATIONS
// ============================================================
function reduceNum(n) {
  while (n > 9 && n !== 11 && n !== 22 && n !== 33) {
    n = String(n).split('').reduce((a,b) => a + parseInt(b), 0);
  }
  return n;
}

function calcLife(y, m, d) {
  const digits = (String(y) + String(m) + String(d)).split('').map(Number);
  return reduceNum(digits.reduce((a,b) => a+b, 0));
}

// 天賦數：所有生日數字相加一次，保留兩位數（不繼續化簡），11/22/33/44 同樣保留
function calcGift(y, m, d) {
  return (String(y) + String(m).padStart(2,'0') + String(d).padStart(2,'0'))
    .split('').reduce((a,b) => a + parseInt(b), 0);
}

// 強制化簡到個位數（不保留主數，用於星座數與九宮格）
function reduceToSingle(n) {
  while (n > 9) n = String(n).split('').reduce((a,b) => a + parseInt(b), 0);
  return n;
}

// 主數 11/22/33 的底層能量（即化簡後的個位數）
function getBaseEnergyNumber(lifeNum) {
  if (lifeNum === 11) return 2;
  if (lifeNum === 22) return 4;
  if (lifeNum === 33) return 6;
  return null;
}

// 九宮格計數用：主數展開為組成數字（22 → [2,2]，11 → [1,1]，33 → [3,3]，其他直接個位）
function getLifeNumberDigitsForGrid(lifeNum) {
  if (lifeNum === 11) return [1, 1];
  if (lifeNum === 22) return [2, 2];
  if (lifeNum === 33) return [3, 3];
  return [reduceToSingle(lifeNum)];
}

function calcBirthDay(d) {
  return reduceToSingle(String(d).split('').reduce((a,b) => a+parseInt(b), 0));
}

function getZodiac(m, d) {
  for (const z of ZODIAC_DATA) {
    const [sm, sd] = z.start; const [em, ed] = z.end;
    if (sm > em) { // crosses year boundary
      if ((m === sm && d >= sd) || (m === em && d <= ed)) return z;
    } else {
      if ((m === sm && d >= sd) || (m === em && d <= ed) || (m > sm && m < em)) return z;
    }
  }
  return ZODIAC_DATA[0];
}

function calcZodiacNum(zodiacRawNum) {
  return reduceToSingle(zodiacRawNum); // 10→1, 11→2, 12→3
}

function calcPersonalYear(y, m, d, targetYear) {
  const digits = String(targetYear).split('').map(Number)
    .concat(String(m).split('').map(Number))
    .concat(String(d).split('').map(Number));
  return reduceToSingle(digits.reduce((a,b) => a+b, 0));
}

function calcPersonalMonth(personalYear, currentMonth) {
  return reduceToSingle(personalYear + currentMonth);
}

function calcPersonalDay(personalMonth, dayOfMonth) {
  return reduceToSingle(personalMonth + (dayOfMonth || new Date().getDate()));
}

// ============================================================
// CRYSTAL SVG
// ============================================================
function _normHex(c) {
  if (!c || c.charAt(0) !== '#') return '#D4B5A8';
  if (c.length === 4) return '#' + c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
  return c;
}
function _darken(hex, amt) {
  hex = _normHex(hex);
  const r = Math.max(0, parseInt(hex.slice(1,3),16) - amt);
  const g = Math.max(0, parseInt(hex.slice(3,5),16) - amt);
  const b = Math.max(0, parseInt(hex.slice(5,7),16) - amt);
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function _lighten(hex, amt) {
  hex = _normHex(hex);
  const r = Math.min(255, parseInt(hex.slice(1,3),16) + amt);
  const g = Math.min(255, parseInt(hex.slice(3,5),16) + amt);
  const b = Math.min(255, parseInt(hex.slice(5,7),16) + amt);
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function createGemSVG(color) {
  const c = _normHex(color);
  const dk = _darken(c, 20);
  const lt = _lighten(c, 20);
  return `<svg class="gem-svg" viewBox="0 0 48 52" width="48" height="52">
    <polygon points="24,2 44,14 44,38 24,50 4,38 4,14" fill="${c}" stroke="${dk}" stroke-width="0.5" opacity="0.9"/>
    <polygon points="24,2 4,14 24,26" fill="${dk}" opacity="0.8"/>
    <polygon points="24,2 44,14 24,26" fill="${lt}" opacity="0.9"/>
    <polygon points="24,2 34,10 14,10" fill="white" opacity="0.5"/>
    <circle cx="24" cy="22" r="2" fill="white" opacity="0.7"/>
  </svg>`;
}

function createBeadSVG(color, delay) {
  const c = _normHex(color);
  return `<svg viewBox="0 0 32 32" width="32" height="32">
    <circle cx="16" cy="16" r="14" fill="${c}"/>

function renderGrid(counts) {
  let gridHTML = `<div id="nine-grid-container" style="position:relative;display:inline-block">
    <div style="background:rgba(255,255,255,0.5);border-radius:16px;padding:20px;display:inline-flex">
      <div class="nine-grid" id="nine-grid">`;

  for (const n of [7,8,9,4,5,6,1,2,3]) {
    const cnt = counts[n] || 0;
    const gc = gridColors[n];
    if (cnt > 0) {
      const grad = cnt >= 3 ? gc.dark : cnt === 2 ? gc.base : gc.light;
      gridHTML += `<div class="grid-cell has-num" data-num="${n}"
        style="background:${grad};box-shadow:inset 0 1px 0 rgba(255,255,255,0.2),0 2px 8px rgba(0,0,0,0.08)">
        <div class="grid-cell-label">${gc.label}</div>
        <div class="grid-cell-num">${n}</div>
        <div class="grid-cell-count">×${cnt}</div>
      </div>`;
    } else {
      gridHTML += `<div class="grid-cell missing" data-num="${n}">
        <div class="grid-cell-label" style="color:#C0B4AA">${gc.label}</div>
        <div class="grid-cell-num">${n}</div>
        <div class="grid-cell-missing-label">缺</div>
      </div>`;
    }
  }
  gridHTML += `</div></div>`;  // close nine-grid + inner wrapper
  gridHTML += `<svg id="grid-lines-svg" fill="none"></svg>`;

function drawGridLines() {
  const svg = document.getElementById('grid-lines-svg');
  if (!svg) return;
  svg.innerHTML = '';

  const gridWrapper =
    document.getElementById('nine-grid-container') ||
    document.querySelector('.nine-grid-wrapper') ||
    document.querySelector('[class*="nine-grid"]') ||
    document.querySelector('.grid-cells-container');

  if (!gridWrapper) return;

  let el = gridWrapper;
  while (el && el.id !== 'result-view') {
    const style = window.getComputedStyle(el);
    if (style.overflow === 'hidden' || style.overflowX === 'hidden' || style.overflowY === 'hidden') {
      el.style.overflow = 'visible';
    }
    el = el.parentElement;
  }

  setTimeout(() => {
    const cells = gridWrapper.querySelectorAll('.grid-cell[data-num]');
    if (cells.length < 9) return;

    const wrapperRect = gridWrapper.getBoundingClientRect();
    const w = wrapperRect.width;
    const h = wrapperRect.height;
    if (w === 0 || h === 0) return;

    const positions = {};
    cells.forEach(cell => {
      const num = parseInt(cell.getAttribute('data-num'));
      if (!num || num < 1 || num > 9) return;
      const rect = cell.getBoundingClientRect();
      positions[num] = {
        x: rect.left - wrapperRect.left + rect.width / 2,
        y: rect.top - wrapperRect.top + rect.height / 2
      };
    });

    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    Object.assign(svg.style, {
      position: 'absolute',
      top: '0',
      left: '0',
      width: w + 'px',
      height: h + 'px',
      pointerEvents: 'none',
      zIndex: '10',
      overflow: 'visible'
    });

    gridWrapper.style.position = 'relative';
    gridWrapper.style.overflow = 'visible';

    const digits = window.currentGridDigits || [];
    const lineConfig = [
      { nums: [1,4,7], color: '#B89888', dash: false },
      { nums: [2,5,8], color: '#9898B0', dash: false },
      { nums: [3,6,9], color: '#88A8A0', dash: false },
      { nums: [1,2,3], color: '#B89888', dash: true  },
      { nums: [4,5,6], color: '#9898B0', dash: true  },
      { nums: [7,8,9], color: '#88A8A0', dash: true  },
      { nums: [1,5,9], color: '#8898A8', dash: false },
      { nums: [3,5,7], color: '#A090B8', dash: false },
    ];

    let idx = 0;
    lineConfig.forEach(config => {
      if (!config.nums.every(n => digits.includes(n))) return;
      for (let i = 0; i < config.nums.length - 1; i++) {
        const p1 = positions[config.nums[i]];
        const p2 = positions[config.nums[i + 1]];
        if (!p1 || !p2) continue;

        const len = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
        line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
        line.setAttribute('stroke', config.color);
        line.setAttribute('stroke-width', '2');
        line.setAttribute('opacity', '0.8');
        if (config.dash) line.setAttribute('stroke-dasharray', '5,4');
        line.style.strokeDasharray = len;
        line.style.strokeDashoffset = len;
        line.style.animation = `drawLine 1s ease-in-out ${0.2 + idx * 0.2}s forwards`;
        svg.appendChild(line);
        idx++;
      }
    });
  }, 200);
}

function renderBracelet(crystalList, colors, label) {
  const beadSize = 32;
  const gap = 8;
  const count = crystalList.length;
  const totalW = count * (beadSize + gap) + gap;
  const totalH = beadSize + 20;
  const midY = totalH / 2;
  // Thread line
  let out = `<div class="bracelet-label">${label}</div>
  <div style="overflow-x:auto;padding:8px 0">
  <svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}">
    <line x1="${gap}" y1="${midY}" x2="${totalW-gap}" y2="${midY}" stroke="#E8DDD5" stroke-width="1"/>`;
  // Beads using createBeadSVG (rendered as foreignObject won't work; render SVG directly)
  crystalList.forEach((name, i) => {
    const bx = gap + i * (beadSize + gap);
    const by = (totalH - beadSize) / 2;
    const color = _normHex(colors[i] || '#D4B5A8');
    const delay = (i * 0.3).toFixed(2);
    out += `<g transform="translate(${bx},${by})">
      <circle cx="16" cy="16" r="14" fill="${color}"/>
      <ellipse cx="11" cy="10" rx="5" ry="3.5" fill="white" opacity="0.45"
        style="animation:crystalGlow 2.5s ease-in-out ${delay}s infinite"/>
      <ellipse cx="21" cy="22" rx="5" ry="3" fill="rgba(0,0,0,0.12)"/>
      <circle cx="13" cy="12" r="1.5" fill="white" opacity="0.65"/>
    </g>`;
  });
  out += `</svg></div>`;
  // Legend
  out += `<div class="bracelet-legend">`;
  crystalList.forEach((name, i) => {
    out += `<div class="legend-item">
      <div class="legend-dot" style="background:${_normHex(colors[i]||'#D4B5A8')}"></div>
      <span>${name}</span>
    </div>`;
  });
  out += `</div>`;
  return out;
}

function doCalculate(name, y, m, d) {
  const lifeNum = calcLife(y, m, d);
  const giftNum = calcGift(y, m, d);
  const birthDayNum = calcBirthDay(d);
  const zodiac = getZodiac(m, d);
  const zodiacNum = calcZodiacNum(zodiac.num);
  const currentYear = 2026;
  const currentMonth = 6;
  const personalYear = calcPersonalYear(y, m, d, currentYear);
  const personalMonth = calcPersonalMonth(personalYear, currentMonth);
  console.log('[流年數debug] 生日:', y, m, d, '→ 流年數:', personalYear, '(流月:', personalMonth, ')');

  // Innate digits
  const birthStr = String(y) + String(m).padStart(2,'0') + String(d).padStart(2,'0');

  // Counts for 9-grid（五個來源）
  const counts = {};
  const addToGrid = n => { if (n > 0) counts[n] = (counts[n]||0) + 1; };
  // 1. 先天數（生日每個數字，0不圈）
  birthStr.split('').forEach(ch => { const n = parseInt(ch); if (n > 0) addToGrid(n); });
  // 2. 命數（主數 11/22/33 展開為組成數字，其他化簡到個位）
  getLifeNumberDigitsForGrid(lifeNum).forEach(d => addToGrid(d));
  // 3. 天賦數（兩位數拆成個別數字，如 28 → 2 和 8）
  String(giftNum).split('').forEach(ch => addToGrid(parseInt(ch)));
  // 4. 星座數（已化簡為個位）
  addToGrid(zodiacNum);
  // 5. 生日數（已化簡為個位）
  addToGrid(birthDayNum);

  const missing = [];
  for (let i = 1; i <= 9; i++) { if (!counts[i]) missing.push(i); }

  state = { name, y, m, d, lifeNum, giftNum, birthDayNum, zodiac, zodiacNum, personalYear, personalMonth, counts, missing, currentYear, currentMonth, birthStr };

  window.currentLifeNumber = lifeNum;
  window.currentGiftNumber = giftNum;
  window.currentMissingNums = missing;
  window.currentYearNumber = personalYear;
  window.currentGridDigits = Object.keys(counts).map(Number).filter(n => n >= 1 && n <= 9);

  renderAll();
}

    .map(n => missingNumberData[n]?.crystals?.[0])
    .filter(Boolean);
  const balance = {name:'白水晶', color:'#EDE8E2', role:'balance'};
  const integrated = [
    mainCrystals[0] ? {...mainCrystals[0], role:'main'} : balance,
    mainCrystals[0] ? {...mainCrystals[0], role:'main'} : balance,
    giftCrystals[0] ? {...giftCrystals[0], role:'gift'} : (mainCrystals[1] ? {...mainCrystals[1], role:'main'} : balance),
    mainCrystals[1] ? {...mainCrystals[1], role:'main'} : (mainCrystals[0] ? {...mainCrystals[0], role:'main'} : balance),

function createCircularBracelet(beads, containerId) {
  const svgEl = document.getElementById(containerId);
  if (!svgEl) return;
  const cx = 140, cy = 140, r = 90, beadR = 16;
  const n = beads.length;
  const ns = 'http://www.w3.org/2000/svg';

  // Draw connection lines first
  beads.forEach((bead, i) => {
    const a1 = (i * 2 * Math.PI / n) - Math.PI / 2;
    const a2 = ((i + 1) * 2 * Math.PI / n) - Math.PI / 2;
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', (cx + r * Math.cos(a1)).toFixed(1));
    line.setAttribute('y1', (cy + r * Math.sin(a1)).toFixed(1));
    line.setAttribute('x2', (cx + r * Math.cos(a2)).toFixed(1));
    line.setAttribute('y2', (cy + r * Math.sin(a2)).toFixed(1));
    line.setAttribute('stroke', '#E0D5CC');
    line.setAttribute('stroke-width', '1.5');
    svgEl.appendChild(line);
  });

  // Draw beads
  beads.forEach((bead, i) => {
    const angle = (i * 2 * Math.PI / n) - Math.PI / 2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    const rawCol = _normHex(bead.color || '#D4B5A8');
    const isW = rawCol === '#EDE8E2';
    const fillCol = isW ? '#EAE5DE' : rawCol;
    const delay = (i * 0.3).toFixed(1);

    const g = document.createElementNS(ns, 'g');

    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('cx', x.toFixed(1));
    circle.setAttribute('cy', y.toFixed(1));
    circle.setAttribute('r', beadR);
    circle.setAttribute('fill', fillCol);
    if (isW) {
      circle.setAttribute('stroke', 'rgba(180,165,148,0.5)');
      circle.setAttribute('stroke-width', '1');
    }

    const hl = document.createElementNS(ns, 'ellipse');
    hl.setAttribute('cx', (x - beadR * 0.3).toFixed(1));
    hl.setAttribute('cy', (y - beadR * 0.3).toFixed(1));
    hl.setAttribute('rx', (beadR * 0.35).toFixed(1));
    hl.setAttribute('ry', (beadR * 0.22).toFixed(1));
    hl.setAttribute('fill', 'white');
    hl.setAttribute('opacity', isW ? '0.85' : '0.4');
    hl.style.animation = `crystalGlow 2.5s ease-in-out ${delay}s infinite`;

    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', (x - beadR * 0.25).toFixed(1));
    dot.setAttribute('cy', (y - beadR * 0.25).toFixed(1));
    dot.setAttribute('r', '2');
    dot.setAttribute('fill', 'white');
    dot.setAttribute('opacity', '0.65');

    g.appendChild(circle);
    g.appendChild(hl);
    g.appendChild(dot);
    svgEl.appendChild(g);
  });
}

function appendBead(svg, bead, x, y, r, delay) {
  const ns = 'http://www.w3.org/2000/svg';
  const g = document.createElementNS(ns, 'g');
  g.classList.add('bead-dynamic');
  const rawCol = _normHex(bead?.color || '#D4B5A8');
  const isW = rawCol === '#EDE8E2';
  const fillCol = isW ? '#EAE5DE' : rawCol;

  const circle = document.createElementNS(ns, 'circle');
  circle.setAttribute('cx', x.toFixed(1)); circle.setAttribute('cy', y.toFixed(1));
  circle.setAttribute('r', r);
  circle.setAttribute('fill', fillCol);
  if (isW) { circle.setAttribute('stroke', 'rgba(180,165,148,0.5)'); circle.setAttribute('stroke-width', '1'); }

  const hl = document.createElementNS(ns, 'ellipse');
  hl.setAttribute('cx', (x - r * 0.3).toFixed(1)); hl.setAttribute('cy', (y - r * 0.3).toFixed(1));
  hl.setAttribute('rx', (r * 0.35).toFixed(1)); hl.setAttribute('ry', (r * 0.22).toFixed(1));
  hl.setAttribute('fill', 'white'); hl.setAttribute('opacity', isW ? '0.85' : '0.4');
  hl.style.animation = `crystalGlow 2.5s ease-in-out ${delay}s infinite`;

  const dot = document.createElementNS(ns, 'circle');
  dot.setAttribute('cx', (x - r * 0.25).toFixed(1)); dot.setAttribute('cy', (y - r * 0.25).toFixed(1));
  dot.setAttribute('r', '1.5'); dot.setAttribute('fill', 'white'); dot.setAttribute('opacity', '0.65');

  g.appendChild(circle); g.appendChild(hl); g.appendChild(dot);
  svg.appendChild(g);
}

function renderBraceletLayout(beads, svgId, layout) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  const ns = 'http://www.w3.org/2000/svg';

  // Remove previously drawn dynamic elements
  svg.querySelectorAll('.bead-dynamic').forEach(el => el.remove());

  const n = beads.length;
  if (!n) return;

  if (layout === 'circle') {
    svg.setAttribute('viewBox', '0 0 280 280');
    svg.setAttribute('height', '200');
    const cx = 140, cy = 140, r = 90, beadR = 16;
    beads.forEach((bead, i) => {
      const a1 = (i * 2 * Math.PI / n) - Math.PI / 2;
      const a2 = ((i + 1) % n * 2 * Math.PI / n) - Math.PI / 2;
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', (cx + r * Math.cos(a1)).toFixed(1));
      line.setAttribute('y1', (cy + r * Math.sin(a1)).toFixed(1));
      line.setAttribute('x2', (cx + r * Math.cos(a2)).toFixed(1));
      line.setAttribute('y2', (cy + r * Math.sin(a2)).toFixed(1));
      line.setAttribute('stroke', '#E0D5CC'); line.setAttribute('stroke-width', '1.5');
      line.classList.add('bead-dynamic');
      svg.appendChild(line);
    });
    beads.forEach((bead, i) => {
      const angle = (i * 2 * Math.PI / n) - Math.PI / 2;
      appendBead(svg, bead, cx + r * Math.cos(angle), cy + r * Math.sin(angle), beadR, i * 0.3);
    });

  } else if (layout === 'arc') {
    svg.setAttribute('viewBox', '0 0 280 160');
    svg.setAttribute('height', '115');
    const startX = 20, endX = 260, midY = 120, controlY = 40;
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', `M ${startX} ${midY} Q 140 ${controlY} ${endX} ${midY}`);
    path.setAttribute('stroke', '#E0D5CC'); path.setAttribute('stroke-width', '1.5'); path.setAttribute('fill', 'none');
    path.classList.add('bead-dynamic');
    svg.appendChild(path);
    beads.forEach((bead, i) => {
      const t = n > 1 ? i / (n - 1) : 0.5;
      const x = (1-t)*(1-t)*startX + 2*(1-t)*t*140 + t*t*endX;
      const y = (1-t)*(1-t)*midY + 2*(1-t)*t*controlY + t*t*midY;
      appendBead(svg, bead, x, y, 14, i * 0.25);
    });
    [startX - 10, endX + 10].forEach(lx => {
      const clasp = document.createElementNS(ns, 'circle');
      clasp.setAttribute('cx', lx); clasp.setAttribute('cy', midY);
      clasp.setAttribute('r', '4'); clasp.setAttribute('fill', 'none');
      clasp.setAttribute('stroke', '#C8B8A8'); clasp.setAttribute('stroke-width', '1');
      clasp.classList.add('bead-dynamic');
      svg.appendChild(clasp);
    });

  } else if (layout === 'linear') {
    svg.setAttribute('viewBox', '0 0 280 80');
    svg.setAttribute('height', '57');
    const startX = 24, lineY = 40, spacing = n > 1 ? (280 - 48) / (n - 1) : 0;
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', startX); line.setAttribute('y1', lineY);
    line.setAttribute('x2', startX + spacing * (n - 1)); line.setAttribute('y2', lineY);
    line.setAttribute('stroke', '#E0D5CC'); line.setAttribute('stroke-width', '1.5');
    line.classList.add('bead-dynamic');
    svg.appendChild(line);
    beads.forEach((bead, i) => {
      appendBead(svg, bead, startX + i * spacing, lineY, 14, i * 0.2);
    });
  }
}

function renderCircleBracelet(beads, svgId) {
  const svgEl = document.getElementById(svgId);
  if (!svgEl) return;
  // 只移除動態珠子和連線，不重設 viewBox/width/height，維持固定 280×280
  svgEl.querySelectorAll('.bead-dynamic').forEach(el => el.remove());
  const cx = 140, cy = 140, r = 90, beadR = 16;
  const n = beads.length;
  const ns = 'http://www.w3.org/2000/svg';
  // 先畫連線
  beads.forEach((bead, i) => {
    const a1 = (i * 2 * Math.PI / n) - Math.PI / 2;
    const a2 = ((i + 1) % n * 2 * Math.PI / n) - Math.PI / 2;
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', (cx + r * Math.cos(a1)).toFixed(1));
    line.setAttribute('y1', (cy + r * Math.sin(a1)).toFixed(1));
    line.setAttribute('x2', (cx + r * Math.cos(a2)).toFixed(1));
    line.setAttribute('y2', (cy + r * Math.sin(a2)).toFixed(1));
    line.setAttribute('stroke', '#E0D5CC');
    line.setAttribute('stroke-width', '1.5');
    line.classList.add('bead-dynamic');
    svgEl.appendChild(line);
  });
  // 再畫珠子
  beads.forEach((bead, i) => {
    const angle = (i * 2 * Math.PI / n) - Math.PI / 2;
    appendBead(svgEl, bead, cx + r * Math.cos(angle), cy + r * Math.sin(angle), beadR, i * 0.3);
  });
}

function renderDesign(idx) {

  if (strandContainer) {
    strandContainer.innerHTML = '';

    const beadR = 18, gap = 8;
    const totalW = design.beads.length * (beadR * 2 + gap) - gap;
    svgEl.setAttribute('viewBox', `0 0 ${totalW} ${beadR * 2}`);

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', beadR);
      line.setAttribute('x2', x2); line.setAttribute('y2', beadR);

      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', beadR); c.setAttribute('r', beadR - 1);
      c.setAttribute('fill', bead?.color || '#D4B5A8');
      const hl = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');

      <li>白水晶淨化陣：將手鍊置於白水晶簇或水晶陣中心，靜置數小時，白水晶能自動吸收與轉化。</li>
    </ul>
  </div>`;

  document.getElementById('tab-3').innerHTML = html;
  renderCircleBracelet(currentBraceletBeads, 'bracelet-circle-1');
}

// ============================================================
// WRIST DIAGRAM SVG
// ============================================================
function wristDiagramSVG(beadColors, side) {
  const label = side === 'left'
    ? '建議配戴於左手（接收能量）'
    : '建議配戴於右手（釋放能量）';
  const cx = 120, cy = 110, rx = 88, ry = 50;
  const n = beadColors.length;
  const r = 9;
  let beadsSVG = '';
  for (let i = 0; i < n; i++) {
    const angle = Math.PI + (Math.PI * i / (n - 1));
    const x = cx + rx * Math.cos(angle);
    const y = cy + ry * Math.sin(angle);
    const col = beadColors[i] || '#D4B5A8';
    const lt = _lighten(col, 40);
    const id = `wb${side[0]}${i}`;
    beadsSVG += `
      <defs>
        <radialGradient id="${id}" cx="38%" cy="32%" r="55%">
          <stop offset="0%" stop-color="${lt}" stop-opacity="0.95"/>
          <stop offset="60%" stop-color="${col}" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="${_darken(col, 30)}" stop-opacity="0.95"/>
        </radialGradient>
      </defs>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="url(#${id})" stroke="${_darken(col,20)}" stroke-width="0.5"/>
      <ellipse cx="${(x-2).toFixed(1)}" cy="${(y-2).toFixed(1)}" rx="${r*0.35}" ry="${r*0.2}" fill="white" opacity="0.45" transform="rotate(-30 ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  }
  const handPath = side === 'left'
    ? 'M44,150 Q44,90 80,70 Q100,60 120,60 Q140,60 160,70 Q196,90 196,150'
    : 'M44,150 Q44,90 80,70 Q100,60 120,60 Q140,60 160,70 Q196,90 196,150';
  return `<div style="margin:16px 0;text-align:center">
    <div style="font-size:11px;color:#9A8A7A;letter-spacing:0.1em;margin-bottom:8px">${label}</div>
    <svg width="240" height="170" viewBox="0 0 240 170" style="display:inline-block;overflow:visible">
      <path d="${handPath}" fill="none" stroke="#D4B5A8" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
      <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#E8DDD5" stroke-width="1.2" stroke-dasharray="4,4"/>
      ${beadsSVG}
      <line x1="82" y1="158" x2="158" y2="158" stroke="#D4B5A8" stroke-width="0.8" opacity="0.6"/>
      <text x="${cx}" y="172" text-anchor="middle" font-size="9" fill="#B0A090" letter-spacing="0.06em" font-family="Noto Sans TC,sans-serif">手腕示意圖</text>
    </svg>
  </div>`;
}

function _getDateStr() {
  const now = new Date();
  return now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
}

function _captureResult(scale, pdfMode) {
  return new Promise((resolve, reject) => {
    document.body.classList.add('print-mode');
    if (pdfMode) document.body.classList.add('pdf-mode');
    const el = document.getElementById('result-section');
    const cardSelectors = '.career-card,.crystal-card,.year-card,.line-card,.design-plan,.energy-row,.analysis-section,.bracelet-note';
    const cards = pdfMode ? Array.from(el.querySelectorAll(cardSelectors)) : [];
    cards.forEach(c => { c.style.pageBreakInside = 'avoid'; });
    setTimeout(() => {
      const w = el.offsetWidth;
      html2canvas(el, {
        backgroundColor: '#F5F0EB',
        scale: scale || 2,
        useCORS: true,
        allowTaint: true,
        scrollY: -window.scrollY,
        width: w,
        windowWidth: w
      }).then(canvas => {
        document.body.classList.remove('print-mode');
        if (pdfMode) document.body.classList.remove('pdf-mode');
        cards.forEach(c => { c.style.pageBreakInside = ''; });
        resolve(canvas);
      }).catch(err => {
        document.body.classList.remove('print-mode');
        if (pdfMode) document.body.classList.remove('pdf-mode');
        cards.forEach(c => { c.style.pageBreakInside = ''; });
        reject(err);
      });
    }, 250);
  });
}

    <div style="font-size:11px;letter-spacing:0.2em;color:#B0A098;margin-bottom:12px;">CELESTEDESTIN · 生命靈數解析</div>
    <div style="font-size:22px;color:#5C4A3A;letter-spacing:0.08em;margin-bottom:8px;">${name || ''}</div>
    <div style="width:40px;height:0.5px;background:#D4B5A8;margin:0 auto 12px;"></div>
    <div style="font-size:13px;color:#7A6A5A;margin-bottom:4px;">${y}年${String(m).padStart(2,'0')}月${String(d).padStart(2,'0')}日</div>
    <div style="font-size:12px;color:#9A8A7A;letter-spacing:0.04em;">命數 ${lifeNum} · ${data?.name || ''} · ${new Date().toLocaleDateString('zh-TW')} 解析</div>`;
  resultView.insertBefore(header, resultView.firstChild);

  // Inject brand footer
  document.getElementById('download-footer-temp')?.remove();
  const footer = document.createElement('div');
  footer.id = 'download-footer-temp';
  footer.style.cssText = "padding:24px 0;text-align:center;border-top:0.5px solid #E8DDD5;margin-top:40px;font-family:'Noto Serif TC',serif;";
  footer.innerHTML = `<div style="font-size:11px;color:#C0B4A8;letter-spacing:0.15em;">Celestedestin · 水晶能量 · 生命密碼</div>`;
  resultView.appendChild(footer);

  await new Promise(r => setTimeout(r, 800));

  try {
    const canvas = await html2canvas(resultView, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#F5F0EB',
      scrollX: 0,
      scrollY: 0,
      x: 0,
      y: 0,
      width: resultView.scrollWidth,
      height: resultView.scrollHeight,
      windowWidth: resultView.scrollWidth,
      windowHeight: resultView.scrollHeight
    });

    const link = document.createElement('a');
    const safeName = (name || '靈數').replace(/[^一-龥a-zA-Z0-9]/g, '');

    link.download = `靈數解析_${safeName}_命數${lifeNum}_${dateStr}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();

  } catch (err) {
    console.error('下載失敗:', err);
    alert('下載時發生問題，請稍後再試。\n錯誤：' + err.message);
  } finally {
    document.getElementById('download-header-temp')?.remove();
    document.getElementById('download-footer-temp')?.remove();
    tabPanes.forEach((el, i) => { el.style.display = origDisplays[i]; });

    if (bgDecor) bgDecor.style.display = '';

function shareLink() {
  const { y, m, d, name } = state;
  const b = String(y) + String(m).padStart(2,'0') + String(d).padStart(2,'0');
  const url = new URL(window.location.href);
  url.searchParams.set('b', b);
  if (name) url.searchParams.set('n', name);
  navigator.clipboard.writeText(url.toString()).then(() => {
    const btn = document.getElementById('share-btn');
    const orig = btn.innerHTML;
    btn.innerHTML = btn.innerHTML.replace('分享連結', '已複製！');
    setTimeout(() => { btn.innerHTML = orig; }, 2000);
  });
}

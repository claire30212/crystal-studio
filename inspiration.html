<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>創作靈感筆記 · CélesteDestin</title>
<style>
  :root {
    --bg: #FDF8F2;
    --heading: #5C4A3A;
    --body: #7A6A5A;
    --gold-line: #C9A227;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Serif TC', 'PingFang TC', serif;
    background: var(--bg);
    color: var(--body);
    padding: 48px 20px 100px;
  }
  .container { max-width: 900px; margin: 0 auto; }

  .hero { text-align: center; margin-bottom: 30px; }
  .hero .icon svg { width: 28px; height: 28px; stroke: var(--gold-line); fill: none; stroke-width: 1.3; margin-bottom: 8px; }
  h1 { color: var(--heading); font-size: 22px; margin: 0 0 6px; letter-spacing: 0.05em; }
  .subtitle { font-size: 13px; color: #A0907F; }

  .controls { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .controls input, .controls select {
    padding: 10px 14px; border: 1px solid #E8DDD5; border-radius: 10px;
    font-size: 13px; font-family: inherit; background: #fff; color: var(--body);
  }
  .controls input { flex: 1; min-width: 160px; }

  .grid {
    columns: 1; column-gap: 16px;
  }
  @media (min-width: 640px) { .grid { columns: 2; } }
  @media (min-width: 960px) { .grid { columns: 3; } }

  .note-card {
    break-inside: avoid;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: 0 4px 18px rgba(92,74,58,0.06);
    opacity: 0;
    animation: fadeIn 0.5s ease forwards;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:translateY(0);} }
  .note-card .note-img-wrap { position: relative; }
  .note-card img { width: 100%; display: block; }
  .img-count-badge {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(92,74,58,0.75); color: #fff;
    font-size: 12px; padding: 3px 10px; border-radius: 20px;
  }
  #lightbox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 1000; align-items: center; justify-content: center; flex-direction: column;
  }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 90vw; max-height: 75vh; border-radius: 8px; }
  #lightbox-nav { display: flex; align-items: center; gap: 20px; margin-top: 16px; color: #fff; }
  #lightbox-nav button { background: none; border: 1px solid #fff; color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
  #lightbox-close { position: absolute; top: 20px; right: 24px; color: #fff; font-size: 24px; background: none; border: none; cursor: pointer; }
  .note-body { padding: 16px 18px; }
  .note-title { color: var(--heading); font-size: 15px; font-weight: bold; margin-bottom: 6px; }
  .note-content { font-size: 13px; line-height: 1.7; color: var(--body); margin-bottom: 10px; white-space: pre-wrap; }
  .note-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag-chip {
    font-size: 10.5px; padding: 3px 10px; border-radius: 20px;
    background: #F3ECE4; color: var(--heading);
  }
  .status-chip {
    font-size: 10.5px; padding: 3px 10px; border-radius: 20px;
    display: inline-block;
  }
  .status-待嘗試 { background: #FBF0D9; color: #B8860B; }
  .status-已實現 { background: #EAF1E8; color: #6B8A62; }

  .empty-state { text-align: center; padding: 80px 20px; color: #A0907F; font-size: 14px; }
  .loading, .error { text-align: center; padding: 60px 20px; color: #A0907F; }
  .error { color: #C97B7B; }

  .fab {
    position: fixed; bottom: 28px; right: 28px;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--heading); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; box-shadow: 0 6px 20px rgba(92,74,58,0.3);
    cursor: pointer; border: none; z-index: 100;
  }

  #password-modal, #form-modal {
    display: none; position: fixed; inset: 0; background: rgba(92,74,58,0.4);
    align-items: center; justify-content: center; z-index: 999; padding: 20px;
  }
  #password-modal.show, #form-modal.show { display: flex; }
  .modal-box {
    background: #fff; border-radius: 16px; padding: 28px;
    width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto;
  }
  .modal-box.small { max-width: 320px; text-align: center; }
  .modal-box input[type="password"], .modal-box input[type="text"], .modal-box textarea, .modal-box select {
    width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #E0D5CE;
    border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  .modal-box textarea { min-height: 80px; resize: vertical; }
  .modal-box label { font-size: 12.5px; color: var(--heading); font-weight: bold; }
  .modal-box button.primary {
    width: 100%; padding: 11px; border: none; border-radius: 8px;
    background: var(--heading); color: #fff; cursor: pointer; font-size: 14px; margin-top: 6px;
  }
  .modal-box button.secondary {
    width: 100%; padding: 11px; border: 1px solid #E0D5CE; border-radius: 8px;
    background: #fff; color: var(--body); cursor: pointer; font-size: 13px; margin-top: 8px;
  }
  .tag-options { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 16px; }
  .tag-option {
    padding: 6px 14px; border-radius: 20px; border: 1px solid #E0D5CE;
    font-size: 12.5px; cursor: pointer; user-select: none; color: var(--body);
  }
  .tag-option.selected { background: var(--heading); color: #fff; border-color: var(--heading); }
  .modal-title { font-size: 16px; color: var(--heading); margin-bottom: 4px; text-align: center; }
  .modal-close { position: absolute; top: 18px; right: 18px; cursor: pointer; font-size: 18px; color: #A0907F; background:none; border:none; }
  .modal-box { position: relative; }
  .compress-note { font-size: 11px; color: #A0907F; margin-top: -10px; margin-bottom: 14px; }
  #main-content { display: none; }
</style>
</head>
<body>

<div id="password-modal">
  <div class="modal-box small">
    <div style="font-size:15px; color:#5C4A3A;">請輸入密碼</div>
    <input type="password" id="password-input" placeholder="密碼">
    <button class="primary" onclick="checkPassword()">確認</button>
    <div id="password-error" style="display:none; color:#C97B7B; font-size:12px; margin-top:8px;">密碼錯誤，請再試一次</div>
  </div>
</div>

<div id="main-content">
  <div class="container">
    <div class="hero">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-11 11H6v-4z"/></svg></div>
      <h1>創作靈感筆記</h1>
      <div class="subtitle">隨手記下的想法、配色、款式構想與參考</div>
    </div>

    <div class="controls">
      <input type="text" id="search-input" placeholder="搜尋靈感...">
      <select id="tag-filter">
        <option value="all">全部標籤</option>
        <option value="配色">配色</option>
        <option value="款式構想">款式構想</option>
        <option value="賣家參考">賣家參考</option>
        <option value="客戶喜好">客戶喜好</option>
        <option value="其他">其他</option>
      </select>
    </div>

    <div id="note-list"><div class="loading">資料讀取中...</div></div>
  </div>
</div>

<button class="fab" onclick="openForm()">+</button>

<div id="form-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeForm()">✕</button>
    <div class="modal-title">✨ 新增靈感</div>
    <label>標題</label>
    <input type="text" id="f-title" placeholder="簡短標題">
    <label>內容</label>
    <textarea id="f-content" placeholder="想法、描述..."></textarea>
    <label>標籤（可複選）</label>
    <div class="tag-options" id="tag-options">
      <div class="tag-option" data-tag="配色">配色</div>
      <div class="tag-option" data-tag="款式構想">款式構想</div>
      <div class="tag-option" data-tag="賣家參考">賣家參考</div>
      <div class="tag-option" data-tag="客戶喜好">客戶喜好</div>
      <div class="tag-option" data-tag="其他">其他</div>
    </div>
    <label>狀態</label>
    <select id="f-status">
      <option value="待嘗試">待嘗試</option>
      <option value="已實現">已實現</option>
    </select>
    <div id="f-image-group">
      <label style="display:block; margin-bottom:8px;">圖片（選填，可一次選多張）</label>
      <div id="existing-images" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;"></div>
      <input type="file" id="f-image" accept="image/*" multiple style="display:block; width:100%; padding:8px 0;">
      <div class="compress-note" style="margin-top:8px; margin-bottom:16px;">圖片會自動壓縮後上傳，不用自己處理；多張圖片共用同一段文字說明</div>
    </div>
    <button class="primary" id="submit-btn" onclick="submitNote()">儲存靈感</button>
    <button class="secondary" onclick="closeForm()">取消</button>
  </div>
</div>

<script>
  const CORRECT_PASSWORD = "20151210";
  let selectedTags = [];

  function checkPassword() {
    const input = document.getElementById('password-input').value;
    if (input === CORRECT_PASSWORD) {
      unlock();
      sessionStorage.setItem('cd_inspiration_unlocked', '1');
    } else {
      document.getElementById('password-error').style.display = 'block';
    }
  }

  function unlock() {
    document.getElementById('password-modal').classList.remove('show');
    document.getElementById('password-modal').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    loadNotes();
  }

  if (sessionStorage.getItem('cd_inspiration_unlocked') === '1') {
    unlock();
  } else {
    document.getElementById('password-modal').classList.add('show');
  }
  document.getElementById('password-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPassword();
  });

  document.querySelectorAll('.tag-option').forEach(el => {
    el.addEventListener('click', () => {
      const tag = el.dataset.tag;
      if (selectedTags.includes(tag)) {
        selectedTags = selectedTags.filter(t => t !== tag);
        el.classList.remove('selected');
      } else {
        selectedTags.push(tag);
        el.classList.add('selected');
      }
    });
  });

  function openForm() {
    document.getElementById('form-modal').classList.add('show');
  }
  function closeForm() {
    document.getElementById('form-modal').classList.remove('show');
    document.getElementById('f-title').value = '';
    document.getElementById('f-content').value = '';
    document.getElementById('f-image').value = '';
    document.getElementById('f-status').value = '待嘗試';
    selectedTags = [];
    editingId = null;
    keptImages = [];
    document.getElementById('existing-images').innerHTML = '';
    document.querySelectorAll('.tag-option').forEach(el => el.classList.remove('selected'));
    document.querySelector('.modal-title').textContent = '✨ 新增靈感';
    document.getElementById('submit-btn').textContent = '儲存靈感';
    document.getElementById('f-image-group').style.display = '';
  }

  // 圖片自動壓縮：最長邊限制 1600px，JPEG 品質 0.8
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = e => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        const maxDim = 1600;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.8);
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function submitNote() {
    const title = document.getElementById('f-title').value.trim();
    const content = document.getElementById('f-content').value.trim();
    const status = document.getElementById('f-status').value;
    const imageFiles = Array.from(document.getElementById('f-image').files);
    const btn = document.getElementById('submit-btn');

    if (!title) { alert('請輸入標題'); return; }

    btn.textContent = '儲存中...';
    btn.disabled = true;

    try {
      if (editingId) {
        const newImages = [];
        for (const imageFile of imageFiles) {
          const compressedBlob = await compressImage(imageFile);
          const filename = imageFile.name.replace(/\.[^.]+$/, '') + '.jpg';
          const form = new FormData();
          form.append('file', compressedBlob, filename);
          form.append('filename', filename);
          const upRes = await fetch('/api/notion/inspiration/upload-image', { method: 'POST', body: form });
          const upData = await upRes.json();
          if (upData.error) throw new Error(upData.error);
          newImages.push({ fileUploadId: upData.fileUploadId, filename });
        }

        const finalImages = [
          ...keptImages.map(img => ({ fileUploadId: img.fileUploadId, filename: img.filename })),
          ...newImages,
        ];

        const res = await fetch(`/api/notion/inspiration/${editingId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content, tags: selectedTags, status, images: finalImages }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
      } else {
        const images = [];
        for (const imageFile of imageFiles) {
          const compressedBlob = await compressImage(imageFile);
          const filename = imageFile.name.replace(/\.[^.]+$/, '') + '.jpg';
          const form = new FormData();
          form.append('file', compressedBlob, filename);
          form.append('filename', filename);
          const upRes = await fetch('/api/notion/inspiration/upload-image', { method: 'POST', body: form });
          const upData = await upRes.json();
          if (upData.error) throw new Error(upData.error);
          images.push({ fileUploadId: upData.fileUploadId, filename });
        }

        const body = { title, content, tags: selectedTags, status };
        if (images.length) body.images = images;

        const res = await fetch('/api/notion/inspiration', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
      }

      closeForm();
      loadNotes();
    } catch (err) {
      alert('儲存失敗：' + err.message);
    } finally {
      btn.textContent = '儲存靈感';
      btn.disabled = false;
    }
  }

  function getTitle(prop) { return prop?.title?.[0]?.plain_text || ''; }
  function getRichText(prop) { return (prop?.rich_text || []).map(t => t.plain_text).join(''); }
  function getMultiSelect(prop) { return (prop?.multi_select || []).map(s => s.name); }
  function getSelect(prop) { return prop?.select?.name || ''; }
  function getFileUrls(prop) {
    return (prop?.files || []).map(f => f.file?.url || f.external?.url).filter(Boolean);
  }

  let editingId = null;
  let keptImages = [];

  function openEditForm(noteId) {
    const note = (window.__notes || []).find(n => n.id === noteId);
    if (!note) return;
    editingId = noteId;

    const p = note.properties;
    document.getElementById('f-title').value = getTitle(p['標題']);
    document.getElementById('f-content').value = getRichText(p['內容']);
    document.getElementById('f-status').value = getSelect(p['狀態']) || '待嘗試';

    selectedTags = getMultiSelect(p['標籤']);
    document.querySelectorAll('.tag-option').forEach(el => {
      el.classList.toggle('selected', selectedTags.includes(el.dataset.tag));
    });

    let storedImages = [];
    try {
      storedImages = JSON.parse(getRichText(p['圖片識別碼']) || '[]');
    } catch (e) { storedImages = []; }

    const currentUrls = getFileUrls(p['圖片']);
    keptImages = storedImages.map((img, i) => ({ ...img, previewUrl: currentUrls[i] || '' }));
    renderExistingImages();

    document.querySelector('.modal-title').textContent = '✏️ 編輯靈感';
    document.getElementById('submit-btn').textContent = '儲存修改';
    document.getElementById('f-image-group').style.display = '';
    openForm();
  }

  function renderExistingImages() {
    const container = document.getElementById('existing-images');
    container.innerHTML = keptImages.map((img, idx) => `
      <div style="position:relative; width:64px; height:64px;">
        <img src="${img.previewUrl}" style="width:100%; height:100%; object-fit:cover; border-radius:8px;">
        <button onclick="removeKeptImage(${idx})" style="position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:#C97B7B; color:#fff; border:none; font-size:12px; cursor:pointer; line-height:1;">✕</button>
      </div>
    `).join('');
  }

  function removeKeptImage(idx) {
    keptImages.splice(idx, 1);
    renderExistingImages();
  }

  async function deleteNote(noteId) {
    if (!confirm('確定要刪除這則靈感嗎？（會移到 Notion 垃圾桶，不是永久消失）')) return;
    try {
      const res = await fetch(`/api/notion/inspiration/${noteId}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      loadNotes();
    } catch (err) {
      alert('刪除失敗：' + err.message);
    }
  }

  async function loadNotes() {
    const container = document.getElementById('note-list');
    container.innerHTML = '<div class="loading">資料讀取中...</div>';
    try {
      const res = await fetch('/api/notion/inspiration');
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      window.__notes = data.results || [];
      renderNotes();
    } catch (err) {
      container.innerHTML = `<div class="error">資料讀取失敗：${err.message}</div>`;
    }
  }

  function renderNotes() {
    const container = document.getElementById('note-list');
    const keyword = document.getElementById('search-input').value.trim().toLowerCase();
    const tagFilter = document.getElementById('tag-filter').value;

    let list = window.__notes || [];

    list = list.map(n => {
      const p = n.properties;
      return {
        id: n.id,
        title: getTitle(p['標題']),
        content: getRichText(p['內容']),
        tags: getMultiSelect(p['標籤']),
        status: getSelect(p['狀態']),
        imageUrls: getFileUrls(p['圖片']),
        created: n.created_time,
      };
    });

    if (keyword) {
      list = list.filter(n => n.title.toLowerCase().includes(keyword) || n.content.toLowerCase().includes(keyword));
    }
    if (tagFilter !== 'all') {
      list = list.filter(n => n.tags.includes(tagFilter));
    }

    list.sort((a, b) => (b.created || '').localeCompare(a.created || ''));

    if (list.length === 0) {
      container.innerHTML = '<div class="empty-state">還沒有任何靈感，點右下角 + 開始記錄吧 ✨</div>';
      return;
    }

    container.innerHTML = `<div class="grid">${list.map((n, idx) => `
      <div class="note-card" style="animation-delay:${Math.min(idx * 0.03, 0.4)}s;">
        ${n.imageUrls.length > 0 ? `
          <div class="note-img-wrap" onclick="openLightbox(${JSON.stringify(n.imageUrls).replace(/"/g, '&quot;')})" style="cursor:pointer;">
            <img src="${n.imageUrls[0]}" alt="">
            ${n.imageUrls.length > 1 ? `<span class="img-count-badge">+${n.imageUrls.length - 1}</span>` : ''}
          </div>
        ` : ''}
        <div class="note-body">
          <div class="note-title">${n.title}</div>
          ${n.content ? `<div class="note-content">${n.content}</div>` : ''}
          <div class="note-tags">
            ${n.tags.map(t => `<span class="tag-chip">${t}</span>`).join('')}
            ${n.status ? `<span class="status-chip status-${n.status}">${n.status}</span>` : ''}
          </div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button onclick="openEditForm('${n.id}')" style="flex:1; padding:6px; font-size:12px; border:1px solid #E0D5CE; border-radius:8px; background:#fff; color:#7A6A5A; cursor:pointer;">編輯</button>
            <button onclick="deleteNote('${n.id}')" style="flex:1; padding:6px; font-size:12px; border:1px solid #E0D5CE; border-radius:8px; background:#fff; color:#C97B7B; cursor:pointer;">刪除</button>
          </div>
        </div>
      </div>
    `).join('')}</div>`;
  }

  document.getElementById('search-input').addEventListener('input', renderNotes);
  document.getElementById('tag-filter').addEventListener('change', renderNotes);

  let lightboxImages = [];
  let lightboxIndex = 0;

  function openLightbox(urls) {
    lightboxImages = urls;
    lightboxIndex = 0;
    updateLightbox();
    document.getElementById('lightbox').classList.add('show');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('show');
  }
  function lightboxPrev() {
    lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
    updateLightbox();
  }
  function lightboxNext() {
    lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
    updateLightbox();
  }
  function updateLightbox() {
    document.getElementById('lightbox-img').src = lightboxImages[lightboxIndex];
    document.getElementById('lightbox-counter').textContent = `${lightboxIndex + 1} / ${lightboxImages.length}`;
    document.getElementById('lightbox-nav').style.display = lightboxImages.length > 1 ? 'flex' : 'none';
  }
</script>

<div id="lightbox">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="">
  <div id="lightbox-nav">
    <button onclick="lightboxPrev()">‹ 上一張</button>
    <span id="lightbox-counter"></span>
    <button onclick="lightboxNext()">下一張 ›</button>
  </div>
</div>

</body>
</html>

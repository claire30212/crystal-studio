<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CélesteDestin · 五行能量解析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="vendor/html2canvas.min.js"></script>
<style>
:root {
  --bg: #F5F0EB;
  --card: #FFFFFF;
  --border: #D4C5B5;
  --text: #5C4A3A;
  --text-light: #9A8A7A;
  --brand: #B8965A;
  --wood: #8BA888;
  --fire: #C47A6A;
  --earth: #C4A55A;
  --metal: #D4C5A0;
  --water: #7A9AAA;
  --radius: 12px;

  /* 品牌核心色（新別名，供近期新增區塊使用） */
  --color-bg: #F5F0EB;
  --color-card: #FFFFFF;
  --color-border: #D4C5B5;
  --color-border-light: #E8DDD5;
  --color-text-primary: #3C2E22;
  --color-text-secondary: #6A5A4A;
  --color-text-muted: #A8988A;
  --color-accent: #C4A55A;

  /* 五行色系 */
  --color-wood: #7A9A78;
  --color-fire: #C47A6A;
  --color-earth: #C4A55A;
  --color-metal: #B8A888;
  --color-water: #7A9AAA;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light; }
body {
  background:
    radial-gradient(ellipse 480px 360px at 8% 12%, rgba(139,168,136,0.20) 0%, transparent 70%),
    radial-gradient(ellipse 420px 340px at 92% 18%, rgba(196,122,106,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 460px 380px at 85% 85%, rgba(196,165,90,0.16) 0%, transparent 70%),
    radial-gradient(ellipse 400px 320px at 12% 88%, rgba(122,154,170,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 500px 400px at 50% 45%, rgba(212,197,160,0.14) 0%, transparent 65%),
    #F5F0EB;
  color: var(--color-text-primary);
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 300;
  min-height: 100vh;
}
h1, h2, h3, .serif { font-family: 'Noto Serif TC', serif; }

#input-view { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 56px 24px; }
#result-view { display: none; padding: 32px 24px 40px; max-width: 940px; margin: 0 auto; }
#result-view > *:last-child { margin-bottom: 0 !important; }
#result-view-header { text-align: center; margin-bottom: 28px; padding: 28px 20px 24px; border-radius: 16px; }
#result-view-brand { font-size: 11px; color: var(--color-text-muted); letter-spacing: 0.2em; margin-bottom: 12px; }
#result-view-name { font-family: 'Noto Serif TC', serif; font-size: 28px; font-weight: 400; color: var(--color-text-primary); letter-spacing: 0.06em; margin-bottom: 8px; }
#result-view-meta { font-size: 13px; color: var(--color-text-muted); letter-spacing: 0.06em; }

.brand { text-align: center; margin-bottom: 28px; }
.brand-title { font-family: 'Noto Serif TC', serif; font-size: 1.55rem; font-weight: 300; color: var(--text); letter-spacing: 0.08em; margin-bottom: 10px; }
.brand-deco { width: 44px; height: 0.5px; background: var(--brand); margin: 0 auto 12px; }
.brand-sub { font-size: 0.8rem; color: var(--text-light); letter-spacing: 0.14em; }

.wx-dots { display:flex; justify-content:center; gap:8px; margin: 16px 0 4px; }
.wx-dot { width:7px; height:7px; border-radius:50%; opacity:0.85; }

.input-card {
  background: var(--card);
  border: 0.5px solid rgba(184,150,90,0.35);
  border-radius: var(--radius);
  padding: 36px 36px 32px;
  max-width: 520px;
  margin: 20px auto 0;
  box-shadow: 0 4px 24px rgba(92,74,58,0.06), 0 1px 4px rgba(92,74,58,0.04);
  position: relative;
  overflow: hidden;
}
.input-card::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(184,150,90,0.5),transparent); }
.form-group { margin-bottom: 22px; }
.form-label { display:block; font-size:0.75rem; color: var(--text-light); letter-spacing:0.1em; margin-bottom:8px; }
.form-input {
  width:100%; background: var(--bg); border:0.5px solid var(--border); border-radius:8px;
  padding:12px 14px; font-family:'Noto Sans TC',sans-serif; font-size:0.9rem; font-weight:300;
  color: var(--text); outline:none; transition:border-color 0.2s;
}
.form-input:focus { border-color: var(--brand); }
.date-row { display:flex; gap:8px; }
.date-row .form-input { flex:1; }
.date-row input[type=number] { flex: 1.3; }

.hour-toggle {
  display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  padding: 10px 2px; border-top: 0.5px solid var(--border); margin-top: 4px;
}
.hour-toggle-label { font-size:0.78rem; color: var(--text-light); letter-spacing:0.08em; }
.hour-toggle-icon { transition: transform 0.25s; color: var(--brand); }
.hour-toggle-icon.open { transform: rotate(45deg); }
.hour-panel { max-height:0; overflow:hidden; transition: max-height 0.3s ease; }
.hour-panel.open { max-height: 300px; }
.hour-panel-inner { padding-top: 14px; }
.accuracy-note {
  font-size: 12px; line-height:1.8; color:#8A6E32; background: rgba(196,165,90,0.12);
  border: 0.5px solid rgba(196,165,90,0.35); border-radius:8px; padding:12px 14px; margin-top:10px;
}

.btn-analyze {
  width:100%; background: var(--brand); color:#fff; border:none; border-radius:8px; padding:14px;
  font-family:'Noto Sans TC',sans-serif; font-size:0.9rem; font-weight:400; letter-spacing:0.12em;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
  transition: opacity 0.2s; margin-top: 20px;
}
.btn-analyze:hover { opacity:0.86; }
.spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; display:none; }
@keyframes spin { to { transform: rotate(360deg); } }

.fade-out { animation: fadeOut 0.4s ease forwards; }
.fade-in { animation: fadeIn 0.6s ease forwards; }
@keyframes fadeOut { to { opacity:0; transform: translateY(-10px); } }
@keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

.section-title {
  font-size: 13px;
  color: #9A8A7A;
  letter-spacing: 0.12em;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 14px;
  background: #C4A55A;
  border-radius: 2px;
  flex-shrink: 0;
}

/* Tabs */
.tab-nav { display:flex; justify-content:center; gap:22px; border-bottom:1px solid var(--color-border); margin-bottom:24px; flex-wrap:wrap; }
.tab-btn { background:none; border:none; padding:12px 0; font-family:'Noto Sans TC',sans-serif; font-size:13.5px; font-weight:300; color:#9A8A7A; letter-spacing:0.05em; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-0.5px; white-space:nowrap; transition: all 0.2s; }
.tab-btn.active { color: #C4A55A; border-bottom-color: #C4A55A; font-weight:500; }
.tab-pane { display:none; }
.tab-pane.active { display:block; }

/* 卡片懸停效果（供未來套用的通用卡片樣式） */
.wuxing-card {
  border: 0.5px solid var(--color-border);
  border-radius: 16px;
  background: white;
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}
.wuxing-card:hover {
  box-shadow: 0 4px 20px rgba(180,150,120,0.12);
  transform: translateY(-1px);
}

/* 五行計分卡片左側色條加深 */
.element-score-card {
  border-left-width: 4px !important;
  transition: box-shadow 0.2s ease;
}
.element-score-card:hover {
  box-shadow: 0 3px 16px rgba(0,0,0,0.07);
}

/* 結果頁標題日主徽章 */
.daymaster-header-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  border-radius: 20px;
  padding: 5px 16px;
  font-size: 12px;
  letter-spacing: 0.06em;
}

/* Bazi table */
.bazi-table { display:grid; grid-template-columns: repeat(4,1fr); gap:10px; margin-bottom: 18px; }
.bazi-col { background: var(--card); border:0.5px solid var(--border); border-radius: var(--radius); padding:14px 6px 16px; text-align:center; }
.bazi-col.empty { background: #EFEAE4; }
.bazi-col-label { font-size:11px; color:#B0A89A; letter-spacing:0.1em; margin-bottom:10px; }
.bazi-char { font-family:'Noto Serif TC',serif; font-size:30px; line-height:1.2; color: var(--text); margin-bottom:2px; }
.bazi-wx { font-size:10px; letter-spacing:0.05em; padding:1px 8px; border-radius:10px; display:inline-block; margin-bottom:6px; }
.bazi-col hr { border:none; border-top:0.5px dashed var(--border); margin:8px 0; }
.bazi-col-empty-mark { font-family:'Noto Serif TC',serif; font-size:30px; color:#C8BEB2; }
.bazi-col-hint { font-size:10px; color:#B0A89A; margin-top:6px; }

.score-row { display:grid; grid-template-columns: repeat(5,1fr); gap:8px; margin-bottom: 8px; }
.score-tile { border-radius:10px; padding:12px 6px; text-align:center; color:#fff; position:relative; }
.score-tile-name { font-size:12px; letter-spacing:0.1em; opacity:0.92; }
.score-tile-val { font-family:'Noto Serif TC',serif; font-size:22px; margin:4px 0 2px; }
.score-tile-tag { font-size:10px; letter-spacing:0.06em; background:rgba(255,255,255,0.28); border-radius:8px; padding:1px 8px; display:inline-block; }

.tab-banner { background: linear-gradient(135deg,#FAF7F2 0%, #F0E8D8 100%); border-radius:12px; padding:12px 16px; margin-bottom:18px; font-size:11.5px; color:#8A6E32; letter-spacing:0.04em; border:0.5px solid rgba(196,165,90,0.3); line-height:1.7; }

/* Radar */
.radar-wrap { display:flex; flex-direction:column; align-items:center; background: linear-gradient(160deg,#FDFBF9,#F8F4EE); border:0.5px solid var(--border); border-radius:20px; padding: 26px 16px 20px; margin-bottom: 20px; }
.radar-badge { font-size:11px; letter-spacing:0.08em; padding:3px 12px; border-radius:20px; margin-bottom:12px; }
.radar-badge.full { background:rgba(139,168,136,0.18); color:#5C7A58; }
.radar-badge.partial { background:rgba(196,165,90,0.2); color:#8A6E32; }
#radar-svg polygon.data-poly { transition: transform 1.4s cubic-bezier(.2,.8,.2,1); transform: scale(0); transform-origin: 150px 150px; }
#radar-svg polygon.data-poly.grown { transform: scale(1); }
.radar-legend { display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:6px; justify-content:center; }
.radar-legend-item { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-light); }
.radar-legend-dot { width:9px; height:9px; border-radius:2px; }

/* Bars */
.bar-row { display:flex; align-items:center; gap:12px; margin-bottom: 12px; }
.bar-label { width: 60px; font-size:13px; color: var(--text); flex-shrink:0; letter-spacing:0.05em; }
.bar-track { flex:1; background:#EFE9E1; border-radius:20px; height:20px; overflow:hidden; position:relative; }
.bar-fill { height:100%; width:0%; border-radius:20px; transition: width 1.2s cubic-bezier(.2,.8,.2,1); display:flex; align-items:center; justify-content:flex-end; padding-right:8px; }
.bar-fill-val { font-size:10.5px; color:#fff; }
.bar-tag { min-width: 34px; font-size:11px; color: var(--text-light); text-align:center; flex-shrink:0; white-space:nowrap; }

.shengke-box { background: var(--card); border:0.5px solid var(--border); border-radius:12px; padding:18px 20px; font-size:13.5px; line-height:1.95; color:var(--text); }

/* Analysis */
.analysis-section { margin-bottom: 24px; }
.analysis-section-title { font-size:11px; color:#9A8A7A; letter-spacing:0.14em; margin-bottom:10px; padding-bottom:6px; padding-left:11px; border-bottom:0.5px solid var(--border); position:relative; }
.analysis-section-title::before { content:''; position:absolute; left:0; top:2px; width:3px; height:14px; background: var(--brand); border-radius:2px; }
.analysis-text { font-size:14px; line-height:1.9; color: var(--text); font-weight:300; }
.daymaster-badge { display:inline-flex; align-items:center; gap:8px; margin-bottom:18px; }
.daymaster-char { font-family:'Noto Serif TC',serif; font-size:2.6rem; color: var(--text); line-height:1; }
.daymaster-tag { font-size:11px; padding:3px 12px; border-radius:20px; color:#fff; letter-spacing:0.06em; }
.tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px; }
.tag { border:1px solid; border-radius:20px; padding:6px 14px; font-size:12.5px; letter-spacing:0.03em; }
.life-grid { display:grid; grid-template-columns: repeat(2,1fr); gap:10px; }
.life-card { background: var(--card); border:0.5px solid var(--border); border-radius:10px; padding:14px 16px; }
.life-card-title { font-size:11px; color:#B0A89A; letter-spacing:0.08em; margin-bottom:8px; }
.life-card-text { font-size:12.5px; color:var(--text); line-height:1.75; }
.zodiac-tag { display:inline-block; font-size:12px; background:rgba(184,150,90,0.15); border:0.5px solid rgba(184,150,90,0.4); color:#8A6E32; padding:4px 14px; border-radius:20px; margin-top:6px; }
.numres-box { border-left:3px solid var(--brand); padding-left:14px; font-size:13px; color:var(--text-light); line-height:1.8; }

/* Crystal cards */
.crystal-grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-bottom: 24px; }
.crystal-card { background: var(--card); border:0.5px solid var(--border); border-radius: var(--radius); padding:16px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; transition:all 0.3s ease; }
.crystal-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(92,74,58,0.12); border-color: var(--brand); }
.crystal-name { font-size:14px; color: var(--text); font-weight:400; }
.crystal-wx-tags { display:flex; gap:4px; }
.crystal-wx-tag { font-size:9.5px; padding:1px 8px; border-radius:10px; color:#fff; }
.crystal-reason { font-size:11.5px; color:var(--text-light); line-height:1.6; }
.crystal-ratings { display:grid; grid-template-columns: repeat(2,1fr); gap:3px 10px; width:100%; margin-top:4px; }
.crystal-rating-row { display:flex; align-items:center; justify-content:space-between; font-size:10px; color:#B0A89A; }
.crystal-stars { color: var(--brand); letter-spacing:1px; }

.wheel-wrap { display:flex; flex-wrap:wrap; gap: 24px; align-items:center; justify-content:center; background: linear-gradient(160deg,#FDFBF9,#F8F4EE); border:0.5px solid var(--border); border-radius:20px; padding:26px; margin-bottom: 24px; }
.wheel-sector { cursor:pointer; transition: opacity 0.2s; }
.wheel-sector:hover { opacity:0.8; }
.wheel-result { flex:1; min-width:200px; }
.wheel-result-title { font-size:11px; color:#B0A89A; letter-spacing:0.1em; margin-bottom:10px; }
.wheel-result-card { background: var(--card); border:0.5px solid var(--border); border-radius:10px; padding:14px 16px; }

.fav-god-box { background: linear-gradient(135deg,#F5EFE0,#EDE4CE); border:0.5px solid rgba(184,150,90,0.4); border-radius:14px; padding:20px; margin-bottom: 24px; }
.fav-god-title { font-family:'Noto Serif TC',serif; font-size:15px; color:#8A6E32; margin-bottom:10px; }

/* Bracelet */
.bracelet-flex { display:flex; flex-wrap:wrap; gap:28px; align-items:center; justify-content:center; margin-bottom:20px; }
.bead-legend { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; justify-content:center; }
.legend-item { display:flex; align-items:center; gap:6px; font-size:11.5px; color: var(--text-light); }
.legend-dot { width:11px; height:11px; border-radius:50%; }
.scheme-switch-row { display:flex; justify-content:center; margin: 6px 0 18px; }
.btn-scheme { background:#fff; border:0.5px solid var(--border); border-radius:20px; padding:9px 22px; font-size:12.5px; color:var(--text); cursor:pointer; letter-spacing:0.06em; transition:all 0.2s; }
.btn-scheme:hover { border-color: var(--brand); color: var(--brand); }
.stone-row { display:flex; gap:16px; flex-wrap:wrap; margin-bottom: 18px; }
.stone-card { flex:1; min-width:150px; background:var(--card); border:0.5px solid var(--border); border-radius:10px; padding:14px 16px; }
.stone-card-role { font-size:10px; letter-spacing:0.1em; color:#B0A89A; margin-bottom:4px; }
.stone-card-name { font-size:14px; color:var(--text); margin-bottom:4px; }
.stone-card-desc { font-size:11.5px; color:var(--text-light); line-height:1.6; }
ul.wear-guide, .purify-list { list-style:none; padding:0; margin:0; }
ul.wear-guide li, .purify-list li { display:flex; align-items:flex-start; gap:10px; font-size:13px; color:#7A6A5A; line-height:1.7; margin-bottom:10px; }
ul.wear-guide li::before, .purify-list li::before { content:'✦'; color: var(--brand); font-size:10px; flex-shrink:0; margin-top:3px; }

/* Energy list tab */
.energylist-grid { display:grid; grid-template-columns: repeat(2,1fr); gap:14px; }
.energylist-card { background: var(--card); border-radius:12px; padding:18px 20px; border-left:4px solid; }
.energylist-title { font-size:13px; font-weight:500; color: var(--text); margin-bottom:8px; letter-spacing:0.04em; }
.energylist-text { font-size:12.5px; color: var(--text-light); line-height:1.8; }
.color-chip-row { display:flex; gap:6px; margin-top:8px; }
.color-chip { width:20px; height:20px; border-radius:50%; border:1px solid rgba(0,0,0,0.08); }

.action-row { display:flex; gap:12px; justify-content:center; margin-top:32px; flex-wrap:wrap; }
.btn-action { background:var(--card); border:0.5px solid var(--border); border-radius:8px; padding:12px 22px; font-family:'Noto Sans TC',sans-serif; font-size:0.8rem; font-weight:300; color:var(--text); letter-spacing:0.06em; cursor:pointer; display:flex; align-items:center; gap:8px; transition:all 0.2s; }
.btn-action:hover { border-color: var(--brand); color: var(--brand); }
.btn-action.primary { background: var(--brand); color:#fff; border-color: var(--brand); }
.btn-action.primary:hover { opacity:0.86; }

.btn-restart { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:48px; padding:0 44px; background:#fff; border:0.5px solid var(--brand); border-radius:24px; color:var(--text); font-size:14px; font-family:'Noto Sans TC',sans-serif; letter-spacing:0.04em; cursor:pointer; }
#reset-btn-wrapper { display:flex; justify-content:center; width:100%; margin:36px 0 20px; }

@keyframes crystalGlow { 0%,100% { opacity:0.35; } 50% { opacity:0.85; } }

.pdf-title-block { display:none; }

/* ============================================================
   列印／另存 PDF 專用樣式：
   直接用瀏覽器原生 window.print()，不需要任何 JS 等待版面穩定，
   從根本避免 html2canvas 的時間差問題（曾經在真實環境反覆撞到
   createPattern 相關的崩潰錯誤，優先順序上「下載完成後能穩定開啟」
   高於「檔名一定要自動帶對」，所以改回這條路徑，不再用 html2canvas+jsPDF）。
   ============================================================ */
@media print {
  /* 強制列印背景色與背景圖，不要被瀏覽器預設的省墨模式關閉／變淡。
     這對「純色（不透明或半透明）背景」是必要且安全的：幸運顏色圓圈、水晶卡片
     色圈、五行標籤底色等都是靠 background-color 顯示，沒有這行時瀏覽器的
     「經濟省墨」模式可能整個不印（空白）或大幅變淡。
     注意：這行本身不會導致下面修過的「低透明度 rgba 漸層 → 印成螢光粉紅色」
     問題重演——那個 Chromium 缺陷只有 linear-gradient/radial-gradient 疊加低
     alpha 色階時才會觸發，純色（不論透明度）不受影響，已用獨立測試驗證過。
     全站僅存的兩處低透明度漸層已在下面另外處理成純色，見 #bazi-summary /
     [data-element-card]。 */
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }

  /* 隱藏導覽、分頁切換、所有互動用按鈕（下載/換設計/回首頁/分享） */
  #bg-decor,
  #input-view,
  #result-view-header,
  .tab-nav,
  .action-row,
  .print-hint,
  #reset-btn-wrapper,
  .btn-scheme {
    display: none !important;
  }

  body { background: #fff; }
  #result-view { display: block !important; max-width: 100%; padding: 0; margin: 0; }
  #result-section { padding: 0; }

  /* 強制展開全部分頁內容，依序垂直排列，而不是像畫面上那樣只顯示 active 分頁 */
  .tab-pane {

  .pdf-title-block { display: block; padding: 0 0 18px; margin-bottom: 24px; border-bottom: 0.5px solid var(--border); }

  /* Chromium 在「列印／另存為 PDF」時，對「低透明度 rgba 色階組成的 linear-gradient」
     有已知渲染缺陷：不會畫出漸層，而是整塊塗成鮮豔的螢光粉紅色（#FF69B4）。
     用最小案例單獨測試過（純色 rgba 不受影響，只有漸層會壞），全站只有這兩處
     用到「低透明度漸層背景」，改成同樣色階的純色 rgba 背景即可繞過，
     視覺上仍維持原本淡雅的卡片底色。 */
  #bazi-summary > div { background: rgba(212,181,168,0.12) !important; }
  [data-element-card="木"] { background: rgba(139,168,136,0.08) !important; }

  /* 避免卡片內容被硬生生從中間切到下一頁。

     這幾個 grid/flex 容器的「直接子層」套用同一規則——裡面有些卡片
     （例如水晶推薦卡）其實沒有掛專屬 class、只靠 inline style 畫出卡片外觀，
     只認 class 名單會漏掉這些節點，改用「容器的直接子元素」定位才不會漏。 */
  .bazi-col, .score-tile, .element-score-card, .shengke-box, .tab-banner,
  .radar-wrap, .wheel-wrap, .wheel-result-card, .fav-god-box,
  .life-card, .daymaster-badge, .analysis-section,

  .crystal-grid > *, .stone-row > *, .bracelet-flex > *, .energylist-grid > * {
    break-inside: avoid;
    page-break-inside: avoid;
  }
}

<script>
// ============================================================
// 一、節氣精確資料庫（1950-2050，精確到分鐘）
// 採用天文近似演算法（寿星萬年曆定氣法之通行 JS 移植版本），
// 而非固定日期簡化：對任意西元年份 y 與 24 節氣序號 n(0=小寒...23=冬至)，
// 計算太陽到達對應黃經角度的 UTC 時刻，精度約在 1-2 分鐘內（1900-2100 年間）。
// ============================================================
const S_TERM_INFO = [0,21208,42467,63836,85337,107014,128867,150921,173149,195551,218072,240693,
  263343,285989,308563,331033,353350,375494,397447,419210,440795,462224,483532,504758];
const S_TERM_NAMES = ['小寒','大寒','立春','雨水','驚蟄','春分','清明','穀雨','立夏','小滿','芒種','夏至',
  '小暑','大暑','立秋','處暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];

function getTermUTC(year, n) {
  // 基準：1900-01-06 02:05 UTC 為 1900 年小寒(n=0)
  const base = Date.UTC(1900, 0, 6, 2, 5, 0);
  return base + 31556925974.7 * (year - 1900) + S_TERM_INFO[n] * 60000;
}

const JIE_INDEX = { '立春':2, '驚蟄':4, '清明':6, '立夏':8, '芒種':10, '小暑':12,
  '立秋':14, '白露':16, '寒露':18, '立冬':20, '大雪':22, '小寒':0 };
const JIE_ORDER = ['立春','驚蟄','清明','立夏','芒種','小暑','立秋','白露','寒露','立冬','大雪','小寒'];

function getLichunUTC(year) { return getTermUTC(year, JIE_INDEX['立春']); }

function getAllJieEvents(centerYear) {
  const events = [];
  for (let y = centerYear - 1; y <= centerYear + 1; y++) {
    for (const name of JIE_ORDER) {
      events.push({ name, ts: getTermUTC(y, JIE_INDEX[name]), year: y });
    }
  }
  events.sort((a, b) => a.ts - b.ts);
  return events;
}

function getCurrentJie(birthTs, calYear) {
  const events = getAllJieEvents(calYear);
  let current = events[0];
  for (const e of events) { if (e.ts <= birthTs) current = e; else break; }
  return current;
}

// ============================================================
// 對照表
// ============================================================
const TG = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const DZ = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

const tianganWuxing = { '甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水' };
const dizhiWuxing = { '子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火','午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水' };
const ZODIAC = { '子':'鼠','丑':'牛','寅':'虎','卯':'兔','辰':'龍','巳':'蛇','午':'馬','未':'羊','申':'猴','酉':'雞','戌':'狗','亥':'豬' };

const WX_COLOR = { '木':'#8BA888', '火':'#C47A6A', '土':'#C4A55A', '金':'#D4C5A0', '水':'#7A9AAA' };
const WX_COLOR_DARK = { '木':'#5C7A58', '火':'#8A4A3E', '土':'#8A6E32', '金':'#8A7A50', '水':'#4A6878' };
const WX_LIST = ['木','火','土','金','水'];

const GENERATES = { '木':'火','火':'土','土':'金','金':'水','水':'木' };
const GENERATED_BY = { '火':'木','土':'火','金':'土','水':'金','木':'水' };
const OVERCOMES = { '木':'土','火':'金','土':'水','金':'木','水':'火' };
const OVERCOME_BY = { '土':'木','金':'火','水':'土','木':'金','火':'水' };

const monthBranches = { '立春':'寅','驚蟄':'卯','清明':'辰','立夏':'巳','芒種':'午','小暑':'未',
  '立秋':'申','白露':'酉','寒露':'戌','立冬':'亥','大雪':'子','小寒':'丑' };

const wuhuDun = {
  '甲': ['丙','丁','戊','己','庚','辛','壬','癸','甲','乙','丙','丁'],
  '己': ['丙','丁','戊','己','庚','辛','壬','癸','甲','乙','丙','丁'],
  '乙': ['戊','己','庚','辛','壬','癸','甲','乙','丙','丁','戊','己'],
  '庚': ['戊','己','庚','辛','壬','癸','甲','乙','丙','丁','戊','己'],
  '丙': ['庚','辛','壬','癸','甲','乙','丙','丁','戊','己','庚','辛'],
  '辛': ['庚','辛','壬','癸','甲','乙','丙','丁','戊','己','庚','辛'],
  '丁': ['壬','癸','甲','乙','丙','丁','戊','己','庚','辛','壬','癸'],
  '壬': ['壬','癸','甲','乙','丙','丁','戊','己','庚','辛','壬','癸'],
  '戊': ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸','甲','乙'],
  '癸': ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸','甲','乙'],
};

const wushuDun = {
  '甲': ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸','甲','乙'],
  '己': ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸','甲','乙'],
  '乙': ['丙','丁','戊','己','庚','辛','壬','癸','甲','乙','丙','丁'],
  '庚': ['丙','丁','戊','己','庚','辛','壬','癸','甲','乙','丙','丁'],
  '丙': ['戊','己','庚','辛','壬','癸','甲','乙','丙','丁','戊','己'],
  '辛': ['戊','己','庚','辛','壬','癸','甲','乙','丙','丁','戊','己'],
  '丁': ['庚','辛','壬','癸','甲','乙','丙','丁','戊','己','庚','辛'],
  '壬': ['庚','辛','壬','癸','甲','乙','丙','丁','戊','己','庚','辛'],
  '戊': ['壬','癸','甲','乙','丙','丁','戊','己','庚','辛','壬','癸'],
  '癸': ['壬','癸','甲','乙','丙','丁','戊','己','庚','辛','壬','癸'],
};

const HOUR_REP_HOUR = { '子':23,'丑':1,'寅':3,'卯':5,'辰':7,'巳':9,'午':11,'未':13,'申':15,'酉':17,'戌':19,'亥':21 };

// ============================================================
// 二、年柱計算
// ============================================================
function getYearPillar(birthTs, calYear) {
  const lichunTs = getLichunUTC(calYear);
  let adjustedYear = calYear;
  if (birthTs < lichunTs) adjustedYear -= 1;
  const tgIdx = (adjustedYear - 3) % 10;
  const dzIdx = (adjustedYear - 3) % 12;
  const tg = TG[tgIdx === 0 ? 9 : tgIdx - 1];
  const dz = DZ[dzIdx === 0 ? 11 : dzIdx - 1];
  return { tg, dz, adjustedYear, lichunTs };
}

// ============================================================
// 三、月柱計算（五虎遁，以「節」為準）
// ============================================================
function getMonthPillar(birthTs, calYear, yearTiangan) {
  const jie = getCurrentJie(birthTs, calYear);
  const monthDizhi = monthBranches[jie.name];
  const monthOrder = ['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'];
  const monthIndex = monthOrder.indexOf(monthDizhi);
  const monthTiangan = wuhuDun[yearTiangan][monthIndex];
  return { tg: monthTiangan, dz: monthDizhi, jieName: jie.name, jieTs: jie.ts };
}

// ============================================================
// 四、日柱計算（1900-01-01 甲戌日為基準）
// ============================================================
function getDayPillar(calYear, calMonth, calDay) {
  const baseUTC = Date.UTC(1900, 0, 1);
  const dayUTC = Date.UTC(calYear, calMonth - 1, calDay);
  const daysDiff = Math.round((dayUTC - baseUTC) / 86400000);
  const tgIdx = ((0 + daysDiff) % 10 + 10) % 10;
  const dzIdx = ((10 + daysDiff) % 12 + 12) % 12;
  return { tg: TG[tgIdx], dz: DZ[dzIdx] };
}

// ============================================================
// 五、時柱計算（五鼠遁，早晚子時嚴格分界）
// ============================================================
function getNextDayTiangan(dayTg) {
  const idx = TG.indexOf(dayTg);
  return TG[(idx + 1) % 10];
}

function getHourPillar(shichen, dayTiangan) {
  const isLateZi = (shichen === '子'); // 子時代表 23:00-01:00，本工具以 23:00 起算為晚子時
  const effectiveDayTg = isLateZi ? getNextDayTiangan(dayTiangan) : dayTiangan;
  const dzIndex = DZ.indexOf(shichen);
  const hourTiangan = wushuDun[effectiveDayTg][dzIndex];
  return { tg: hourTiangan, dz: shichen, isLateZi, effectiveDayTg };
}

// ============================================================
// 五行計分 / 生剋關係
// ============================================================
function computeScores(pillars) {
  const scores = { '木':0,'火':0,'土':0,'金':0,'水':0 };
  pillars.forEach(p => {
    if (!p) return;
    scores[tianganWuxing[p.tg]]++;
    scores[dizhiWuxing[p.dz]]++;
  });
  return scores;
}

function scoreTags(scores) {
  const vals = WX_LIST.map(w => scores[w]);
  const max = Math.max(...vals);
  const min = Math.min(...vals);
  const tags = {};
  WX_LIST.forEach(w => {
    if (scores[w] === 0) tags[w] = `${w}元素相對不足`;
    else if (scores[w] === max) tags[w] = '旺';
    else if (scores[w] === min) tags[w] = '相對不足';
    else tags[w] = '';
  });
  return tags;
}

function getElementMeaningShort(element) {
  const map = {
    '木': '成長力與創造力', '火': '行動力與熱情',
    '土': '穩定性與責任感', '金': '決斷力與原則', '水': '智慧與洞察力'
  };
  return map[element] || '';
}

function getRecommendedElements(scores) {
  const total = Object.values(scores).reduce((a, b) => a + b, 0) || 1;
  const pct = {};
  WX_LIST.forEach(el => { pct[el] = scores[el] / total; });

  const maxScore = Math.max(...Object.values(scores));
  const dominant = WX_LIST.find(el => scores[el] === maxScore);

  // 被過旺五行所剋的元素（需要保護）
  const dominated = OVERCOMES[dominant];
  // 能平衡過旺五行的元素（建議參考）
  const controller = OVERCOME_BY[dominant];

  // ⚠️ 以下門檻是本 App 為了把數值轉換成可讀建議而制定的「產品判讀規則」，
  // 不是傳統命理既有的固定標準，兩者各自獨立設定，不強求數學對稱
  const WANG_THRESHOLD = 0.3;   // 偏旺門檻：暫定 30%
  const WEAK_THRESHOLD = 0.15;  // 偏弱門檻：暫定 15%

  const dominantIsWang = pct[dominant] >= WANG_THRESHOLD;

  // 【硬性排除規則】只要一個元素正被明顯過旺的元素剋制，
  // 就永遠不進入「補強候選」，只出現在「能量保護」，
  // 避免同一元素同時出現「建議補充」與「建議保護、非大量補充」的矛盾文案
  const protectedElement = dominantIsWang ? dominated : null;

  // 候選池：百分比 <= 15% 且未被歸類為能量保護的元素
  let weakCandidates = WX_LIST.filter(el => pct[el] <= WEAK_THRESHOLD && el !== protectedElement);

  // 排序：由低到高，0 分優先；同分時用固定五行順序 tie-break（木火土金水），
  // 現階段未做喜用神比對，不宣稱這個順序是絕對命理定論
  weakCandidates.sort((a, b) => {
    if (scores[a] !== scores[b]) return scores[a] - scores[b];
    return WX_LIST.indexOf(a) - WX_LIST.indexOf(b);
  });

  // 上限只是「避免資訊過載」的天花板，不是湊數目標；
  // 候選池有幾個算幾個，最多顯示 2 個
  const primaryRecommend = weakCandidates[0] || controller;
  const secondaryRecommend = weakCandidates[1] || null;
  const hasTie = weakCandidates.length >= 2 && scores[weakCandidates[0]] === scores[weakCandidates[1]];

  const weakToStrengthen = weakCandidates.slice(0, 2);
  const weakToProtect = protectedElement ? [protectedElement] : [];

  const strengthenNames = weakToStrengthen.map(el => `「${el}」`).join('、');

  let description;

  if (weakToStrengthen.length > 0 && weakToProtect.length > 0) {
    // 標準情況：有明顯偏弱元素，且有明顯過旺元素在剋制別人
    description = `目前 ${strengthenNames} 元素相對偏弱，
      若僅依五行分布，可優先參考「${primaryRecommend}」屬性元素
      （${getElementMeaningShort(primaryRecommend)}）${secondaryRecommend
        ? `，輔以「${secondaryRecommend}」屬性元素（${getElementMeaningShort(secondaryRecommend)}）`
        : ''}
      ${hasTie ? '（本報告依既定判斷順序呈現，非絕對命理定論）' : ''}。
      同時，你的「${dominated}」能量（${getElementMeaningShort(dominated)}）
      正受到過旺「${dominant}」能量的壓制，
      建議透過佩戴對應水晶加以保護與滋養，而非大量補充。
      完整補運方向仍建議結合喜用神判斷，避免過度補充單一五行。`;
  } else if (weakToProtect.length > 0) {
    // 被剋元素剛好也是最低分
    description = `目前命盤中「${dominated}」能量
      （${getElementMeaningShort(dominated)}）受到過旺「${dominant}」的壓制，
      需要特別保護與滋養。
      若僅依五行分布，可參考「${controller}」屬性元素，
      有助於平衡過旺的「${dominant}」能量。
      完整補運方向仍建議結合喜用神判斷。`;
  } else if (weakToStrengthen.length > 0) {
    // 命盤相對平均，沒有元素旺到需要特別保護，只需一般補強建議
    description = `目前 ${strengthenNames} 元素相對偏弱，
      若僅依五行分布，可優先參考「${primaryRecommend}」屬性元素
      （${getElementMeaningShort(primaryRecommend)}）${secondaryRecommend
        ? `，輔以「${secondaryRecommend}」屬性元素（${getElementMeaningShort(secondaryRecommend)}）`
        : ''}
      ${hasTie ? '（本報告依既定判斷順序呈現，非絕對命理定論）' : ''}。
      完整補運方向仍建議結合喜用神判斷，避免過度補充單一五行。`;
  } else {
    // 五行完全平均的極端狀況
    description = `你的命盤五行分布相對均衡，沒有特別突出的過旺或不足元素。
      建議維持目前的生活節奏與習慣，完整補運方向仍建議結合喜用神判斷。`;
  }

  return {
    dominant,
    dominated,
    controller,
    primary: primaryRecommend,
    secondary: secondaryRecommend,
    allWeak: weakCandidates,
    weakToStrengthen,
    weakToProtect,
    dominantIsWang,
    hasTie,
    hasMultipleWeak: weakToStrengthen.length > 1,
    description
  };
}

    '木': '#8BA888', '火': '#C47A6A',
    '土': '#C4A55A', '金': '#C8B898', '水': '#7A9AAA'
  };
  return map[element] || '#B0A898';
}

function getElementGradient(element) {
  const gradients = {
    '木': 'linear-gradient(135deg, rgba(122,154,120,0.08) 0%, rgba(245,240,235,0.95) 60%)',
    '火': 'linear-gradient(135deg, rgba(196,122,106,0.08) 0%, rgba(245,240,235,0.95) 60%)',
    '土': 'linear-gradient(135deg, rgba(196,165,90,0.08) 0%, rgba(245,240,235,0.95) 60%)',
    '金': 'linear-gradient(135deg, rgba(184,168,136,0.08) 0%, rgba(245,240,235,0.95) 60%)',
    '水': 'linear-gradient(135deg, rgba(122,154,170,0.08) 0%, rgba(245,240,235,0.95) 60%)'
  };
  return gradients[element] || gradients['土'];
}

function getHeaderGradient(element) {
  const gradients = {
    '木': 'linear-gradient(180deg, rgba(122,154,120,0.12) 0%, rgba(245,240,235,0) 100%)',
    '火': 'linear-gradient(180deg, rgba(196,122,106,0.12) 0%, rgba(245,240,235,0) 100%)',
    '土': 'linear-gradient(180deg, rgba(196,165,90,0.12) 0%, rgba(245,240,235,0) 100%)',
    '金': 'linear-gradient(180deg, rgba(184,168,136,0.12) 0%, rgba(245,240,235,0) 100%)',
    '水': 'linear-gradient(180deg, rgba(122,154,170,0.12) 0%, rgba(245,240,235,0) 100%)'
  };
  return gradients[element] || gradients['土'];
}

function animateCompletenessRing(svgId, targetPercent, circumference, targetOffset) {
  const ring = document.getElementById(svgId + '-ring');
  const numEl = document.getElementById(svgId + '-num');
  if (!ring || !numEl) return;

  let start = null;
  const duration = 1200;

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function step(timestamp) {
    if (!start) start = timestamp;
    const elapsed = timestamp - start;
    const progress = Math.min(elapsed / duration, 1);
    const eased = easeOutCubic(progress);

    ring.setAttribute('stroke-dashoffset', circumference - eased * (circumference - targetOffset));
    numEl.textContent = Math.round(eased * targetPercent) + '%';

    if (progress >= 1 && targetPercent === 100) {
      ring.style.filter = 'drop-shadow(0 0 4px #C4A55A88)';
      setTimeout(() => { if (ring) ring.style.filter = 'none'; }, 800);
    }

    if (progress < 1) requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}

function radarPoint(angleDeg, r, cx, cy) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function renderTab1() {
  const s = STATE;
  const cx = 150, cy = 150, maxR = 105;
  const maxPossible = s.hasHour ? 8 : 6;
  const angles = [0, 72, 144, 216, 288];

  let gridSvg = '';
  [0.33, 0.66, 1].forEach(f => {
    const pts = angles.map(a => { const p = radarPoint(a, maxR * f, cx, cy); return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
    gridSvg += `<polygon points="${pts}" fill="none" stroke="#DCD3C8" stroke-width="0.7"/>`;
  });
  angles.forEach(a => {
    const p = radarPoint(a, maxR, cx, cy);
    gridSvg += `<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="#DCD3C8" stroke-width="0.7"/>`;
  });

  const dataPts = WX_LIST.map((w, i) => {
    const r = (s.scores[w] / maxPossible) * maxR;
    return radarPoint(angles[i], Math.max(r, 4), cx, cy);
  });
  const dataPolyPts = dataPts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');

  let labelsSvg = '';
  WX_LIST.forEach((w, i) => {
    const p = radarPoint(angles[i], maxR + 22, cx, cy);
    labelsSvg += `<text x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="${WX_COLOR_DARK[w]}" font-family="Noto Serif TC, serif">${w}</text>`;
  });

  const radarSvg = `<svg xmlns="http://www.w3.org/2000/svg" id="radar-svg" viewBox="0 0 300 300" width="280" height="280">
    ${gridSvg}
    <polygon class="data-poly" points="${dataPolyPts}" fill="rgba(184,150,90,0.32)" stroke="#B8965A" stroke-width="1.5"/>
    ${dataPts.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${WX_COLOR[WX_LIST[i]]}"/>`).join('')}
    ${labelsSvg}
  </svg>`;

  const legend = WX_LIST.map(w => `<div class="radar-legend-item"><span class="radar-legend-dot" style="background:${WX_COLOR[w]}"></span>${w} ${s.scores[w]}分</div>`).join('');

  const radarBlock = `<div class="radar-wrap">
    <span class="radar-badge ${s.hasHour ? 'full' : 'partial'}">${s.hasHour ? '完整版（四柱分析）' : '70% 版（三柱初步分析）'}</span>
    ${radarSvg}
    <div class="radar-legend">${legend}</div>
    ${!s.hasHour ? '<div style="font-size:11px;color:#9A8A7A;margin-top:10px">補充出生時辰可解鎖完整能量圖</div>' : ''}
  </div>`;

  const tags = scoreTags(s.scores);
  let barsHtml = '<div style="background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:20px 20px 8px;margin-bottom:20px">';
  WX_LIST.forEach(w => {
    const pct = Math.round((s.scores[w] / maxPossible) * 100);
    barsHtml += `<div class="bar-row">
      <div class="bar-label">${w}</div>
      <div class="bar-track"><div class="bar-fill" data-pct="${pct}" style="background:${WX_COLOR[w]}"><span class="bar-fill-val">${s.scores[w]}</span></div></div>
      <div class="bar-tag">${tags[w] || ''}</div>
    </div>`;
  });
  barsHtml += '</div>';

  const shengke = renderWuxingInteraction(s.scores);

  document.getElementById('tab-1').innerHTML =
    '<div class="section-title">五行雷達圖</div>' + radarBlock +
    '<div class="section-title">五行長條圖</div>' + barsHtml +
    '<div class="section-title">五行生剋關係說明</div>' +
    `<div class="shengke-box">${shengke}</div>`;
}

  WHEEL_SECTORS.forEach((sec, i) => {
    const a0 = (i / 5) * 360 - 90, a1 = ((i + 1) / 5) * 360 - 90;
    const p0 = radarPoint(a0 + 90, r, cx, cy), p1 = radarPoint(a1 + 90, r, cx, cy);
    const mid = radarPoint((a0 + a1) / 2 + 90, r * 0.62, cx, cy);
    paths += `<path class="wheel-sector" d="M${cx},${cy} L${p0.x.toFixed(1)},${p0.y.toFixed(1)} A${r},${r} 0 0 1 ${p1.x.toFixed(1)},${p1.y.toFixed(1)} Z" fill="${sec.color}" fill-opacity="0.75" stroke="#fff" stroke-width="1.5" onclick="selectWheel('${sec.key}')"/>
      <text x="${mid.x.toFixed(1)}" y="${mid.y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#fff" style="pointer-events:none">${sec.label}</text>`;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">${paths}<circle cx="${cx}" cy="${cy}" r="26" fill="#fff"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="12" fill="#8A7A68">選擇</text></svg>`;
}

function selectWheel(key) {
  const s = STATE;
  const map = { health:'stability', spirit: null };
  const dim = map[key] !== undefined ? (map[key] || 'avg') : key;
  const sorted = [...WX_LIST].sort((a, b) => s.scores[a] - s.scores[b]);
  const candidates = [sorted[0], sorted[1]].flatMap(el => wuxingCrystals[el].primary.map(c => ({ ...c, el })));
  let best = candidates[0], bestScore = -1;
  candidates.forEach(c => {
    const val = dim === 'avg' ? (c.ratings.wealth + c.ratings.career + c.ratings.love + c.ratings.stability) / 4 : c.ratings[dim];
    if (val > bestScore) { bestScore = val; best = c; }
  });
  const label = WHEEL_SECTORS.find(w => w.key === key).label;
  document.getElementById('wheel-result').innerHTML = `
    <div class="wheel-result-title">「${label}」需求推薦</div>
    <div class="wheel-result-card">
      <div class="crystal-name" style="margin-bottom:6px">${best.name}　<span class="crystal-wx-tag" style="background:${WX_COLOR[best.el]}">${best.el}</span></div>
      <div class="crystal-reason">${best.reason}</div>
    </div>`;
}

function beadSVG(colors, size) {
  size = size || 220;
  const n = colors.length;
  const r = size / 2 - 20;
  const cx = size / 2, cy = size / 2;
  let defs = '', circles = '';
  colors.forEach((c, i) => {
    const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
    const x = cx + r * Math.cos(angle), y = cy + r * Math.sin(angle);
    // 用遞增計數器取代 Math.random()，確保同一次渲染中（基礎版＋進階版共 3 個 beadSVG）
    // 產生的漸層 id 在整份文件內一定唯一，避免極小機率的 id 碰撞導致漸層參照錯誤
    const gid = 'grad_' + i + '_' + (beadSvgGradientCounter++);
    defs += `<radialGradient id="${gid}" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#fff" stop-opacity="0.85"/><stop offset="45%" stop-color="${c}" stop-opacity="0.92"/><stop offset="100%" stop-color="${c}"/></radialGradient>`;
    circles += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13" fill="url(#${gid})" stroke="rgba(255,255,255,0.6)" stroke-width="0.6" style="animation:crystalGlow 3s ease-in-out ${(i * 0.15).toFixed(2)}s infinite"/>`;
  });
  // xmlns 是必要的：html2canvas 下載截圖時會把這段 SVG 序列化成獨立的
  // data:image/svg+xml 圖片來源，沒有 xmlns 的話部分瀏覽器/畫布引擎會載入失敗，
  // 產生 0 寬高的圖片，後續 createPattern 就會拋錯（下載失敗的成因）
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block"><defs>${defs}</defs>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E8DDD5" stroke-width="1" stroke-dasharray="2 5"/>
    ${circles}</svg>`;
}

// ============================================================
// 下載 / 分享 / URL 參數
// ============================================================
async function ensureHtml2Canvas() {
  // 動態載入 html2canvas（若頁面載入時的 <script> 標籤被擋，這裡再重試一次）。
  // 指向本機 vendor/ 目錄下的檔案，不打網路，file:// 離線開啟也能用。
  if (typeof html2canvas === 'undefined') {
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'vendor/html2canvas.min.js';
      script.onload = resolve;
      script.onerror = () => reject(new Error('html2canvas 載入失敗，請確認 vendor/html2canvas.min.js 是否存在'));
      document.head.appendChild(script);
    });
  }
}

// 強制觸發一次 reflow：讀取 offsetHeight 會逼瀏覽器把目前排隊中的樣式／版面計算
// 立刻算完，而不是假設「應該已經算完了」。單靠 setTimeout(fn, 0) 或猜一個毫秒數
// 並不保證版面真的定案——不同瀏覽器的排程時機不同，這正是 Chrome 會失敗、
// Edge 卻矇對的原因。
function forceReflow(el) {
  void el.offsetHeight;
}

function nextFrame() {
  return new Promise(resolve => requestAnimationFrame(resolve));
}

// 疊兩次 requestAnimationFrame：第一次 rAF 保證瀏覽器至少跑完一次排版／繪製，
// 第二次 rAF 保證我們是在「上一輪繪製結果」都已經反映到畫面之後才繼續，
// 前後各強制一次 reflow 讓量測到的尺寸不是舊值。
async function waitForVisualUpdate(el) {
  forceReflow(el);
  await nextFrame();
  await nextFrame();
  forceReflow(el);
}

// 判斷元素本身或任一祖先是否為 display:none。
// 用來排除「本來就刻意隱藏」的節點（例如「下載本頁 PNG」截圖流程把已轉成 <img>
// 的原始 canvas 主動隱藏），這些 0 尺寸是預期行為，不是排版還沒完成，
// 不該被當成需要重試等待的訊號。
function isHiddenByDisplayNone(el) {
  for (let node = el; node; node = node.parentElement) {
    if (getComputedStyle(node).display === 'none') return true;
  }
  return false;
}

// 產生一個節點的可辨識描述（tag / id / class / 所在區塊 / 文字片段），
// 讓診斷訊息能指出「是哪一個」0 尺寸節點，而不是只回報「有節點是 0 尺寸」。
function describeVisualNode(node) {
  const tag = node.tagName ? node.tagName.toLowerCase() : '(unknown)';
  const id = node.id ? `#${node.id}` : '';
  const cls = (node.className && typeof node.className === 'string' && node.className.trim())
    ? `.${node.className.trim().split(/\s+/).join('.')}`
    : (node.getAttribute && node.getAttribute('class') ? `.${node.getAttribute('class').trim().split(/\s+/).join('.')}` : '');
  const closestCard = node.closest && node.closest('[class*="card"],[class*="section"],[class*="tab-pane"]');
  const container = closestCard ? `（所在區塊：${closestCard.tagName.toLowerCase()}${closestCard.id ? '#' + closestCard.id : ''}${closestCard.className ? '.' + String(closestCard.className).trim().split(/\s+/).join('.') : ''}）` : '';
  const rect = node.getBoundingClientRect();
  return `${tag}${id}${cls} width=${rect.width} height=${rect.height}${container}`;
}

// 找出範圍內任何「應該要看得到」卻量到 0 寬或 0 高的 svg / canvas，
// 回傳完整清單（不是只回傳布林值），讓呼叫端可以印出是哪些節點出問題。
// html2canvas 內部會先把這些節點畫成暫存 canvas，再用 createPattern 貼上，
// 0 尺寸會讓 createPattern 直接拋出 InvalidStateError（下載失敗的成因）。
function collectZeroSizedVisuals(root) {
  const nodes = root.querySelectorAll('svg, canvas');
  const zeroSized = [];
  for (const node of nodes) {
    if (isHiddenByDisplayNone(node)) continue;
    const rect = node.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) zeroSized.push(node);
  }
  return zeroSized;
}

function hasZeroSizedVisual(root) {
  return collectZeroSizedVisuals(root).length > 0;
}

// 不是賭「等一下應該就好了」，而是實際檢查尺寸：量到 0 就再等一輪重新檢查，
// 直到真的量到非 0 尺寸（或已達重試上限）才放行，讓後續呼叫 html2canvas 之前
// 畫面一定是穩定、已完成排版的狀態。
async function waitUntilVisualsReady(root, maxRetries = 8) {
  let zeroSized = [];
  for (let i = 0; i < maxRetries; i++) {
    await waitForVisualUpdate(root);
    zeroSized = collectZeroSizedVisuals(root);
    if (zeroSized.length === 0) return;
  }
  // 用 console.error（而非 console.warn/console.group）確保一定會直接顯示在
  // Console 面板中，不會被摺疊成「N hidden」而需要使用者手動展開才看得到。
  console.error(
    `=== 下載前診斷：尺寸為 0 的 canvas/svg 清單（重試 ${maxRetries} 次後仍量到 0 尺寸，共 ${zeroSized.length} 個）===\n` +
    zeroSized.map((node, i) => `  [${i + 1}] ${describeVisualNode(node)}`).join('\n')
  );
}

function fixClonedSvgAndCanvasForCapture(clonedDoc) {
  // 防呆：把寬高為 0 的 SVG 修正為有效尺寸，避免 html2canvas 產生 0 尺寸畫布而報錯
  clonedDoc.querySelectorAll('svg').forEach(svg => {
    const w = parseInt(svg.getAttribute('width') || '0');
    const h = parseInt(svg.getAttribute('height') || '0');
    if (w === 0 || h === 0) {
      const box = svg.getAttribute('viewBox');
      if (box) {
        const parts = box.trim().split(/\s+/);
        if (parts.length >= 4) {
          svg.setAttribute('width', parts[2]);
          svg.setAttribute('height', parts[3]);
        }
      } else {
        svg.setAttribute('width', '100');
        svg.setAttribute('height', '100');
      }
    }
    if (!svg.getAttribute('xmlns')) svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    svg.style.display = 'block';
    svg.style.visibility = 'visible';
  });

  // 防呆：已被替換成 img 的 canvas 一律隱藏並中和尺寸，避免 createPattern 報錯
  clonedDoc.querySelectorAll('canvas').forEach(c => {
    c.style.display = 'none';
    if (c.width === 0) c.width = 1;
    if (c.height === 0) c.height = 1;
  });

  // 防呆：CSS 漸層背景（linear-gradient / radial-gradient）在 html2canvas 內部
  // 也是先畫到一張跟該元素尺寸相同的暫存 canvas，再用 createPattern 貼上——
  // 「強制展開所有分頁一次性截圖」時，若某個平常沒展開過的分頁／設計版本裡
  // 有元素在複製出來的文件中量到 0 寬或 0 高（例如版面還沒 reflow 完成），
  // 那張暫存 canvas 也會是 0 尺寸而讓 createPattern 報錯。
  // 0 尺寸的元素本來就不會顯示任何內容，直接拿掉背景圖對畫面沒有影響，
  // 是最安全、不需要更動排版時機的修法。
  const captureWin = clonedDoc.defaultView || window;
  clonedDoc.querySelectorAll('*').forEach(el => {
    let bg;
    try { bg = captureWin.getComputedStyle(el).backgroundImage; } catch (e) { return; }
    if (!bg || bg === 'none' || !bg.includes('gradient')) return;
    const rect = el.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) {
      el.style.backgroundImage = 'none';
    }
  });

  // 截圖不需要任何互動用按鈕（換個設計、下載/分享按鈕等）
  clonedDoc.querySelectorAll('button').forEach(b => { b.style.display = 'none'; });
}

// 共用截圖邏輯：把 targetElement 轉成 PNG 並觸發下載，btn 用來顯示載入/完成狀態
async function captureElementToPng(targetElement, filename, btn) {
  const originalText = btn ? btn.innerHTML : '';
  let canvasReplacements = [];
  let bgImageBackups = [];

  try {
    if (btn) btn.innerHTML = '⏳ 產生中...';
    await ensureHtml2Canvas();

    // 不猜時間：強制 reflow 並等待畫面真的更新完成，才開始量測 canvas 尺寸
    await waitForVisualUpdate(targetElement);

    // 截圖前：把所有有內容的 canvas 元素暫時替換成靜態圖片，0 尺寸的直接隱藏
    targetElement.querySelectorAll('canvas').forEach(c => {
      if (c.width > 0 && c.height > 0) {
        const img = document.createElement('img');
        try {
          img.src = c.toDataURL('image/png');
          img.style.cssText = c.style.cssText;
          img.style.width = c.width + 'px';
          img.style.height = c.height + 'px';
          c.parentNode.insertBefore(img, c);
          c.style.display = 'none';
          canvasReplacements.push({ canvas: c, img, hidden: false });
        } catch (e) {
          console.log('canvas 轉圖失敗（可能跨域）:', e);
        }
      } else {
        canvasReplacements.push({ canvas: c, img: null, hidden: true, originalDisplay: c.style.display });
        c.style.display = 'none';
      }
    });

    // 移除所有以 canvas 當作 background-image 的內聯樣式（url() 型背景保留）
    targetElement.querySelectorAll('*').forEach(el => {
      const bg = window.getComputedStyle(el).backgroundImage;
      if (bg && bg !== 'none' && bg.includes('canvas')) {
        bgImageBackups.push({ el, original: el.style.backgroundImage });
        el.style.backgroundImage = 'none';
      }
    });

    // 呼叫 html2canvas 前的最後防呆：確認範圍內每個 svg / canvas 都量到非 0 尺寸，
    // 量不到就再多等幾輪重新檢查，而不是直接讓 html2canvas 去撞到 createPattern 的錯誤
    await waitUntilVisualsReady(targetElement);

    const canvas = await html2canvas(targetElement, {
      scale: 2,
      useCORS: false,      // file: 協議下改為 false
      allowTaint: true,    // 允許跨域污染
      backgroundColor: '#F5F0EB',
      scrollX: 0,
      scrollY: 0,
      width: targetElement.scrollWidth,
      height: targetElement.scrollHeight,
      logging: false,
      imageTimeout: 0,     // 不限制圖片載入時間
      onclone: fixClonedSvgAndCanvasForCapture
    });

    // 還原所有暫時性修改
    canvasReplacements.forEach(({ canvas: c, img, hidden, originalDisplay }) => {
      if (hidden) {
        c.style.display = originalDisplay || '';
      } else {
        c.style.display = '';
        if (img && img.parentNode) img.parentNode.removeChild(img);
      }
    });
    bgImageBackups.forEach(({ el, original }) => { el.style.backgroundImage = original; });

    const link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png', 1.0);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    if (btn) btn.innerHTML = '✓ 下載完成';
    setTimeout(() => { if (btn) btn.innerHTML = originalText; }, 2000);

  } catch (err) {
    console.error('下載失敗:', err);

    canvasReplacements.forEach(({ canvas: c, img, hidden, originalDisplay }) => {
      if (hidden) {
        c.style.display = originalDisplay || '';
      } else {
        c.style.display = '';
        if (img && img.parentNode) img.parentNode.removeChild(img);
      }
    });
    bgImageBackups.forEach(({ el, original }) => { el.style.backgroundImage = original; });

    if (btn) btn.innerHTML = originalText;

    alert(`下載失敗：${err.message}`);
  }
}

// 「下載完整報告」用瀏覽器原生列印機制（window.print + @media print）。
// 不透過 html2canvas 把畫面截圖成 PDF：html2canvas 在 Claire 的真實 Chrome
// 環境下反覆撞到 createPattern 相關的崩潰錯誤，即使自動化測試環境跑得過，
// 也無法排除同樣的風險在真實環境重演。優先順序上「下載完成後能穩定開啟、
// 不出現錯誤畫面」高於「檔名一定要自動帶對」，所以改回這條路徑——
// 原生列印完全由瀏覽器自己的排版引擎接手，不存在「JS 搶在畫面畫完前擷取」
// 這種時間差問題，從根本避免那類不穩定。
// 全部分頁的展開/排列、按鈕與導覽列的隱藏，都交給上面的 `@media print` CSS
// 負責，這裡不需要（也不應該）手動切換 class 或等待任何非同步時機。
function printFullReport() {
  const name = ((STATE && STATE.name) || '訪客').replace(/[\\/:*?"<>|]/g, '_');
  const now = new Date();
  const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
  const originalTitle = document.title;
  // Chrome「另存為 PDF」視窗的檔案名稱欄位預設值取自 document.title。
  // 注意：document.title 的 setter 只在 renderer process 內同步生效；
  // renderer 還要透過一次非同步的 IPC 才會把新標題送到 browser process
  // （真正畫「另存新檔」視窗、決定預設檔名的地方）。如果 window.print()
  // 緊接著同一輪 JS 呼叫，browser process 有可能還沒收到這次 IPC，
  // 於是列印視窗仍抓到舊標題（甚至是還沒收到任何標題的空值）。
  // 這是只驗證「JS 這層的 document.title 值」測不出來的落差，
  // 所以這裡改成延後一個 tick 才呼叫 window.print()，讓 IPC 有機會先送達。
  // 就算偶爾還是沒帶出來，使用者手動輸入檔名即可，不強求一定要自動帶對。
  document.title = `${name}-五行能量報告-${dateStr}`;
  const restoreTitle = () => {
    document.title = originalTitle;
    window.removeEventListener('afterprint', restoreTitle);
  };
  window.addEventListener('afterprint', restoreTitle);
  setTimeout(() => {
    console.log('列印前的 document.title:', document.title);
    window.print();
  }, 100);
}

const TAB_PANE_LABELS = ['八字命盤', '五行能量圖', '專屬能量分析', '水晶推薦', '手鍊設計', '能量清單'];

async function downloadCurrentTabReport() {
  const btn = document.getElementById('download-current-btn');
  const tabPanes = [...document.querySelectorAll('.tab-pane')];
  const activeIndex = Math.max(0, tabPanes.findIndex(p => p.classList.contains('active')));
  const activePane = tabPanes[activeIndex];
  if (!activePane) { alert('找不到目前分頁內容，請先切換到想下載的分頁'); return; }

  const tabLabel = TAB_PANE_LABELS[activeIndex] || '本頁';
  const name = (STATE && STATE.name) || '訪客';
  await captureElementToPng(activePane, `${name}-${tabLabel}.png`, btn);
}

function shareLink() {
  if (!STATE) return;
  const s = STATE;
  const b = '' + s.year + String(s.month).padStart(2, '0') + String(s.day).padStart(2, '0');
  const params = new URLSearchParams();
  params.set('b', b);
  params.set('n', s.name);
  if (s.hasHour) params.set('h', s.shichen + '時');
  const url = location.origin + location.pathname + '?' + params.toString();
  const btn = document.getElementById('share-btn');
  const done = () => { const old = btn.innerHTML; btn.innerHTML = '已複製連結'; setTimeout(() => btn.innerHTML = old, 1800); };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done).catch(() => prompt('複製連結：', url));
  else prompt('複製連結：', url);
}

function applyUrlParams() {
  const params = new URLSearchParams(location.search);
  const b = params.get('b'), n = params.get('n'), h = params.get('h');
  if (!b || b.length !== 8) return;
  const y = parseInt(b.slice(0, 4)), m = parseInt(b.slice(4, 6)), d = parseInt(b.slice(6, 8));
  if (!y || !m || !d) return;
  document.getElementById('year-input').value = y;
  document.getElementById('month-input').value = m;
  populateDays();
  document.getElementById('day-input').value = d;
  if (n) document.getElementById('name-input').value = decodeURIComponent(n);
  if (h) {
    const shichenChar = h.replace('時', '');
    document.getElementById('hour-input').value = shichenChar;
    document.getElementById('hour-panel').classList.add('open');
    document.getElementById('hour-toggle-icon').classList.add('open');
  }
  analyze();
}
applyUrlParams();
